<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#07060d">
<title>Lanternbound</title>
<style>
:root{
  --ink:#fbf1da; --muted:#c7b896; --gold:#ffcf6b; --ember:#ff8a3d; --night:#07060d;
  --panel:rgba(17,13,29,.94); --panel2:rgba(33,25,52,.96); --line:rgba(255,207,107,.38);
  --good:#7ee08a; --bad:#ff6b7a; --sky:#8fd3ff;
  --serif:"Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
  --sans:"Avenir Next","Segoe UI",system-ui,-apple-system,sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#040308;overflow:hidden;color:var(--ink);font-family:var(--sans);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#ui{position:fixed;pointer-events:none;font-size:max(12px,calc(var(--s,1) * 17px));z-index:2}
#ui > *{pointer-events:auto}

/* dialog */
#dialog{position:absolute;left:6%;right:6%;bottom:4%;min-height:24%;background:linear-gradient(180deg,var(--panel2),var(--panel));border:2px solid var(--line);border-radius:.8em;padding:1em 1.3em 1.1em 1.3em;box-shadow:0 .6em 2.4em rgba(0,0,0,.6),inset 0 0 2em rgba(255,190,90,.06);display:flex;gap:1em;align-items:flex-start;pointer-events:auto}
#dialog .por{flex:0 0 auto;width:4.6em;height:4.6em;border-radius:.6em;background:rgba(0,0,0,.35);border:1px solid var(--line)}
#dialog .body{flex:1;min-width:0}
#dialog .who{font-family:var(--serif);font-weight:700;color:var(--gold);letter-spacing:.04em;margin-bottom:.25em;font-size:1.05em}
#dialog .txt{line-height:1.45;font-size:1.08em;min-height:2.9em;white-space:pre-wrap}
#dialog .txt b{color:var(--gold);font-weight:700}
#dialog .txt i{color:var(--sky);font-style:normal}
#dialog .more{position:absolute;right:1em;bottom:.5em;color:var(--gold);animation:bob 1s infinite;font-size:.9em}
#dialog .choices{display:flex;gap:.6em;margin-top:.6em;flex-wrap:wrap}
@keyframes bob{50%{transform:translateY(.2em)}}

/* generic menu */
#menu{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(5,4,10,.62);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
#menu.clear{background:transparent;backdrop-filter:none;-webkit-backdrop-filter:none}
.panel{background:linear-gradient(180deg,var(--panel2),var(--panel));border:2px solid var(--line);border-radius:1em;padding:1.2em 1.4em;box-shadow:0 1em 3em rgba(0,0,0,.65);max-width:92%;max-height:92%;overflow:auto;min-width:min(26em,92%)}
.panel h1,.panel h2{font-family:var(--serif);color:var(--gold);margin:.1em 0 .6em;letter-spacing:.04em;font-weight:700}
.panel h1{font-size:1.9em}.panel h2{font-size:1.35em}
.panel p{margin:.3em 0 .7em;line-height:1.45;color:var(--ink)}
.panel .sub{color:var(--muted);font-size:.9em}
.opts{display:flex;flex-direction:column;gap:.45em}
.opt{display:flex;align-items:center;gap:.7em;padding:.62em .9em;border-radius:.6em;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.04);cursor:pointer;color:var(--ink);font:inherit;text-align:left;width:100%}
.opt:hover,.opt.on{border-color:var(--gold);background:rgba(255,207,107,.13);box-shadow:0 0 0 1px rgba(255,207,107,.25) inset}
.opt.dis{opacity:.42}
.opt .r{margin-left:auto;color:var(--muted);font-size:.9em}
.opt .ic{width:2em;height:2em;flex:0 0 auto}
.row{display:flex;gap:1em;flex-wrap:wrap}
.tabs{display:flex;gap:.4em;margin-bottom:.9em;flex-wrap:wrap}
.tab{padding:.4em .9em;border-radius:2em;border:1px solid rgba(255,255,255,.12);cursor:pointer;color:var(--muted);background:none;font:inherit}
.tab.on{color:#1a1206;background:var(--gold);border-color:var(--gold);font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(4.2em,1fr));gap:.5em}
.cell{aspect-ratio:1;border-radius:.6em;border:1px solid rgba(255,255,255,.1);background:rgba(0,0,0,.25);display:flex;align-items:center;justify-content:center;position:relative;cursor:pointer}
.cell.on{border-color:var(--gold);background:rgba(255,207,107,.14)}
.cell.none{opacity:.25;cursor:default}
.cell canvas{width:78%;height:78%}
.cell .n{position:absolute;right:.25em;bottom:.1em;font-size:.75em;color:var(--gold);font-weight:700}
.desc{margin-top:.8em;min-height:3.4em;padding:.7em .9em;border-radius:.6em;background:rgba(0,0,0,.28);line-height:1.4}
.desc b{color:var(--gold)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:.25em 1em;font-size:.95em}
.kv span:nth-child(odd){color:var(--muted)}
.hint{color:var(--muted);font-size:.82em;margin-top:.8em}
.key{display:inline-block;min-width:1.6em;padding:.05em .4em;border-radius:.35em;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.08);font-size:.85em;text-align:center;margin:0 .1em}
canvas.map{display:block;margin:0 auto;max-width:100%;border-radius:.5em;background:rgba(0,0,0,.35)}
.quest{padding:.55em .8em;border-left:3px solid var(--gold);background:rgba(255,255,255,.04);border-radius:.3em;margin:.4em 0;line-height:1.4}
.quest.done{border-color:var(--good);opacity:.6}
.slot{display:flex;flex-direction:column;align-items:stretch;gap:.2em}
.slot .t{font-family:var(--serif);font-weight:700;color:var(--gold)}
.bar{height:.5em;border-radius:1em;background:rgba(255,255,255,.1);overflow:hidden}
.bar i{display:block;height:100%;background:var(--gold)}
input[type=range]{width:10em;accent-color:var(--gold)}

/* toast + banner */
#toast{position:absolute;left:50%;top:13%;transform:translateX(-50%);pointer-events:none;display:flex;flex-direction:column;align-items:center;gap:.4em}
#toast div{background:var(--panel);border:1px solid var(--line);padding:.45em 1em;border-radius:2em;font-size:.9em;animation:tin .25s ease-out;white-space:nowrap}
@keyframes tin{from{opacity:0;transform:translateY(-.5em)}}

/* touch */
#touch{position:fixed;inset:0;pointer-events:none;z-index:3}
#touch .stick{position:absolute;left:4vmin;bottom:5vmin;width:30vmin;height:30vmin;border-radius:50%;background:rgba(255,255,255,.06);border:2px solid rgba(255,255,255,.14);pointer-events:auto;touch-action:none}
#touch .knob{position:absolute;left:50%;top:50%;width:12vmin;height:12vmin;margin:-6vmin 0 0 -6vmin;border-radius:50%;background:rgba(255,207,107,.35);border:2px solid rgba(255,207,107,.6)}
#touch .btns{position:absolute;right:4vmin;bottom:5vmin;width:36vmin;height:32vmin;pointer-events:none}
#touch .tb{position:absolute;border-radius:50%;background:rgba(20,15,32,.55);border:2px solid rgba(255,207,107,.5);color:var(--gold);font-weight:800;display:flex;align-items:center;justify-content:center;pointer-events:auto;touch-action:none;font-size:4vmin;font-family:var(--sans)}
#touch .tb.on{background:rgba(255,207,107,.35)}
#touch .tb canvas{width:70%;height:70%;pointer-events:none}
#touch .a{width:15vmin;height:15vmin;right:0;bottom:4vmin}
#touch .b{width:13vmin;height:13vmin;right:17vmin;bottom:0}
#touch .c{width:9vmin;height:9vmin;right:19vmin;bottom:15vmin;font-size:3vmin}
#touch .d{width:9vmin;height:9vmin;right:3vmin;bottom:21vmin;font-size:3vmin}
#touch .top{position:absolute;top:calc(2vmin + env(safe-area-inset-top,0px));left:calc(2vmin + env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:2vmin;pointer-events:none}
#touch .rot{position:absolute;left:0;right:0;top:26vh;text-align:center;color:var(--muted);font-family:var(--serif);font-size:16px;pointer-events:none;display:none}
@media (orientation: portrait){#touch .rot{display:block}}
#touch .stick{left:calc(4vmin + env(safe-area-inset-left,0px))}
#touch .btns{right:calc(4vmin + env(safe-area-inset-right,0px))}
#touch .top .tb{position:static;width:9vmin;height:9vmin;font-size:3vmin}

#boot{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;color:var(--muted);font-family:var(--serif);font-size:20px;z-index:9;background:#040308}
</style>
</head>
<body>
<div id="boot">Lighting the lantern…</div>
<canvas id="c"></canvas>
<div id="ui">
  <div id="dialog" hidden><canvas class="por" width="96" height="96" hidden></canvas><div class="body"><div class="who"></div><div class="txt"></div><div class="choices"></div></div><div class="more">▼</div></div>
  <div id="menu" hidden></div>
  <div id="toast"></div>
</div>
<div id="touch" hidden>
  <div class="stick"><div class="knob"></div></div>
  <div class="btns">
    <div class="tb a" data-k="atk">⚔</div>
    <div class="tb b" data-k="item">✦</div>
    <div class="tb c" data-k="prev">◀</div>
    <div class="tb d" data-k="next">▶</div>
  </div>
  <div class="top"><div class="tb" data-k="pause">☰</div><div class="tb" data-k="map">⌖</div><div class="tb" data-k="hint">?</div></div>
  <div class="rot">↻ Turn your phone sideways for a bigger view</div>
</div>
<script>
// ---- 01-core.js ----
'use strict';
// ================= core constants & helpers =================
const TW = 48, COLS = 20, ROWS = 12, VW = TW * COLS, VH = TW * ROWS;
const DX = [0, 0, -1, 1], DY = [1, -1, 0, 0]; // dir: 0 down, 1 up, 2 left, 3 right
const OPP = [1, 0, 3, 2];
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const VIEW = { s: 1, ox: 0, oy: 0, dpr: 1, w: 0, h: 0, rs: 1 };

const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const R = Math.random;
const rr = (a, b) => a + R() * (b - a);
const ri = (a, b) => Math.floor(a + R() * (b - a + 1));
const pick = a => a[Math.floor(R() * a.length)];
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
const ang = (a, b) => Math.atan2(b.y - a.y, b.x - a.x);
const overlap = (a, b) => Math.abs(a.x - b.x) * 2 < a.w + b.w && Math.abs(a.y - b.y) * 2 < a.h + b.h;
const ease = t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
function hash(x, y, s = 0) {
  let h = (Math.imul(x | 0, 374761393) + Math.imul(y | 0, 668265263) + Math.imul(s | 0, 982451653)) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}
function mulberry(seed) { let a = seed >>> 0; return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
function strSeed(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
function dirOf(dx, dy) { return Math.abs(dx) > Math.abs(dy) ? (dx < 0 ? 2 : 3) : (dy < 0 ? 1 : 0); }
function shade(hex, f) { // f in -1..1
  const n = parseInt(hex.slice(1), 16); let r = n >> 16, g = (n >> 8) & 255, b = n & 255;
  if (f < 0) { r *= 1 + f; g *= 1 + f; b *= 1 + f; } else { r += (255 - r) * f; g += (255 - g) * f; b += (255 - b) * f; }
  return '#' + ((1 << 24) | (Math.round(r) << 16) | (Math.round(g) << 8) | Math.round(b)).toString(16).slice(1);
}
function mix(h1, h2, t) {
  const a = parseInt(h1.slice(1), 16), b = parseInt(h2.slice(1), 16);
  const r = lerp(a >> 16, b >> 16, t), g = lerp((a >> 8) & 255, (b >> 8) & 255, t), bl = lerp(a & 255, b & 255, t);
  return '#' + ((1 << 24) | (Math.round(r) << 16) | (Math.round(g) << 8) | Math.round(bl)).toString(16).slice(1);
}
function rgba(hex, a) { const n = parseInt(hex.slice(1), 16); return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a})`; }
function el(tag, cls, html) { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; }
function esc(s) { return String(s).replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c])); }
function fmtTime(t) { t = Math.floor(t); const h = Math.floor(t / 3600), m = Math.floor(t / 60) % 60, s = t % 60; return h ? `${h}h ${String(m).padStart(2, '0')}m` : `${m}m ${String(s).padStart(2, '0')}s`; }

function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const w = window.innerWidth, h = window.innerHeight;
  cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
  const s = Math.min(w / VW, h / VH);
  VIEW.s = s; VIEW.dpr = dpr; VIEW.w = w; VIEW.h = h;
  VIEW.ox = Math.round((w - VW * s) / 2); VIEW.oy = Math.round((h - VH * s) / 2);
  VIEW.rs = Math.min(3, s * dpr); // static layer resolution per logical px
  const ui = document.getElementById('ui');
  ui.style.left = VIEW.ox + 'px'; ui.style.top = VIEW.oy + 'px';
  ui.style.width = VW * s + 'px'; ui.style.height = VH * s + 'px';
  ui.style.setProperty('--s', s);
  if (typeof World !== 'undefined') World.dirty = true;
}

// ================= input =================
const Input = (() => {
  const KEYS = {
    ArrowUp: 'up', KeyW: 'up', ArrowDown: 'down', KeyS: 'down', ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right',
    Space: 'atk', KeyJ: 'atk', KeyZ: 'atk', Enter: 'act', NumpadEnter: 'act',
    KeyK: 'item', KeyX: 'item', KeyL: 'item', ShiftLeft: 'item', ShiftRight: 'item',
    KeyQ: 'prev', KeyE: 'next', Tab: 'next',
    Escape: 'pause', KeyP: 'pause', KeyI: 'pause', KeyM: 'map', KeyH: 'hint', Backspace: 'back',
    Digit1: 's1', Digit2: 's2', Digit3: 's3', Digit4: 's4', Digit5: 's5', Digit6: 's6', Digit7: 's7', Digit8: 's8'
  };
  const held = {}, hit = {}, up = {}, src = { key: {}, pad: {}, touch: {} };
  let anyHit = false, lastDevice = 'key';
  const tstick = { x: 0, y: 0 };
  const padPrev = {};
  function setSrc(kind, a, v) {
    src[kind][a] = v;
  }
  const typing = e => e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA');
  window.addEventListener('keydown', e => {
    if (e.metaKey || e.ctrlKey || typing(e)) return;
    const a = KEYS[e.code]; if (!a) return;
    e.preventDefault(); lastDevice = 'key';
    if (!src.key[a]) { setSrc('key', a, true); }
    Audio2.unlock();
  });
  window.addEventListener('keyup', e => { const a = KEYS[e.code]; if (!a) return; setSrc('key', a, false); });
  window.addEventListener('blur', () => { for (const k in src.key) src.key[k] = false; });
  function pollPad() {
    let pads = [];
    try { pads = navigator.getGamepads ? navigator.getGamepads() || [] : []; } catch (e) { pads = []; }
    const cur = {};
    for (const p of pads) {
      if (!p) continue;
      const b = i => p.buttons[i] && p.buttons[i].pressed;
      const ax = p.axes[0] || 0, ay = p.axes[1] || 0;
      cur.left = b(14) || ax < -.45; cur.right = b(15) || ax > .45; cur.up = b(12) || ay < -.45; cur.down = b(13) || ay > .45;
      cur.atk = b(0); cur.item = b(2) || b(1); cur.act = b(0); cur.prev = b(4) || b(6); cur.next = b(5) || b(7);
      cur.pause = b(9); cur.map = b(8); cur.hint = b(3); cur.back = b(1);
      cur._ax = ax; cur._ay = ay;
      break;
    }
    let any = false;
    for (const k in cur) if (k[0] !== '_' && cur[k]) any = true;
    if (any) { lastDevice = 'pad'; Audio2.unlock(); }
    for (const k of ['left', 'right', 'up', 'down', 'atk', 'item', 'act', 'prev', 'next', 'pause', 'map', 'hint', 'back']) src.pad[k] = !!cur[k];
    src.pad._ax = cur._ax || 0; src.pad._ay = cur._ay || 0;
  }
  const ACTS = ['up', 'down', 'left', 'right', 'atk', 'act', 'item', 'prev', 'next', 'pause', 'map', 'hint', 'back', 's1', 's2', 's3', 's4', 's5', 's6', 's7', 's8'];
  function update() {
    pollPad();
    anyHit = false;
    for (const a of ACTS) {
      const v = !!(src.key[a] || src.pad[a] || src.touch[a]);
      hit[a] = v && !held[a]; up[a] = !v && held[a]; held[a] = v;
      if (hit[a]) anyHit = true;
    }
  }
  function axis() {
    let x = 0, y = 0;
    if (held.left) x -= 1; if (held.right) x += 1; if (held.up) y -= 1; if (held.down) y += 1;
    const ax = src.pad._ax || 0, ay = src.pad._ay || 0;
    if (Math.hypot(ax, ay) > .25) { x = ax; y = ay; }
    if (tstick.x || tstick.y) { x = tstick.x; y = tstick.y; }
    const m = Math.hypot(x, y); if (m > 1) { x /= m; y /= m; }
    return { x, y };
  }
  function clearAll() { for (const a of ACTS) { hit[a] = false; } }
  // touch controls
  function setupTouch() {
    const T = document.getElementById('touch');
    const stick = T.querySelector('.stick'), knob = T.querySelector('.knob');
    let sid = null, cx = 0, cy = 0, rad = 1;
    stick.addEventListener('pointerdown', e => { sid = e.pointerId; stick.setPointerCapture(sid); const r = stick.getBoundingClientRect(); cx = r.left + r.width / 2; cy = r.top + r.height / 2; rad = r.width / 2; move(e); Audio2.unlock(); lastDevice = 'touch'; });
    const move = e => { if (e.pointerId !== sid) return; let x = (e.clientX - cx) / rad, y = (e.clientY - cy) / rad; const m = Math.hypot(x, y); if (m > 1) { x /= m; y /= m; } if (m < .18) { x = 0; y = 0; } tstick.x = x; tstick.y = y; knob.style.transform = `translate(${x * rad * .6}px,${y * rad * .6}px)`; src.touch.left = x < -.5; src.touch.right = x > .5; src.touch.up = y < -.5; src.touch.down = y > .5; };
    stick.addEventListener('pointermove', move);
    const end = e => { if (e.pointerId !== sid) return; sid = null; tstick.x = tstick.y = 0; knob.style.transform = ''; src.touch.left = src.touch.right = src.touch.up = src.touch.down = false; };
    stick.addEventListener('pointerup', end); stick.addEventListener('pointercancel', end);
    T.querySelectorAll('.tb').forEach(b => {
      const k = b.dataset.k;
      b.addEventListener('pointerdown', e => { e.preventDefault(); b.setPointerCapture(e.pointerId); src.touch[k] = true; if (k === 'atk') src.touch.act = true; b.classList.add('on'); Audio2.unlock(); lastDevice = 'touch'; });
      const off = () => { src.touch[k] = false; if (k === 'atk') src.touch.act = false; b.classList.remove('on'); };
      b.addEventListener('pointerup', off); b.addEventListener('pointercancel', off);
    });
  }
  return { held, hit, up, axis, update, clearAll, setupTouch, get device() { return lastDevice; }, get any() { return anyHit; }, src, tstick };
})();

// ================= settings & save =================
const SAVE_PREFIX = 'lanternbound-v1-slot';
const Settings = { music: .7, sfx: .8, touch: 'auto', shake: 1, lastSlot: 0 };
function loadSettings() {
  try { Object.assign(Settings, JSON.parse(localStorage.getItem('lanternbound-settings') || '{}')); } catch (e) { }
}
function saveSettings() { try { localStorage.setItem('lanternbound-settings', JSON.stringify(Settings)); } catch (e) { } }

let S = null; // the active save
function newSave(slot) {
  return {
    v: 1, slot, created: Date.now(), saved: 0, time: 0, deaths: 0,
    hp: 6, maxHp: 6, pieces: 0, glim: 0, bombs: 0, maxBombs: 10, potions: 0, ore: 0, pages: 0,
    keys: {}, bkey: {}, maps: {}, items: {}, tool: null, sword: 0, armor: 0, stones: 0,
    flags: {}, visited: {}, diff: 1, daylight: false,
    pos: { a: 'house', rx: 0, ry: 0, x: 9.5 * TW, y: 6.5 * TW, d: 0 }
  };
}
const SaveSys = {
  read(slot) { try { const j = localStorage.getItem(SAVE_PREFIX + slot); return j ? JSON.parse(j) : null; } catch (e) { return null; } },
  write() {
    if (!S) return false;
    S.saved = Date.now();
    try { localStorage.setItem(SAVE_PREFIX + S.slot, JSON.stringify(S)); Settings.lastSlot = S.slot; saveSettings(); return true; } catch (e) { return false; }
  },
  erase(slot) { try { localStorage.removeItem(SAVE_PREFIX + slot); } catch (e) { } }
};
const flag = k => !!(S && S.flags[k]);
const setFlag = (k, v = 1) => { if (S) S.flags[k] = v; };
const stoneCount = () => { let n = 0; for (let i = 0; i < 8; i++) if (S.stones & (1 << i)) n++; return n; };

// ---- 02-audio.js ----
// ================= audio: synth sfx + music sequencer =================
const Audio2 = (() => {
  let ac = null, master, musicBus, sfxBus, verb, verbSend, noiseBuf, ready = false, want = null;
  function unlock() {
    if (!ac) {
      try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return; }
      build();
      if (want) { const w = want; want = null; play(w); }
    }

// ---- tile codes ----
const C = { FLOOR: 0, SOLID: 1, PIT: 2, WATER: 3, LAVA: 4, ICE: 5, QUICK: 6, CRUMBLE: 7, SPIKE: 8, FLOW: 9, WIND: 10, SHALLOW: 11 };
const HAZ = c => c === C.PIT || c === C.WATER || c === C.LAVA || c === C.WIND;
const WALLISH = new Set(['#', 'x', '*', 'K', 'X']);
const GLOBAL_ENT = { B: 'block', u: 'brazier', U: 'brazier lit', s: 'switch', p: 'plate' };
const TILECH = new Set('.-",#Tborxk~w_Lqi%^=|:h12KXH><nv[]()*'.split(''));
const FLOWDIR = { '>': 3, '<': 2, 'n': 1, 'v': 0 };

const World = {
  room: null, dirty: true, barrier: {}, shadow: false, layers: null, time: 0,

  build(area, rx, ry) {
    const A = AREAS[area]; const def = A.rooms[rx + ',' + ry];
    if (!def) throw new Error('No room ' + roomKey(area, rx, ry));
    const st = STY[S && S.daylight && def.st === 'village' ? 'dawn' : def.st] || STY.root;
    const room = {
      area, rx, ry, def, A, st, key: roomKey(area, rx, ry), o: def.o,
      t: new Array(COLS * ROWS), R: new Uint8Array(COLS * ROWS), frz: new Float32Array(COLS * ROWS), crum: new Float32Array(COLS * ROWS),
      solved: false, shutOpen: false, specs: [], lights: [], waterCells: [], lavaCells: [], flowCells: [], animCells: [], doors: {},
    };
    room.solved = !def.o.ev || flag('sv:' + room.key);
    if (def.o.ev === 'boss' && flag('boss:' + area)) room.solved = true;
    const fl = def.o.fl || '.';
    for (let r = 0; r < ROWS; r++) {
      const line = def.m[r] || '';
      for (let c = 0; c < COLS; c++) {
        let ch = line[c] || '#';
        const i = r * COLS + c;
        if (GLOBAL_ENT[ch]) { room.specs.push({ spec: GLOBAL_ENT[ch], c, r, ch }); ch = fl; }
        else if (!TILECH.has(ch)) {
          let spec = def.k[ch];
          if (spec == null) { console.warn('Unknown map char', ch, room.key); ch = fl; }
          else {
            let under = fl;
            if (spec.includes('@')) { const p = spec.split('@'); spec = p[0]; under = p[1]; }
            room.specs.push({ spec, c, r, ch }); ch = under;
          }
        }
        // persisted tile changes
        if ((ch === 'x' || ch === 'r') && flag('bl:' + room.key + ':' + c + ',' + r)) ch = fl === '.' ? '.' : fl;
        room.t[i] = ch;
      }
    }
    // doors
    for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
      const ch = room.t[r * COLS + c];
      if (ch === 'K' || ch === 'X') {
        const id = World.doorId(room, c, r);
        room.doors[c + ',' + r] = id;
      }
    }
    room.shutOpen = room.solved || def.o.ev === 'clear' || def.o.ev === 'boss';
    World.resolve(room);
    // cell lists for animation
    for (let i = 0; i < COLS * ROWS; i++) {
      const ch = room.t[i];
      if (ch === '~' || ch === 'w') room.waterCells.push(i);
      if (ch === 'L') room.lavaCells.push(i);
      if (FLOWDIR[ch] != null) room.flowCells.push(i);
      if (ch === '*') room.lights.push({ x: (i % COLS) * TW + TW / 2, y: Math.floor(i / COLS) * TW + TW * .55, r: 150, i: .9, c: 'fire', flick: 1 });
      if ('12:()[]_qi^'.includes(ch)) room.animCells.push(i);
    }
    for (let k = 0; k < room.lavaCells.length; k += 3) { const i = room.lavaCells[k]; room.lights.push({ x: (i % COLS) * TW + TW / 2, y: Math.floor(i / COLS) * TW + TW / 2, r: 110, i: .55, c: 'fire', flick: .3 }); }
    return room;
  },
  doorId(room, c, r) {
    let side = 'I' + c + '_' + r, nx = room.rx, ny = room.ry, nside = null;
    if (r === 0) { side = 'N'; ny--; nside = 'S'; } else if (r === ROWS - 1) { side = 'S'; ny++; nside = 'N'; }
    else if (c === 0) { side = 'W'; nx--; nside = 'E'; } else if (c === COLS - 1) { side = 'E'; nx++; nside = 'W'; }
    return { id: 'dr:' + room.key + ':' + side, nid: nside ? 'dr:' + roomKey(room.area, nx, ny) + ':' + nside : null };
  },
  barrierState(area) { return (S && S.flags['bar:' + area]) || 0; },
  resolve(room) {
    const bs = World.barrierState(room.area), sh = World.shadow;
    for (let i = 0; i < COLS * ROWS; i++) {
      const ch = room.t[i]; let v = C.FLOOR;
      switch (ch) {
        case '#': case 'T': case 'b': case 'o': case 'r': case 'x': case 'k': case 'h': case '*': v = C.SOLID; break;
        case 'K': case 'X': { const d = room.doors[(i % COLS) + ',' + Math.floor(i / COLS)]; v = d && flag(d.id) ? C.FLOOR : C.SOLID; break; }
        case 'H': v = room.shutOpen ? C.FLOOR : C.SOLID; break;
        case '~': v = room.frz[i] > 0 ? C.FLOOR : C.WATER; break;
        case 'L': v = room.frz[i] > 0 ? C.FLOOR : C.LAVA; break;
        case '_': v = C.PIT; break;
        case ':': v = room.solved ? C.FLOOR : C.PIT; break;
        case 'i': v = C.ICE; break;
        case 'q': v = C.QUICK; break;
        case '%': v = room.crum[i] >= 1 ? C.PIT : C.CRUMBLE; break;
        case '^': v = C.SPIKE; break;
        case 'w': v = C.SHALLOW; break;
        case '1': v = bs === 0 ? C.SOLID : C.FLOOR; break;
        case '2': v = bs === 1 ? C.SOLID : C.FLOOR; break;
        case '>': case '<': case 'n': case 'v': v = room.st.sky ? C.WIND : C.FLOW; break;
        case '[': v = sh ? C.FLOOR : C.SOLID; break;
        case ']': v = sh ? C.SOLID : C.FLOOR; break;
        case '(': v = sh ? C.PIT : C.FLOOR; break;
        case ')': v = sh ? C.FLOOR : C.PIT; break;
      }
      room.R[i] = v;
    }
  },
  cell(c, r) {
    const room = World.room;
    c = clamp(c, 0, COLS - 1); r = clamp(r, 0, ROWS - 1);
    return room.R[r * COLS + c];
  },
  cellAt(x, y) { return World.cell(Math.floor(x / TW), Math.floor(y / TW)); },
  ch(c, r) { const room = World.room; c = clamp(c, 0, COLS - 1); r = clamp(r, 0, ROWS - 1); return room.t[r * COLS + c]; },
  setTile(c, r, ch) {
    const room = World.room; room.t[r * COLS + c] = ch; World.resolve(room); World.redrawCells(c, r);
  },
  redrawCells(c, r) { World.dirty = true; },

  // ---------------- static rendering ----------------
  render(room) {
    const rs = VIEW.rs;
    const mk = () => { const c = document.createElement('canvas'); c.width = Math.ceil(VW * rs); c.height = Math.ceil(VH * rs); return c; };
    const L = { base: mk(), top: mk(), shadow: null };
    World.drawLayer(room, L.base.getContext('2d'), L.top.getContext('2d'), false);
    if (room.st.twilight) {
      L.sbase = mk(); L.stop = mk();
      World.drawLayer(room, L.sbase.getContext('2d'), L.stop.getContext('2d'), true);
    }
    World.layers = L; World.dirty = false;
    return L;
  },

defEnt('block', {
  w: 46, h: 46, solid: true,
  init(e, a) { e.kind = a[0] || 'stone'; e.heavy = true; e.slide = null; },
  push(e, dir, force) {
    if (e.slide || e.sinking) return false;
    if (e.kind === 'heavy' && !force) return false;
    const [c, r] = cellOf(e.x, e.y); const nc = c + DX[dir], nr = r + DY[dir];
    if (outCell(nc, nr)) return false;
    const code = World.room.R[nr * COLS + nc];
    if (code === C.SOLID) return false;
    const tgt = cellCenter(nc, nr);
    for (const o of G.ents) if (o !== e && !o.dead && (o.solid || o.name === 'enemy' && !o.flying) && Math.abs(o.x - tgt.x) < 40 && Math.abs(o.y - tgt.y) < 40) return false;
    e.slide = { fx: e.x, fy: e.y, tx: tgt.x, ty: tgt.y, t: 0, dir, force: !!force && e.kind === 'heavy', d: force || e.kind === 'ice' ? .12 : .32 };
    sfx('push'); return true;
  },
  update(e, dt) {
    if (e.sinking) { e.sinking -= dt; if (e.sinking <= 0) e.dead = true; return; }
    if (e.slide) {
      const s = e.slide; s.t += dt / s.d;
      const k = Math.min(1, s.t); e.x = lerp(s.fx, s.tx, k); e.y = lerp(s.fy, s.ty, k);
      if (s.t >= 1) {
        e.slide = null;
        const [c, r] = cellOf(e.x, e.y); const i = r * COLS + c, code = World.room.R[i];
        if (code === C.PIT || code === C.WATER || code === C.LAVA) {
          e.sinking = .35; e.solid = false; sfx(code === C.WATER ? 'splash' : 'crumble');
          const ch = World.room.t[i];
          World.room.t[i] = code === C.WATER ? 'w' : '.'; if (code === C.LAVA) World.room.t[i] = '.';
          World.resolve(World.room); World.dirty = true; burst(e.x, e.y, 14, code === C.WATER ? '#bfe9ff' : '#777', 90);
          return;
        }
        if (code === C.ICE || e.kind === 'ice' || s.force) e.def.push(e, s.dir, true);
      }
    }
  },
  draw(g, e) {
    let x = e.x, y = e.y; const sink = e.sinking ? (1 - e.sinking / .35) : 0;
    g.save(); if (sink) { g.globalAlpha = 1 - sink; y += sink * 16; }
    shadowAt(g, x, y + 18, 24, .35);
    const col = e.kind === 'ice' ? '#a9d8f2' : e.kind === 'heavy' ? '#5a4a62' : '#7a6a58';
    g.fillStyle = shade(col, -.35); g.fillRect(x - 23, y - 10, 46, 32);
    g.fillStyle = col; g.fillRect(x - 23, y - 26, 46, 30);
    g.fillStyle = shade(col, .2); g.fillRect(x - 19, y - 22, 38, 22);
    g.strokeStyle = shade(col, -.2); g.lineWidth = 2; g.strokeRect(x - 15, y - 18, 30, 14);
    if (e.kind === 'heavy') { g.fillStyle = '#c9a24a'; g.font = 'bold 14px system-ui'; g.textAlign = 'center'; g.fillText('◆', x, y - 6); }
    g.restore();
  }
});

defEnt('door', {

  update(e, dt) {

    if (Math.abs(P.x - e.x) < 22 && Math.abs(P.y - e.y) < 22) {

      e.cool = 2; Game.warp(e.to.a, e.to.rx, e.to.ry, e.to.c, e.to.r, e.to.d, e.kind === 'stairs' ? 'fade' : 'fade');

function drawPerson(g, x, y, L, dir, anim, walking, o = {}) {
  // L: {skin, hair, robe, robe2, hat, beard, apron, staff, scale, kind}
  const s = L.scale || 1;

  if (L.kind === 'bird') return drawBirdfolk(g, L, dir, anim, walking), g.restore();

  const leg = walking ? Math.sin(anim) * 4 : 0;

  g.fillStyle = L.legs || '#2a2230';

  g.fillRect(2 - (dir === 2 || dir === 3 ? leg : 0), -8, 5, 8);
  // robe body
  g.translate(0, -bob);
  g.fillStyle = L.robe; g.beginPath(); g.moveTo(-12, -6); g.lineTo(-9, -26); g.lineTo(9, -26); g.lineTo(12, -6); g.closePath(); g.fill();
  g.fillStyle = L.robe2 || shade(L.robe, -.2); g.fillRect(-12, -9, 24, 3);
  if (L.apron) { g.fillStyle = L.apron; g.fillRect(-7, -22, 14, 15); }
  if (L.sash) { g.fillStyle = L.sash; g.fillRect(-10, -17, 20, 3); }
  // arms
  g.fillStyle = shade(L.robe, -.1);
  if (dir !== 1) { g.fillRect(-13, -24, 4, 12); g.fillRect(9, -24, 4, 12); }
  // head
  const hy = -34;
  g.fillStyle = L.skin || '#f0c8a0'; g.beginPath(); g.arc(0, hy, 9, 0, 7); g.fill();
  // hair
  if (L.hair) {
    g.fillStyle = L.hair;
    if (dir === 1) { g.beginPath(); g.arc(0, hy, 9.5, 0, 7); g.fill(); }
    else { g.beginPath(); g.arc(0, hy - 2, 9.5, Math.PI * 1.05, Math.PI * 1.95); g.fill(); if (L.long) { g.fillRect(-9.5, hy - 3, 4, 14); g.fillRect(5.5, hy - 3, 4, 14); } }
  }
  if (L.beard && dir !== 1) { g.fillStyle = L.beard; g.beginPath(); g.moveTo(-7, hy + 2); g.quadraticCurveTo(0, hy + 16, 7, hy + 2); g.fill(); }
  // face
  if (dir !== 1) {
    g.fillStyle = '#1a1420';
    const ex = dir === 2 ? -3 : dir === 3 ? 3 : 0;
    if (L.kind !== 'ghost' || true) { g.fillRect(-4 + ex, hy - 1, 2, 3); g.fillRect(2 + ex, hy - 1, 2, 3); }
    if (L.blush) { g.fillStyle = 'rgba(255,120,120,.35)'; g.fillRect(-7 + ex, hy + 3, 3, 2); g.fillRect(4 + ex, hy + 3, 3, 2); }
    if (L.goggles) { g.fillStyle = '#c9a24a'; g.fillRect(-7 + ex, hy - 3, 14, 3); g.fillStyle = '#9ae0ff'; g.beginPath(); g.arc(-3 + ex, hy, 3, 0, 7); g.arc(3 + ex, hy, 3, 0, 7); g.fill(); }
  }
  // hat
  if (L.hat === 'wide') { g.fillStyle = L.hatc || '#5a3a24'; g.beginPath(); g.ellipse(0, hy - 6, 16, 5, 0, 0, 7); g.fill(); g.fillRect(-8, hy - 15, 16, 9); }
  else if (L.hat === 'hood') { g.fillStyle = L.hatc || L.robe; g.beginPath(); g.arc(0, hy - 1, 11, Math.PI, 0); g.fill(); g.fillRect(-11, hy - 1, 3, 9); g.fillRect(8, hy - 1, 3, 9); }

// trace beams each frame (after movement)
function traceBeams() {
  G.beams.length = 0;
  for (const s of entsOf('socket')) s.lit = false;
  for (const em of entsOf('emitter')) {
    if (!em.def.on(em)) continue;
    let x = em.x, y = em.y - 4, d = em.d, pts = [{ x, y }], guard = 0, cx = Math.floor(em.x / TW), cy = Math.floor(em.y / TW);
    while (guard++ < 60) {
      cx += DX[d]; cy += DY[d];
      if (outCell(cx, cy)) { pts.push({ x: cx * TW + TW / 2 - DX[d] * TW / 2, y: cy * TW + TW / 2 - DY[d] * TW / 2 - 4 }); break; }
      const ccx = cx * TW + TW / 2, ccy = cy * TW + TW / 2;
      // player shield
      if (P.alive && P.shielding && Math.abs(P.x - ccx) < TW / 2 && Math.abs(P.y - ccy) < TW / 2 && P.dir !== d) {
        const pp = { x: P.x, y: P.y - 18 }; pts.push(pp); P.beamHit = true;
        if (P.dir === OPP[d]) { G.beams.push(pts); pts = null; break; }
        G.beams.push(pts); pts = [pp]; d = P.dir; continue;
      }
      const boss = G.ents.find(o => o.name === 'boss' && !o.dead && o.B.beamHurt && Math.abs(o.x - ccx) * 2 < o.w + 20 && Math.abs(o.y + 40 - ccy) * 2 < o.h + 40);
      if (boss) { if (boss.remote) { if (NET.beamT <= 0) { NET.beamT = .35; NET.fwd(boss, 1, 'beam', P.x, P.y); } } else boss.B.beamHurt(boss); pts.push({ x: ccx, y: ccy }); break; }
      const hit = G.ents.find(o => !o.dead && o.solid && Math.abs(o.x - ccx) < TW / 2 && Math.abs(o.y - ccy) < TW / 2);
      if (hit) {
        if (hit.name === 'mirror') {
          pts.push({ x: hit.x, y: hit.y - 6 });
          // '/' (o=0): right->up, up->right, left->down, down->left ; '\' (o=1): right->down, down->right, left->up, up->left
          const M0 = { 3: 1, 1: 3, 2: 0, 0: 2 }, M1 = { 3: 0, 0: 3, 2: 1, 1: 2 };
          d = (hit.o === 0 ? M0 : M1)[d]; continue;
        }
        if (hit.name === 'socket') { hit.lit = true; pts.push({ x: hit.x, y: hit.y - 2 }); break; }
        if (hit.name === 'enemy' && hit.def.beamHurt) { hit.def.beamHurt(hit); }
        if (hit.name !== 'enemy') { pts.push({ x: ccx - DX[d] * TW / 2, y: ccy - DY[d] * TW / 2 - 4 }); break; }
      }
      if (World.room.R[cy * COLS + cx] === C.SOLID) { pts.push({ x: ccx - DX[d] * TW / 2, y: ccy - DY[d] * TW / 2 - 4 }); break; }
    }
    if (pts && pts.length > 1) G.beams.push(pts);
  }
}
function drawBeams(g) {
  for (const pts of G.beams) {
    if (pts.length < 2) continue;
    for (const [w, c] of [[12, 'rgba(255,214,120,.18)'], [6, 'rgba(255,230,160,.5)'], [2.5, 'rgba(255,255,240,.95)']]) {
      g.strokeStyle = c; g.lineWidth = w + Math.sin(G.t * 20) * .5; g.lineCap = 'round'; g.beginPath(); g.moveTo(pts[0].x, pts[0].y); for (const p of pts) g.lineTo(p.x, p.y); g.stroke();
    }
  }
}

defEnt('blade', {

function freezeAt(c, r) {
  const room = World.room; let n = 0;
  const cells = [[c, r], [c + 1, r], [c - 1, r], [c, r + 1], [c, r - 1]];
  for (const [cc, rr2] of cells) {
    if (outCell(cc, rr2)) continue; const i = rr2 * COLS + cc, ch = room.t[i];
    if (ch === '~' && room.frz[i] <= 0) { room.frz[i] = 1e9; n++; }
    else if (ch === 'L' && room.frz[i] <= 0 && (cc === c && rr2 === r)) { room.frz[i] = 7; n++; }
  }
  if (n) { World.resolve(room); sfx('freeze'); burst(c * TW + 24, r * TW + 24, 14, '#e0f6ff', 90); }
}
function updFrozen(dt) {
  const room = World.room; let ch = false;
  for (let i = 0; i < room.frz.length; i++) if (room.frz[i] > 0 && room.frz[i] < 1e8) { room.frz[i] -= dt; if (room.frz[i] <= 0) { room.frz[i] = 0; ch = true; burst((i % COLS) * TW + 24, ((i / COLS) | 0) * TW + 24, 8, '#ff8a3d', 60); } }
  if (ch) { World.resolve(room); sfx('fire'); }
}

function tryDoor() {
  const fx = P.x + DX[P.dir] * 28, fy = P.y + DY[P.dir] * 22;
  const [c, r] = cellOf(fx, fy); if (outCell(c, r)) return;
  const room = World.room, ch = room.t[r * COLS + c];
  if ((ch !== 'K' && ch !== 'X') || room.R[r * COLS + c] !== C.SOLID) return;
  const d = room.doors[c + ',' + r]; if (!d) return;
  const area = room.area;
  if (ch === 'K') {
    if ((S.keys[area] || 0) <= 0) { if (P.lockMsg !== d.id) { P.lockMsg = d.id; UI.toast('Locked. You need a small key.'); sfx('deny'); } return; }
    S.keys[area]--;
  } else {
    if (!S.bkey[area]) { if (P.lockMsg !== d.id) { P.lockMsg = d.id; UI.toast('A great lock. It needs this temple\'s Great Key.'); sfx('deny'); } return; }
  }
  setFlag(d.id); if (d.nid) setFlag(d.nid); NET.event('door', [d.id, d.nid].filter(Boolean));
  World.resolve(room); World.dirty = true; sfx('unlock'); burst(c * TW + 24, r * TW + 24, 16, '#ffd76a', 120);
}

const ENEMY = {};

defEnt('enemy', {

    if (!enemyActive(e)) return;
    if (e.frozen > 0) { e.frozen -= dt; if (e.frozen <= 0) { burst(e.x, e.y - 10, 10, '#bfe9ff', 70); } return; }
    if (e.kb) { e.kb.t -= dt; moveBody(e, e.kb.x * dt, e.kb.y * dt, e.flying ? 'fly2' : 'walk'); if (e.kb.t <= 0) e.kb = null; }

    this.plain = text.replace(/<[^>]+>/g, '');

  render() {

    while (i < s.length && s[i] === '<') { const j = s.indexOf('>', i); out += s.slice(i, j + 1); i = j + 1; }
    D.querySelector('.txt').innerHTML = out.replace(/\n/g, '<br>');

    }

const roomThumb = {};
function thumbFor(def) {
  const key = def.area + ':' + def.rx + ',' + def.ry; if (roomThumb[key]) return roomThumb[key];
  const c = document.createElement('canvas'); c.width = COLS; c.height = ROWS; const g = c.getContext('2d');
  const st = STY[def.st] || STY.root;
  for (let r = 0; r < ROWS; r++) for (let cc = 0; cc < COLS; cc++) {
    const ch = (def.m[r] || '')[cc] || '#';
    let col = st.g1;
    if ('#xX*K'.includes(ch)) col = st.wall === 'trees' ? st.w2 : st.w1;
    else if ('T'.includes(ch)) col = st.w2;
    else if ('~w'.includes(ch)) col = st.water;
    else if ('_:'.includes(ch) || (st.sky && '><nv'.includes(ch))) col = st.sky ? '#2a2a66' : '#050406';
    else if (ch === 'L') col = '#e2521a';

  return roomThumb[key] = c;
}
function drawMapCanvas() {
  const A = World.room.A, rooms = Object.values(A.rooms);
  let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
  for (const d of rooms) { x0 = Math.min(x0, d.rx); y0 = Math.min(y0, d.ry); x1 = Math.max(x1, d.rx); y1 = Math.max(y1, d.ry); }
  const cw = Math.max(1, x1 - x0 + 1), ch = Math.max(1, y1 - y0 + 1);
  const cell = Math.min(120, Math.floor(640 / cw), Math.floor(330 / ch)), rw = cell, rh = Math.round(cell * .6);
  const cv2 = el('canvas', 'map'); cv2.width = cw * (rw + 4) + 20; cv2.height = ch * (rh + 4) + 20;
  const g = cv2.getContext('2d'); g.imageSmoothingEnabled = false;
  const full = A.dungeon && S.maps[A.id];
  for (const d of rooms) {
    const k = roomKey(A.id, d.rx, d.ry), seen = S.visited[k];
    if (!seen && !full) continue;
    if (d.o.hideMap && !seen) continue;
    const x = 10 + (d.rx - x0) * (rw + 4), y = 10 + (d.ry - y0) * (rh + 4);
    g.globalAlpha = seen ? 1 : .35; g.drawImage(thumbFor(d), x, y, rw, rh); g.globalAlpha = 1;
    g.strokeStyle = 'rgba(255,255,255,.18)'; g.lineWidth = 1; g.strokeRect(x + .5, y + .5, rw - 1, rh - 1);
    if (full && d.o.ev === 'boss' && !flag('boss:' + A.id)) { g.fillStyle = '#ff4a6a'; g.font = `bold ${Math.max(10, rh * .5)}px system-ui`; g.textAlign = 'center'; g.fillText('☠', x + rw / 2, y + rh * .7); }
    if (!A.dungeon && flag('bc:' + k)) { g.fillStyle = '#ffd76a'; g.fillRect(x + rw - 9, y + 3, 6, 6); }
    if (!A.dungeon && d.o.mark && seen) { g.fillStyle = '#ff8a3d'; g.beginPath(); g.arc(x + 7, y + 7, 4, 0, 7); g.fill(); }
  }
  // player
  const cr = World.room; const px = 10 + (cr.rx - x0) * (rw + 4) + P.x / VW * rw, py = 10 + (cr.ry - y0) * (rh + 4) + P.y / VH * rh;
  g.fillStyle = '#fff'; g.beginPath(); g.arc(px, py, 5, 0, 7); g.fill(); g.fillStyle = '#ea7a3a'; g.beginPath(); g.arc(px, py, 3, 0, 7); g.fill();
  g.strokeStyle = '#ffcf6b'; g.lineWidth = 2; g.strokeRect(10 + (cr.rx - x0) * (rw + 4) - 1, 10 + (cr.ry - y0) * (rh + 4) - 1, rw + 2, rh + 2);
  return cv2;
}

defEnt('hearth', {
  w: 92, h: 40, solid: true,
  init(e) { e.x += 24; },
  interact(e) { Script.run(function* () { const n = stoneCount(); yield say('', S.daylight ? 'The Great Hearth burns quietly in the morning sun. It doesn\'t need to fight the dark any more.' : n ? `The Great Hearth burns a little brighter. ${n} Sunstone${n > 1 ? 's' : ''} found, ${7 - n} still lost.` : 'The <b>Great Hearth</b>, the last fire of the old sun. It flickers, low and tired.'); }); },
  update(e, dt) { if (R() < dt * (20 + stoneCount() * 5)) part({ x: e.x + rr(-22, 22), y: e.y - 30, vy: -rr(50, 110), vx: rr(-15, 15), life: rr(.6, 1.2), s: rr(2, 4), c: pick(['#ffd76a', '#ff8a3d', '#ff5a1a']) }); },
  draw(g, e) {
    const x = e.x, y = e.y, k = .6 + stoneCount() * .06;
    shadowAt(g, x, y + 14, 50, .4);
    g.fillStyle = '#4a4450'; g.beginPath(); g.ellipse(x, y + 2, 46, 18, 0, 0, 7); g.fill();
    g.fillStyle = '#6a6470'; g.beginPath(); g.ellipse(x, y - 4, 42, 15, 0, 0, 7); g.fill();
    for (let i = 0; i < 10; i++) { const a = i * .628; g.fillStyle = i % 2 ? '#5a5460' : '#7a7480'; g.beginPath(); g.arc(x + Math.cos(a) * 38, y - 4 + Math.sin(a) * 13, 6, 0, 7); g.fill(); }
    g.fillStyle = '#2a1a14'; g.beginPath(); g.ellipse(x, y - 6, 30, 9, 0, 0, 7); g.fill();
    const f = Math.sin(G.t * 10) * 4, h = 50 * k;
    g.fillStyle = '#ff5a1a'; g.beginPath(); g.moveTo(x - 28, y - 6); g.quadraticCurveTo(x - 24, y - h - f, x - 4, y - h * 1.5 + f); g.quadraticCurveTo(x + 6, y - h, x + 12, y - h * 1.3 - f); g.quadraticCurveTo(x + 24, y - h * .7, x + 28, y - 6); g.fill();
    g.fillStyle = '#ffb43a'; g.beginPath(); g.moveTo(x - 18, y - 6); g.quadraticCurveTo(x - 10, y - h, x, y - h * 1.1 - f); g.quadraticCurveTo(x + 10, y - h * .8, x + 18, y - 6); g.fill();
    g.fillStyle = '#fff2b0'; g.beginPath(); g.ellipse(x, y - 14, 8, 12 * k, 0, 0, 7); g.fill();
  },
  light(e) { return [e.x, e.y - 30, 300 + stoneCount() * 25, 1, 'fire', 1]; }
});
defEnt('altar', {
  w: 110, h: 40, solid: true,
  init(e) { e.x += 24; },
  interact(e) { Script.run(altarTalk); },
  draw(g, e) {
    const x = e.x, y = e.y;
    shadowAt(g, x, y + 12, 56, .35);
    g.fillStyle = '#4a4458'; g.beginPath(); g.ellipse(x, y + 2, 54, 18, 0, 0, 7); g.fill();
    g.fillStyle = '#6a6478'; g.beginPath(); g.ellipse(x, y - 4, 50, 15, 0, 0, 7); g.fill();
    g.strokeStyle = '#c9a24a'; g.lineWidth = 2; g.beginPath(); g.ellipse(x, y - 4, 40, 11, 0, 0, 7); g.stroke();
    for (let i = 0; i < 7; i++) {
      const a = -Math.PI + i * Math.PI / 6, sx = x + Math.cos(a) * 40, sy = y - 6 + Math.sin(a) * 11;
      const on = S.stones & (1 << i), placed = flag('altar' + i) || S.daylight;
      g.fillStyle = '#2a2430'; g.beginPath(); g.arc(sx, sy, 6, 0, 7); g.fill();
      if (placed) drawIcon(g, 'stone:' + (i + 1), sx, sy - 6, 16);
    }
    g.fillStyle = '#c9a24a'; g.beginPath(); g.arc(x, y - 10, 9, 0, 7); g.fill(); g.fillStyle = '#ffe48a'; g.beginPath(); g.arc(x, y - 10, 5, 0, 7); g.fill();
  },
  light(e) { let n = 0; for (let i = 0; i < 7; i++) if (flag('altar' + i)) n++; return n || S.daylight ? [e.x, e.y - 10, 90 + n * 20, .7, 'gold'] : null; }
});
function* altarTalk() {
  if (S.daylight || flag('won')) { yield say('', 'The Sun Altar is warm in the morning light. Seven stones glitter in its ring.'); if (flag('won')) { const r = yield ask('', 'Return to the Eclipse Citadel? (It\'s quiet now.)', ['Not now', 'Go']); if (r === 1) Game.warp('d8', 1, 4, 9, 9, 1); } return; }
  const n = stoneCount();
  if (n < 7) { yield say('', `The <b>Sun Altar</b>. Seven hollows ring its edge. ${n ? `You place your ${n} Sunstone${n > 1 ? 's' : ''}… but nothing happens yet.` : 'They seem made for something precious.'}`); yield say('Pip', n ? `${7 - n} more to go, Wren! I can feel them out there, warm little heartbeats.` : 'Those hollows feel… familiar. Like a nest.'); for (let i = 0; i < 7; i++) if (S.stones & (1 << i)) setFlag('altar' + i); return; }
  if (!S.items.bell) { yield say('Pip', 'All seven! But the road to the sky is wrapped in shadow. We\'d need a way to cross into the Shadow world.'); return; }
  if (flag('citadelOpen')) { const r = yield ask('', 'The beam of light still rises into the sky. Ascend to the Eclipse Citadel?', ['Ascend', 'Not yet']); if (r === 0) Game.warp('d8', 1, 4, 9, 9, 1); return; }

  yield fadeTo(0, .5);
  yield wait(.8);
  delete S.flags.pipGone; sfx('pipp');
  G.endDraw = g => { g.fillStyle = '#000'; g.fillRect(0, 0, VW, VH); P.pipX = VW / 2; P.pipY = VH / 2; g.save(); g.translate(VW / 2, VH / 2); g.scale(2, 2); g.translate(-VW / 2, -VH / 2); drawPip(g); g.restore(); };
  yield say('Pip', '…Hi! Did you miss me? The sun said it had plenty of heart to spare. It sent a little bit back down. Turns out a heart that loves the world can be in two places at once!');
  yield say('', 'THE END… of the Long Night.\n\nYour game has been saved. The morning world is yours to explore: secrets, heart pieces and journal pages are still waiting.');
  G.endDraw = null; G.endUpd = null; G.mode = 'play';
  S.hp = S.maxHp; Game.lastRegion = null;
  Game.loadRoom('ow', 3, 4, 9 * TW + 24, 10 * TW + 24, 1); SaveSys.write();
  yield fadeTo(0, 1.5);
}

// ---------- goals, hints, quests ----------
function currentGoal() {
  if (!S) return '';
  const n = stoneCount();
  if (flag('won')) return 'The sun has risen! Explore the morning world. Find every heart piece and journal page, and finish your friends\' requests.';
  if (S.sword === 0) return 'Get a sword from <b>Brann the smith</b> in the Market Lane, east of the Great Hearth.';
  if (n === 0) return 'Find the <b>Rootheart Hollow</b>, a temple deep in Glimmerwood, north of Hearthvale.';
  if (n === 1) return 'Cross the broken bridge west of Hearthvale with the Tether Hook. Find the <b>Drowned Bell Temple</b> in Mirefen.';
  if (n === 2) return 'Bomb the boulders on the east side of Glimmerwood\'s <b>Forest Edge</b>, then climb to Frostspire\'s <b>Rimeglass Vault</b>.';
  if (n === 3) return 'Freeze the <b>Ember Creek</b> east of the Market Lane, then find the <b>Sunken Sunforge</b> in the Cinder Dunes.';
  if (n === 4) return 'Dash across the quicksand on the <b>Canyon Road</b>, south of the dunes, to reach Gearholm\'s <b>Stopped Clocktower</b>.';
  if (n === 5) return 'Bend the sunbeam on <b>Frostspire\'s summit</b> with the Mirror Shield to open the Sky Gate. The <b>Tempest Spire</b> waits above.';
  if (n === 6) return 'Leap the ravine north of the Drowned Bell Temple with the Wing Cloak. Find the <b>Cathedral of Echoes</b> in the Hollow Vale.';
  return flag('citadelOpen') ? 'Defeat the <b>Unlit King</b> in the Eclipse Citadel. Ride the Sun Altar\'s light to get there.' : 'Bring all seven Sunstones to the <b>Sun Altar</b> in Hearthvale\'s square.';
}
function pipHint() {
  const r = World.room;
  if (r.o.hint && !(r.solved && r.o.ev && r.o.ev !== 'boss')) return r.o.hint;
  if (r.A.dungeon) { const A = r.A; if (!S.maps[A.id]) return 'Every temple has a map hidden somewhere. Exploring every room helps! Cracked walls might hide a secret or two.'; if (!S.bkey[A.id]) return 'We still need this temple\'s <b>Great Key</b>. The map shows the rooms we haven\'t been to yet.'; return 'We have the Great Key! The guardian\'s door is marked on the map with a ☠. You can do it, Wren!'; }
  return currentGoal().replace(/<[^>]+>/g, '');
}
function sideQuests() {
  const q = [];
  if (flag('q:cat')) q.push({ text: 'Find Lily\'s kitten Mochi in <b>Glimmerwood</b>.', done: flag('q:catdone') });
  if (flag('q:ore')) q.push({ text: `Bring Brann 3 Sunsteel Ore (${Math.min(3, S.ore || 0)}/3).`, done: flag('q:oredone') });
  if (flag('q:lure')) q.push({ text: 'Reel in Gil\'s Lucky Lure from the deep water in Mirefen.', done: flag('q:luredone') });
  if (flag('q:flower')) q.push({ text: 'Bring Old Maud a Moonbloom from Frostspire.', done: flag('q:flowerdone') });
  if (flag('q:letter')) q.push({ text: 'Deliver Nima\'s letter to Kiri in the Skyreach Isles.', done: flag('q:letterdone') });
  if (flag('q:spring')) q.push({ text: `Find Professor Cog's 3 Mainsprings (${Math.min(3, S.flags['qi:spring'] || 0)}/3).`, done: flag('q:springdone') });
  return q;
}

// ---- 10z-net.js ----
// ================= online co-op ("Lantern Link") over the claude.ai room capability =================
// Each player keeps their own adventure and save. Players in the same room see each other live.
// One player per room (the lowest peer id) runs the shared enemies and boss; the others mirror them
// and send their hits through presence. Solved puzzles, doors and crystal switches are shared too.
const CLOAKS = [['#2a6878', '#3a8898'], ['#8a3a5a', '#b04a72'], ['#3a6a2a', '#4f8a3c'], ['#7a5a1a', '#a07a24'], ['#4a3a8a', '#6250b0'], ['#8a4a2a', '#b0603a']];
const CLOAK_NAMES = ['Teal', 'Rose', 'Moss', 'Amber', 'Violet', 'Rust'];
const ENEMY_EXTRA = { toad: ['tongue', 'tx', 'ty'], puff: ['blow'], jelly: ['zap', 'zt'], scorpion: ['sting', 'sa'], mimic: ['sleep'], knight: ['guardBroken'], sentry: ['timer'], pod: ['fire'], golem: ['throwT'], imp: ['timer'], gearbot: ['vx'] };
const BOSS_COMMON = ['x', 'y', 'z', 'hp', 'maxhp', 'st', 'tm', 'ph', 'flash', 'dying', 't'];
const BOSS_SYNC = {
  thornmaw: ['open', 'spin', 'bulbs', 'vine'], bogwyrm: ['up', 'mouth', 'stunT', 'pool'], kindlefang: ['frz', 'dir'],
  leviathan: ['up', 'exp', 'cracks'], colossus: ['core', 'eye', 'hands'], roc: ['fa', 'gust', 'pi'], echo: ['slash', 'dir'],
  king: ['phase', 'stunT', 'exposed', 'orbs', 'ray', 'beamT', 'w', 'h', 'solid'],
};
const BOSS_TITLES = { thornmaw: ['THORNMAW', 'The Bramble Heart'], bogwyrm: ['OLD BOGWYRM', 'Glutton of the Drowned Bell'], kindlefang: ['KINDLEFANG', 'The Wolf Who Ate the Dusk'], leviathan: ['DUNE LEVIATHAN', 'Swallower of Caravans'], colossus: ['TICK-TOCK COLOSSUS', 'Keeper of the Stopped Hour'], roc: ['STORM ROC', 'Tyrant of the Upper Winds'], echo: ['THE ECHO', 'Your Own Shadow'], king: ['THE UNLIT KING', 'Last Keeper of the Sun'] };
const r1 = v => Math.round(v * 10) / 10;
function packV(v) {
  if (typeof v === 'number') return Number.isFinite(v) ? Math.round(v * 10) / 10 : 0;
  if (typeof v === 'boolean' || typeof v === 'string' || v == null) return v;
  if (Array.isArray(v)) return v.slice(0, 12).map(packV);
  if (typeof v === 'object') { const o = {}; for (const k of Object.keys(v).slice(0, 12)) { const x = v[k]; if (typeof x !== 'function' && !(x && typeof x === 'object' && x.def)) o[k] = packV(x); } return o; }
  return null;
}
const cloneJ = v => (v && typeof v === 'object') ? JSON.parse(JSON.stringify(v)) : v;
function cleanName(s) { return String(s || '').replace(/[^\p{L}\p{N} _'.-]/gu, '').trim().slice(0, 14) || 'Friend'; }

const NET = {
  room: null, on: false, conn: false, myPeer: '', peers: [], others: [], mates: [], isAuth: true, authPeer: '',
  ghost: false, applying: false, quiet: false,
  hitSeq: 0, hits: [], lastHit: {}, evSeq: 0, events: [], lastEv: {}, shotSeq: 1, nidSeq: 1000, seenFx: new Set(), lastAu: null, sendT: 0, known: new Set(), beamT: 0,
  get name() { return cleanName(Settings.netName || 'Wren'); },
  get color() { return (Settings.netColor | 0) % CLOAKS.length; },
  init() {
    try {
      if (!window.claude || typeof window.claude.use !== 'function') return;
      window.claude.use('room').then(r => {
        if (!r) return;
        NET.room = r; NET.on = true;
        r.onPeers(ch => NET.onPeers(ch), () => { NET.on = false; NET.others = []; NET.mates = []; });
        r.onConnection(c => { NET.conn = c; }, () => { });
      }).catch(() => { });
    } catch (e) { }
  },
  onPeers(ch) {
    NET.peers = ch.peers;
    const me = ch.peers.find(p => p.sameTab); if (me) NET.myPeer = me.peer;
    NET.others = ch.peers.filter(p => !p.sameTab && p.kind === 'viewer' && p.presence && p.presence.v === 1);
    const maxSeq = a => Array.isArray(a) && a.length ? Math.max(...a.map(v => v[0] | 0)) : 0;
    for (const p of NET.others) if (!NET.known.has(p.peer)) { NET.known.add(p.peer); NET.lastHit[p.peer] = maxSeq(p.presence.hs); NET.lastEv[p.peer] = maxSeq(p.presence.ev); if (G.mode === 'play') { UI.toast(`${cleanName(p.presence.n)} joined your adventure!`); sfx('pipp'); } }
    for (const p of ch.left) if (NET.known.has(p.peer)) { NET.known.delete(p.peer); if (p.presence && p.presence.n && G.mode === 'play') UI.toast(`${cleanName(p.presence.n)} left`); }
  },
  sig() { const r = World.room; if (!r) return ''; return r.key + (G.ents.some(e => e.name === 'boss' && !e.dead) ? '#b' : ''); },
  here() { const r = World.room; return r ? NET.others.filter(p => p.presence.r === r.key) : []; },

  // ---------- per frame ----------
  tick(dt) {
    if (!NET.on || !NET.room || !S || !World.room || G.mode !== 'play') return;
    const sig = NET.sig();
    NET.mates = NET.others.filter(p => p.presence.g === sig && p.presence.al);
    const lower = NET.mates.filter(p => p.peer < NET.myPeer).sort((a, b) => a.peer < b.peer ? -1 : 1);
    NET.isAuth = lower.length === 0;
    NET.authPeer = NET.isAuth ? NET.myPeer : lower[0].peer;
    for (const e of G.ents) if ((e.name === 'enemy' || e.name === 'boss') && !e.dead) e.remote = !NET.isAuth;
    if (!NET.isAuth) { const a = lower[0]; if (a.presence.au) NET.applySnap(a.presence.au, a.peer); }
    else NET.applyHits();
    NET.applyEvents();
    NET.beamT = Math.max(0, NET.beamT - dt);
    NET.sendT -= dt; if (NET.sendT > 0) return; NET.sendT = 1 / 30;
    NET.send(sig);
  },
  send(sig) {
    const hk = P.hook && !P.hook.dead ? [Math.round(P.hook.x), Math.round(P.hook.y)] : 0;
    const p = {
      v: 1, n: NET.name, c: NET.color, g: sig, r: World.room.key, x: Math.round(P.x), y: Math.round(P.y), d: P.dir, w: P.walking ? 1 : 0, an: r1(P.anim % 1000),
      z: Math.round(P.z || 0), ai: P.air > 0 ? 1 : 0, fa: P.fall > 0 ? r1(P.fall) : 0, sh: P.shielding ? 1 : 0, hp: S.hp, mh: S.maxHp, sl: S.sword || 1, al: P.alive ? 1 : 0, st: stoneCount(),
      sw: P.swing ? [r1(P.swing.t), P.swing.spin ? 1 : 0] : 0, hk, sd: World.shadow ? 1 : 0, hs: NET.hits.slice(-6), ev: NET.events.slice(-5),
      au: NET.isAuth && NET.mates.length ? NET.snapshot() : null,
    };
    let j = JSON.stringify(p);
    if (j.length > 3800 && p.au) { p.au.f = []; p.au.s = p.au.s.slice(-4); j = JSON.stringify(p); }
    if (j.length > 3800 && p.au) { p.au.e = p.au.e.slice(0, 8); }
    NET.room.presence(p).catch(() => { });
  },
  snapshot() {
    const en = [], sh = [], fx = []; let boss = null;
    for (const e of G.ents) {
      if (e.dead) continue;
      const age = G.t - (e.born || 0);
      if (e.name === 'enemy') {
        if (e.nid == null) e.nid = NET.nidSeq++;
        const ex = {}; for (const k of ENEMY_EXTRA[e.kind] || []) if (e[k] != null) ex[k] = packV(e[k]);
        en.push([e.nid, e.kind, Math.round(e.x), Math.round(e.y), Math.round(e.z || 0), r1(e.hp), e.dir | 0, e.st || '', (e.under ? 1 : 0) | (e.frozen > 0 ? 2 : 0) | (e.stun > 0 ? 4 : 0) | (e.flash > 0 ? 8 : 0), r1(e.t || 0), ex, e.world || 0]);
      } else if (e.name === 'boss') {
        const o = { k: e.kind }; for (const k of BOSS_COMMON.concat(BOSS_SYNC[e.kind] || [])) if (e[k] !== undefined) o[k] = packV(e[k]); boss = o;
      } else if (e.name === 'shot' && e.owner === 'enemy' && age < .7 && sh.length < 14) {
        if (!e.sid) e.sid = NET.shotSeq++; sh.push([e.sid, e.kind, Math.round(e.x), Math.round(e.y), Math.round(e.vx), Math.round(e.vy), e.dmg, r1(e.homing || 0)]);
      } else if ((e.name === 'warn' || e.name === 'flame') && age < .7 && fx.length < 12) {
        if (!e.sid) e.sid = NET.shotSeq++;
        fx.push(e.name === 'warn' ? [e.sid, 'w', Math.round(e.x), Math.round(e.y), e.shape, r1(e.r || 0), r1(e.a || 0), Math.round(e.len || 0), Math.round(e.lw || 0), r1(e.t2), r1(e.max), e.col || '', e.fn ? 1 : 0] : [e.sid, 'f', Math.round(e.x), Math.round(e.y), r1(e.life)]);
      }
    }

  },
  applySnap(au, peer) {
    if (au === NET.lastAu) return; NET.lastAu = au;
    const map = new Map(); for (const e of G.ents) if (e.name === 'enemy' && !e.dead && e.nid != null) map.set(e.nid, e);
    const seen = new Set();
    for (const row of au.e || []) {
      const [nid, kind, x, y, z, hp, dir, st, fl, t, ex, world] = row;
      if (!ENEMY[kind]) continue;
      seen.add(nid);
      let e = map.get(nid);
      if (!e) e = spawnEnemy(kind, x, y, world ? [world] : [], { nid, summoned: true });
      e.remote = true; e.netSeen = true; e.tx = x; e.ty = y; e.z = z; e.hp = hp; e.dir = dir; e.st = st; e.t = t;
      e.under = !!(fl & 1); e.frozen = fl & 2 ? Math.max(e.frozen || 0, .3) : 0; e.stun = fl & 4 ? Math.max(e.stun || 0, .3) : 0; if (fl & 8 && !(e.flash > 0)) e.flash = .15;

    }

    for (const s of au.s || []) {

      const sh = spawn('shot', s[2], s[3], [s[1], s[4], s[5], 'enemy', s[6], 3.5]); if (s[7]) sh.homing = s[7]; sh.netCopy = true;

      if (f[1] === 'w') { const w = spawn('warn', f[2], f[3], [], { shape: f[4], r: f[5], a: f[6], len: f[7], lw: f[8], t2: f[9], max: f[10], col: f[11] || undefined, netCopy: true }); if (f[12]) w.fn = NET.warnHit; }

    const b = G.ents.find(e => e.name === 'boss' && !e.dead);

      if (b.kind === 'king' && b.phase !== oldPhase) { World.room.o.dark = b.phase === 2; if (b.phase === 3) { World.shadow = false; World.resolve(World.room); for (const em of entsOf('emitter')) em.need = null; } UI.toast(b.phase === 2 ? 'The King fled into the Shadow world!' : 'The King became an eclipse! Turn the sunbeams on him!'); }

  warnHit(w) { sfx('boom', .05); if (w.shape === 'c' ? pInCircle(w.x, w.y, w.r) : pInLine(w.x, w.y, w.a, w.len, w.lw)) P.hurt(w.shape === 'c' ? 2 : 3, w.x, w.y); },
  mirror(e, dt) {

  },
  // ---------- the room owner aims enemies at whichever player is closest ----------
  asTarget(e, fn) {

  // ---------- hits from players who mirror the room ----------
  fwd(e, dmg, kind, sx, sy, extra) {

  applyHits() {

  doEvent([, type, rk, data], m) {

  },
  lights() { const out = []; for (const m of NET.here()) { const p = m.presence; if (p.al) out.push([p.x, p.y - 20, 120, .8]); } return out; },
  drawHUD(g) {

// ================= game flow & main loop =================
const BEACONS = [];
const Weather = { list: [], kind: null };

const Game = {
  lastSave: 0, paused: false, trans: null, lastRegion: null,
  // ---------- starting ----------
  newGame(slot) {
    S = newSave(slot); SaveSys.write();
    G.mode = 'play'; applyTouch();

    Script.run(introScript);
  },
  continueGame(slot) {
    const s = SaveSys.read(slot); if (!s) return;
    S = Object.assign(newSave(slot), s); S.slot = slot;
    G.mode = 'play'; applyTouch();
    const p = S.pos; if (!AREAS[p.a] || !AREAS[p.a].rooms[p.rx + ',' + p.ry]) { p.a = 'ow'; p.rx = 3; p.ry = 4; p.x = 9.5 * TW; p.y = 7.5 * TW; }
    S.hp = Math.max(S.hp, Math.min(S.maxHp, 6));
    Game.loadRoom(p.a, p.rx, p.ry, p.x, p.y, p.d);
    UI.toast('Welcome back, Wren.');
  },
  toTitle() { Script.clear(); Menu.closeAll(); Dialog.active = false; $('#dialog').hidden = true; G.mode = 'title'; G.fade = 0; G.bossBar = null; applyTouch(); Audio2.play('title'); titleMenu(); },
  resume() { Game.paused = false; Input.clearAll(); },

  // ---------- rooms ----------
  spawnSpec(s, poof) {
    let spec = s.spec.trim(), hidden = false, unsolved = false;
    if (spec[0] === '?') { hidden = true; spec = spec.slice(1); }
    if (spec[0] === '!') { unsolved = true; spec = spec.slice(1); }
    const room = World.room;
    if (hidden && !room.solved) { room.hiddenSpecs.push(s); return null; }
    if (unsolved && room.solved) return null;
    const parts = spec.split(/\s+/), type = parts[0], args = parts.slice(1);
    const c = cellCenter(s.c, s.r);
    const fk = room.key + ':' + s.c + ',' + s.r;
    let e = null;
    if (type === 'key') { if (flag('kp:' + fk)) return null; e = spawn('pickup', c.x, c.y, ['key', 0, 'kp:' + fk]); }
    else if (type === 'item') { if (flag('it:' + fk)) return null; e = spawn('pickup', c.x, c.y, [args[0], 0, 'it:' + fk]); }
    else if (type === 'boss') { if (flag('boss:' + room.area)) return null; e = spawn('boss', c.x + (+args[1] || 0), c.y + (+args[2] || 0), args); }
    else if (type === 'chest') e = spawn('chest', c.x, c.y, args, { c: s.c, r: s.r });
    else e = spawn(type, c.x, c.y, args, { c: s.c, r: s.r });
    if (e && e.name === 'enemy') { room.nidN = room.nidN || 0; e.nid = room.nidN++; }
    if (!e) return null;
    if (e.def && e.def.init && type === 'chest') { e.fk = 'c:' + room.key + ':' + s.c + ',' + s.r; e.open = flag(e.fk); }
    if (unsolved) e.unsolvedOnly = true;
    if (poof) { burst(c.x, c.y - 10, 20, '#ffd76a', 140); ring(c.x, c.y, '#fff', 40); }
    return e;
  },
  loadRoom(area, rx, ry, px, py, dir) {
    const room = World.build(area, rx, ry);
    World.room = room; World.shadow = false; World.resolve(room);
    G.ents = []; G.parts = []; G.beams = []; G.bossBar = null; room.hiddenSpecs = [];
    for (const s of room.specs) Game.spawnSpec(s);
    // boss rewards left behind
    if (room.o.ev === 'boss' && flag('boss:' + area)) {
      const c = cellCenter(9, 6), n = AREAS[area].stone;
      if (!flag('got:hc:' + area) && AREAS[area].dungeon && n) spawn('pickup', c.x - 60, c.y, ['hc', 0, 'got:hc:' + area]);
      if (n && !flag('got:st:' + area)) spawn('pickup', c.x + 60, c.y, ['stone:' + n, 0, 'got:st:' + area]);
    }
    room.hadEnemies = G.ents.some(e => e.name === 'enemy' || e.name === 'boss');
    room.hasShut = room.t.includes('H');
    P.reset(px, py, dir);
    if (px > 0 && px < VW && py > 0 && py < VH && rectBlocked(P.x, P.y, P.w, P.h, 'solid', P)) unstickPlayer();
    World.render(room);
    S.visited[room.key] = 1;
    S.pos = { a: area, rx, ry, x: px, y: py, d: dir || 0 };
    // music & region banner
    const mus = room.o.music || (S.daylight && room.def.st === 'village' ? 'ending' : room.A.dungeon ? room.A.music : room.st.music);
    const ending = G.mode === 'ending';
    if (ending) { } else if (room.o.ev === 'boss' && !flag('boss:' + area)) Audio2.play(null, 1); else Audio2.play(mus);
    const region = room.A.dungeon ? room.A.name : room.st.name;
    if (!ending && region !== Game.lastRegion) { Game.lastRegion = region; if (G.mode === 'play' && area !== 'house') UI.banner(region, room.A.dungeon ? room.A.sub : (S.daylight ? 'Morning has come' : REGION_SUB[room.def.st] || '')); }
    Weather.list.length = 0; Weather.kind = room.st.fx;
    // first-entry story triggers
    if (room.o.enter && !ending) { const id = room.o.enter, T = TRIGGERS[id]; if (T && (!T.when || T.when()) && (T.repeat || !flag('en:' + id))) { setFlag('en:' + id); Script.run(T.run); } }
    if (Date.now() - Game.lastSave > 1500) { Game.lastSave = Date.now(); SaveSys.write(); }
  },
  savePoint() { const r = World.room; if (!r) return; S.pos = { a: r.area, rx: r.rx, ry: r.ry, x: P.alive ? P.x : S.pos.x, y: P.alive ? P.y : S.pos.y, d: P.dir }; },
  edge(dir) {
    if (Game.trans || G.cut) return;
    const r = World.room, A = r.A, nx = r.rx + DX[dir], ny = r.ry + DY[dir];
    const def = A.rooms[nx + ',' + ny];
    if (!def) {
      const ex = (r.o.exits && r.o.exits[dir]) || (dir === 0 && A.exit);
      if (ex) { Game.warp(ex.a, ex.rx, ex.ry, ex.c, ex.r, dir); return; }
      P.x = clamp(P.x, 6, VW - 6); P.y = clamp(P.y, 6, VH - 6); return;
    }
    let px = P.x, py = P.y;
    if (dir === 2) px = VW - 4; if (dir === 3) px = 4; if (dir === 1) py = VH - 4; if (dir === 0) py = 4;
    // snapshot the old room
    const snap = document.createElement('canvas'); snap.width = Math.ceil(VW * VIEW.rs); snap.height = Math.ceil(VH * VIEW.rs);
    const sg = snap.getContext('2d'); sg.setTransform(VIEW.rs, 0, 0, VIEW.rs, 0, 0); renderWorld(sg, true);
    const keepHook = null;
    Game.loadRoom(A.id, nx, ny, px, py, dir);
    const tx = px + DX[dir] * 40, ty = py + DY[dir] * 44;
    Game.trans = { dir, t: 0, dur: .48, snap, fx: px, fy: py, tx, ty };
  },
  warp(area, rx, ry, c, r, dir = 0, kind = 'fade', after) {
    if (Game.warping) return; Game.warping = true;
    Script.run(function* () {
      sfx('door'); yield fadeTo(1, .3);
      Game.loadRoom(area, rx, ry, c * TW + TW / 2, r * TW + TW / 2 + (dir === 1 ? -4 : 6), dir);
      Game.warping = false;
      yield wait(.1); yield fadeTo(0, .35);
      if (after) after();
    });
  },
  solveRoom(silent) {
    const r = World.room; if (r.solved && r.shutOpen) return;
    const had = r.hiddenSpecs.length || r.t.includes(':') || r.hasShut;
    r.solved = true; setFlag('sv:' + r.key); r.shutOpen = true; World.resolve(r); World.dirty = true;
    for (const s of r.hiddenSpecs) Game.spawnSpec(s, true); r.hiddenSpecs = [];
    for (const e of G.ents) if (e.unsolvedOnly) { e.dead = true; burst(e.x, e.y - 10, 10, '#fff', 80); }
    if (had) sfx(silent ? 'shutter' : 'secret');
    if (r.o.onSolve && TRIGGERS[r.o.onSolve]) Script.run(TRIGGERS[r.o.onSolve].run);
    if (r.o.ev !== 'boss') NET.event('solve');
  },
  checkEvents(dt) {
    const r = World.room, ev = r.o.ev;

    if (k === 'clouds') { p.x = -240; p.vx = rr(10, 25); p.s = rr(80, 160); p.c = 'rgba(230,236,255,.06)'; p.life = 40; }
    if (k === 'ash') { p.y = -10; p.vy = rr(15, 35); p.vx = rr(-15, 15); p.c = 'rgba(180,170,190,.6)'; p.s = rr(1, 2.5); p.life = 20; }
    if (k === 'motes') { p.c = 'rgba(255,240,200,.5)'; p.s = rr(1, 1.8); p.vy = -rr(2, 8); }
    if (k === 'drips') { p.y = rr(0, VH * .7); p.vy = 260; p.c = 'rgba(170,210,230,.6)'; p.s = 1.5; p.life = rr(.3, .8); p.drip = true; }
    if (k === 'void') { p.y = VH + 10; p.vy = -rr(15, 40); p.c = 'rgba(190,150,255,.7)'; p.s = rr(1, 2); }

function frameUpdate(dt) {

  if (G.bellFx) { G.bellFx.t += dt; if (G.bellFx.t > .8) G.bellFx = null; }

  if (G.mode === 'ending') { G.t += dt; if (Dialog.active) Dialog.update(dt); Script.update(dt); Menu.update(dt); if (G.endUpd) G.endUpd(dt); return; }
  if (G.mode !== 'play') return;

    return;

  updParts(dt); updWeather(dt);

  updateWorld(dt);
  NET.tick(dt);
  if (!G.cut && P.alive) {

    else if (Input.hit.map) { Game.paused = true; sfx('select'); Menu.show(pauseMenu(1)); }

}

    return { html: m ? `<span class="slot"><span class="t">Journey ${i + 1}${m.done ? ' ✦' : ''}</span><span class="sub">${m.where} · ♥ ${m.hearts} · ☀ ${m.stones}/7 · ${m.time}</span></span>` : `<span class="slot"><span class="t">Journey ${i + 1}</span><span class="sub">Empty</span></span>`, dis: !isNew && !s,
      fn: () => {
        if (!isNew) { Menu.closeAll(); Game.continueGame(i); return; }
        if (s) { Menu.show(listScreen('Overwrite this journey?', [{ label: 'Yes, start over', fn: () => { Menu.closeAll(); SaveSys.erase(i); Game.newGame(i); } }, { label: 'No', fn: () => Menu.close() }], { text: 'Your old progress in this slot will be lost forever.' })); return; }
        Menu.closeAll(); Game.newGame(i);
      } };
  });
  if (!isNew) items.push({ label: 'Delete a journey…', fn: () => Menu.show(listScreen('Delete which journey?', [0, 1, 2].filter(i => SaveSys.read(i)).map(i => ({ label: 'Journey ' + (i + 1), fn: () => { SaveSys.erase(i); Menu.closeAll(); titleMenu(); } })).concat([{ label: 'Cancel', fn: () => Menu.close() }]))) });
  Menu.show(listScreen(isNew ? 'Choose a journey slot' : 'Load a journey', items, { wide: true }));
}
function helpScreen() {
  Menu.show({
    build() {
      const p = el('div', 'panel'); p.style.maxWidth = '40em';
      p.innerHTML = `<h2>How to Play</h2>
      <div class="kv">
      <span>Move</span><span><span class="key">W A S D</span> or arrow keys</span>
      <span>Sword / talk / open</span><span><span class="key">Space</span> or <span class="key">J</span>. Hold it down, then let go for a spin attack</span>
      <span>Use tool</span><span><span class="key">K</span> or <span class="key">Shift</span></span>
      <span>Switch tool</span><span><span class="key">Q</span> <span class="key">E</span> or number keys</span>
      <span>Menu / map</span><span><span class="key">Esc</span> / <span class="key">M</span></span>
      <span>Ask Pip for a hint</span><span><span class="key">H</span></span>
      <span>Controller</span><span>A sword · X/B tool · LB/RB switch · Start menu · Y hint</span>
      </div>
      <p class="sub" style="margin-top:1em">The sun has gone out. Carry Pip, the last spark, across eight lands. In each temple you'll find a new tool, the key to its puzzles. Light the beacons to save and to travel. Cracked walls hide secrets, and heart pieces are tucked away everywhere.</p>
      <p class="sub">Your game saves itself every time you enter a new room. You can also save at any lit beacon.</p>`;
      return p;
    }, update() { if (Input.hit.back || Input.hit.pause || Input.hit.atk || Input.hit.act) { sfx('back'); Menu.close(); } }
  });
}

// ---------------- boot ----------------
let lastT = performance.now();
function loop(now) {
  requestAnimationFrame(loop);
  let dt = (now - lastT) / 1000; lastT = now; if (dt > .05) dt = .05; if (dt <= 0) return;
  frameUpdate(dt); render();
}
function boot() {
  loadSettings(); resize(); window.addEventListener('resize', resize);
  Input.setupTouch();
  cv.addEventListener('pointerdown', () => { Audio2.unlock(); Input.src.touch.act = true; setTimeout(() => { Input.src.touch.act = false; }, 90); });
  beaconsInit();
  NET.init();
  document.getElementById('boot').remove();
  G.mode = 'title'; titleMenu();
  const startAudio = () => { Audio2.unlock(); if (G.mode === 'title') Audio2.play('title'); };
  window.addEventListener('pointerdown', startAudio, { once: false });
  window.addEventListener('keydown', startAudio, { once: true });
  
  if (!/[?&]manual/.test(location.search)) requestAnimationFrame(loop);
}
window.addEventListener('load', boot);

</script>
