<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Misfit Sovereign</title>
<style>
:root{color-scheme:dark;--red:#ff4a6a;--red2:#ff8aa0;--gold:#ffd86a;--violet:#c8a8ff;--ink:#f4f0f6;--dim:#a8a0b4;--panel:rgba(14,8,18,.9);--line:rgba(255,90,120,.32);
--serif:"Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;--sans:"Avenir Next","Segoe UI","Helvetica Neue",system-ui,-apple-system,Roboto,Arial,sans-serif}
html,body{margin:0;height:100%;overflow:hidden;background:#07040a;color:var(--ink);font-family:var(--sans);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#c,#ov{position:fixed;inset:0;width:100%;height:100%;display:block;outline:none}
#ov{pointer-events:none}
[hidden]{display:none!important}
button{font-family:var(--sans);cursor:pointer}
input[type=text],textarea,select{font-family:var(--sans);font-size:15px;padding:7px 10px;border-radius:8px;border:1px solid var(--line);background:rgba(0,0,0,.4);color:var(--ink);outline:none;-webkit-user-select:text;user-select:text}
textarea{width:100%;box-sizing:border-box;height:110px;font:11px monospace}
input[type=color]{width:46px;height:28px;border:1px solid var(--line);border-radius:6px;background:none;padding:0}
input[type=range]{width:180px;accent-color:var(--red)}
/* ---- HUD ---- */
#hud{position:fixed;inset:0;pointer-events:none;transition:opacity .4s}
#hud.off{opacity:0}
.hudp{position:absolute;bottom:18px;left:18px;width:calc(100% - 36px)}
#hud1{display:none}
body.coop #hud1{display:block}
body.split #hud0{width:calc(50% - 36px)}
body.split #hud1{left:calc(50% + 18px);width:calc(50% - 36px)}
body.coop:not(.split) #hud1{bottom:118px}
#hud1.mini{display:block;bottom:auto;top:96px;left:18px}
#hud1.mini .slots,#hud1.mini .prompt,#hud1.mini .bar.st,#hud1.mini .ult{display:none}
#hud1.mini .bar.hp{width:170px;height:9px}#hud1.mini .bar.mp{width:130px;height:5px}#hud1.mini .badge{width:34px;height:34px}#hud1.mini .badge b{font-size:14px}
.vit{display:flex;gap:10px;align-items:flex-end}
.badge{width:52px;height:52px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#5a2a3a,#14060c);border:2px solid var(--red);display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 0 18px rgba(255,74,106,.35)}
#hud1 .badge{border-color:var(--violet);background:radial-gradient(circle at 35% 30%,#3a2a5a,#0c0614);box-shadow:0 0 18px rgba(200,168,255,.35)}
.badge b{font-family:var(--serif);font-size:20px;line-height:1}.badge small{font-size:8px;letter-spacing:.15em;color:var(--dim)}
.bars{display:flex;flex-direction:column;gap:4px}
.bars .nm{font-size:12px;font-weight:800;letter-spacing:.06em;text-shadow:0 1px 3px #000}.bars .nm em{font-style:normal;color:var(--gold);font-weight:600;font-size:10px;margin-left:6px;letter-spacing:.1em;text-transform:uppercase}
.bar{position:relative;height:13px;width:270px;background:rgba(0,0,0,.6);border:1px solid rgba(255,255,255,.16);border-radius:7px;overflow:hidden}
body.split .bar.hp{width:220px}
.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:7px}
.bar .ghost{background:rgba(255,255,255,.5);transition:width .6s .25s}.bar .fill{transition:width .08s}
.bar.hp .fill{background:linear-gradient(180deg,#ff8a9a,#e83a52 55%,#9a1830)}.bar .shield{background:rgba(180,210,255,.55)}
.bar.mp{height:8px;width:210px}.bar.mp .fill{background:linear-gradient(180deg,#b89aff,#6a3ae8)}
.bar.st{height:4px;width:160px}.bar.st .fill{background:linear-gradient(180deg,#fff0a0,#e8c03a)}
.bar .txt{position:absolute;inset:0;font-size:9px;line-height:13px;text-align:center;font-weight:800;text-shadow:0 1px 2px #000}.bar.mp .txt{line-height:8px;font-size:7px}
.bar.flash{animation:bf .4s}@keyframes bf{50%{box-shadow:0 0 0 2px var(--red)}}
.ult{position:relative;width:46px;height:46px}.ult svg{position:absolute;inset:0;transform:rotate(-90deg)}
.ult .ub{fill:rgba(0,0,0,.55);stroke:rgba(255,255,255,.15);stroke-width:4}.ult .uf{fill:none;stroke:var(--red);stroke-width:4;stroke-dasharray:106.8;stroke-linecap:round}
#hud1 .ult .uf{stroke:var(--violet)}
.ult span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:18px;opacity:.5}
.ult.full span{opacity:1;animation:pulse 1s infinite}.ult.full .uf{filter:drop-shadow(0 0 5px #ff4a6a)}
@keyframes pulse{50%{transform:scale(1.25)}}
.slots{display:flex;gap:6px;margin-top:8px}
.slot{position:relative;width:44px;height:44px;border-radius:10px;background:radial-gradient(circle at 40% 30%,rgba(90,40,70,.9),rgba(14,6,12,.94));border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:20px;overflow:hidden}
.slot .k{position:absolute;left:3px;top:1px;font-size:9px;color:var(--dim);font-weight:800}
.slot .cd{position:absolute;inset:0;background:conic-gradient(rgba(0,0,0,.72) var(--p,0%),transparent 0)}
.slot .n{position:absolute;right:3px;bottom:1px;font-size:10px;font-weight:800}
.slot.empty{opacity:.3}.slot.nomp .ic{filter:grayscale(1) brightness(.6)}.slot.pot{margin-left:8px;border-color:rgba(124,255,154,.45)}
.prompt{position:absolute;left:50%;bottom:120px;transform:translateX(-50%);background:var(--panel);border:1px solid var(--line);padding:7px 15px;border-radius:22px;font-size:14px;white-space:nowrap;display:flex;gap:8px;align-items:center}
.key{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:22px;padding:0 6px;border-radius:6px;background:#ffe8ee;color:#2a0a12;font-weight:900;font-size:12px;box-shadow:0 2px 0 #a86a7a}
.down{position:absolute;left:50%;bottom:200px;transform:translateX(-50%);font-family:var(--serif);font-size:22px;color:#ff8a8a;text-shadow:0 2px 8px #000;white-space:nowrap}
.ptoast{position:absolute;left:0;bottom:150px;display:flex;flex-direction:column;gap:5px;align-items:flex-start}
#topc{position:absolute;left:50%;top:12px;transform:translateX(-50%);text-align:center;max-width:46vw}
#zone b{display:block;font-family:var(--serif);font-size:19px;color:#ffe8ee;text-shadow:0 2px 6px #000;letter-spacing:.04em}
#zone small{font-size:10px;letter-spacing:.16em;color:var(--dim);text-transform:uppercase}
#obj{margin-top:6px;font-size:13px;background:linear-gradient(90deg,transparent,rgba(20,8,16,.8),transparent);padding:4px 26px;color:var(--gold);text-shadow:0 1px 2px #000}
#obj::before{content:"★ ";opacity:.7}
#wallet{position:absolute;right:18px;bottom:18px;display:flex;flex-direction:column;align-items:flex-end;gap:2px;font-size:13px;font-weight:800;text-shadow:0 1px 3px #000}
body.split #wallet{right:auto;left:50%;transform:translateX(-50%);bottom:auto;top:98px;flex-direction:row;gap:14px}
body.split #bossbar{top:128px}
#bossbar{position:absolute;left:50%;top:84px;transform:translateX(-50%);width:min(620px,70vw);text-align:center}
#bossbar .bn{font-family:var(--serif);font-size:20px;color:#ffe0e6;text-shadow:0 2px 6px #000;letter-spacing:.05em}
#bossbar .bt{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);margin-bottom:5px}
#bossbar .bar{width:100%;height:15px}#bossbar .bar .fill{background:linear-gradient(180deg,#ff9a6a,#d83a2a 60%,#8a1a1a)}
#bossbar .brkb{height:4px;margin-top:3px;background:rgba(0,0,0,.5);border-radius:2px;overflow:hidden}#bossbar .brk{display:block;height:100%;background:var(--gold)}
#bossbar .ph{font-size:10px;color:var(--dim);margin-top:3px;letter-spacing:.1em}
#toasts{position:fixed;left:50%;top:150px;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;z-index:5}
.toast{background:var(--panel);border-left:3px solid #fff;padding:7px 14px;border-radius:6px;font-size:13px;max-width:460px;box-shadow:0 6px 20px rgba(0,0,0,.45)}
#banner{position:fixed;left:0;right:0;top:30%;text-align:center;pointer-events:none;opacity:0;z-index:6}
#banner b{display:block;font-family:var(--serif);font-size:clamp(28px,5vw,54px);letter-spacing:.08em;color:#fff;text-shadow:0 0 24px rgba(255,74,106,.8),0 3px 10px #000}
#banner small{display:block;margin-top:6px;font-size:14px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);text-shadow:0 2px 6px #000}
#banner.on{animation:ban 3.2s ease forwards}@keyframes ban{0%{opacity:0;transform:scale(1.1)}12%{opacity:1;transform:scale(1)}80%{opacity:1}100%{opacity:0}}
#fps{position:fixed;right:8px;top:6px;font-size:11px;color:#9a9;z-index:9}
/* ---- dialog ---- */
#dialog{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);width:min(780px,92vw);background:linear-gradient(180deg,rgba(26,10,20,.95),rgba(10,4,10,.96));border:1px solid var(--line);border-radius:14px;padding:16px 22px 12px;box-shadow:0 10px 40px rgba(0,0,0,.6);z-index:7;cursor:pointer}
#dialog::before{content:"";position:absolute;left:14px;right:14px;top:6px;height:1px;background:linear-gradient(90deg,transparent,rgba(255,216,106,.5),transparent)}
#dialog .who{font-family:var(--serif);font-size:18px;font-weight:700;margin-bottom:6px;letter-spacing:.04em}
#dialog .txt{font-size:17px;line-height:1.5;min-height:52px}
#dialog.narr .txt{font-family:var(--serif);font-style:italic;color:#e8dcf0}
#dialog .hint{text-align:right;font-size:10px;color:var(--dim);margin-top:4px;letter-spacing:.08em}
/* ---- menus ---- */
#menu{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at center,rgba(20,6,14,.55),rgba(4,2,6,.8));z-index:8;overflow:auto}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px 26px;width:min(560px,92vw);max-height:88vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.6);box-sizing:border-box}
.panel.wide{width:min(900px,94vw)}
.panel h2{margin:0 0 10px;font-family:var(--serif);font-weight:700;font-size:24px;letter-spacing:.03em;color:#ffe8ee}
.panel h3{font-family:var(--serif);color:var(--gold);margin:14px 0 6px;font-size:17px}
.dim{color:var(--dim)}.small{font-size:12px}.center{justify-content:center}
.btn{background:linear-gradient(180deg,#d83a5a,#8a1a32);color:#fff;border:1px solid rgba(255,180,200,.4);border-radius:10px;padding:9px 18px;font-weight:800;font-size:14px;letter-spacing:.03em;box-shadow:0 4px 14px rgba(0,0,0,.4)}
.btn:hover,.btn:focus{filter:brightness(1.2);outline:2px solid var(--gold);outline-offset:1px}
.btn.sec{background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.18)}.btn.sm{padding:5px 11px;font-size:12px;border-radius:8px}.btn.big{padding:13px 30px;font-size:17px}
.btn:disabled{opacity:.35;cursor:default;filter:none}
.menu-list{display:flex;flex-direction:column;gap:7px}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between;margin:7px 0;flex-wrap:wrap}
.slot-row{border-bottom:1px solid rgba(255,255,255,.07);padding-bottom:7px}
.foot{display:flex;justify-content:space-between;margin-top:16px;gap:10px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:700px){.two{grid-template-columns:1fr}}
.card{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:12px 16px}
.card label{display:flex;justify-content:space-between;align-items:center;margin:7px 0;gap:10px;font-size:14px}
.tabs{display:flex;gap:8px;margin-bottom:10px}.tab{flex:1;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12);color:var(--ink);border-radius:10px;padding:7px;font-weight:800}
.tab.on{border-color:var(--c);box-shadow:inset 0 -3px 0 var(--c)}
.stats{width:100%;font-size:13px;border-collapse:collapse}.stats td{padding:3px 0;border-bottom:1px solid rgba(255,255,255,.05)}.stats td:last-child{text-align:right;font-weight:800}
.seals{display:flex;gap:6px;font-size:20px;margin:8px 0;color:#5a4a5a}.seals .on{color:var(--red);text-shadow:0 0 10px var(--red)}
.req{font-size:13px;padding-left:18px}.req li{color:#ff9a9a}.req li.ok{color:#9affb0}.req li.ok::marker{content:"✓ "}
.spells,.sigils,.bag{display:flex;flex-direction:column;gap:6px}
.sp,.sg,.it{display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07);border-radius:10px;padding:8px 12px}
.it{justify-content:space-between;border-left:3px solid var(--r,#888)}.it.empty{opacity:.5}
.sp .ic,.sg .ic{font-size:24px;width:34px;text-align:center}.sp .info{flex:1;font-size:13px}.sp .acts,.it .acts{white-space:nowrap}
.sp.locked{opacity:.4}.sp.have{border-color:rgba(255,90,120,.35)}.sp.sel{outline:2px solid var(--gold)}
.sg{justify-content:space-between}.sg>div:nth-child(2){flex:1;font-size:13px}
.lvl{color:var(--gold);font-weight:800;font-size:12px}
.bar-slots{display:flex;gap:8px;margin:8px 0 12px}.sslot{width:54px;height:54px;border-radius:10px;background:rgba(0,0,0,.4);border:1px solid var(--line);color:var(--ink);font-size:11px;font-weight:800}.sslot.pick{border-color:var(--gold);box-shadow:0 0 10px rgba(255,216,106,.5)}
.floors{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}.floors small{font-weight:500;opacity:.8}
.form label{display:flex;justify-content:space-between;align-items:center;margin:8px 0;gap:12px;font-size:14px}.form .chk{justify-content:flex-start}
.ctl{width:100%;border-collapse:collapse;font-size:13px}.ctl th,.ctl td{padding:5px 8px;border-bottom:1px solid rgba(255,255,255,.07);text-align:left}.ctl th{color:var(--gold)}
.chapters .ch{font-size:13px;padding:2px 0}.ch.done{color:#9affb0}.ch.now{color:var(--gold);font-weight:800}.ch.lock{color:#6a6070}
.credits{text-align:center}.credits p{line-height:1.6}
/* ---- title ---- */
.title{display:flex;flex-direction:column;align-items:center;gap:22px;text-align:center;position:absolute;left:6vw;top:50%;transform:translateY(-50%)}
.logo b{display:block;font-family:var(--serif);font-size:clamp(44px,7vw,86px);line-height:.95;letter-spacing:.06em;color:#fff;text-shadow:0 0 30px rgba(255,40,80,.85),0 4px 14px #000}
.logo small{display:block;font-size:13px;letter-spacing:.35em;text-transform:uppercase;color:var(--gold);margin-bottom:10px;text-shadow:0 2px 6px #000}
.logo i{display:block;height:2px;margin:14px auto 0;width:70%;background:linear-gradient(90deg,transparent,var(--red),transparent)}
.title .col{display:flex;flex-direction:column;gap:10px;min-width:230px}
.fine{font-size:12px;color:var(--dim);max-width:340px;text-shadow:0 1px 3px #000}
#loading{position:fixed;inset:0;background:#07040a;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:10;gap:10px}
#loading .ln{font-family:var(--serif);font-size:30px;letter-spacing:.06em}#loading .ls{font-size:12px;letter-spacing:.2em;color:var(--dim);text-transform:uppercase}#loading .tip2{margin-top:30px;font-size:13px;color:var(--gold);max-width:520px;text-align:center}
#loading .ring{width:64px;height:64px;border-radius:50%;border:2px solid rgba(255,74,106,.2);border-top-color:var(--red);animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
#touch{display:none}
body.touchmode #touch{display:block}
#touch .stick{position:fixed;width:110px;height:110px;border-radius:50%;border:2px solid rgba(255,255,255,.25);transform:translate(-50%,-50%);display:none;pointer-events:none}#touch .stick.show{display:block}
#touch .knob{position:absolute;left:35px;top:35px;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.35)}
#touch .tb{position:fixed;width:58px;height:58px;border-radius:50%;background:rgba(40,10,20,.6);border:1px solid var(--line);color:#fff;font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center}
#touch .tb.on{background:rgba(255,74,106,.5)}
</style>
</head>
<body>
<canvas id="c" tabindex="0"></canvas>
<canvas id="ov"></canvas>
<div id="hud" class="off">
  <div id="topc"><div id="zone"></div><div id="obj"></div></div>
  <div id="bossbar" hidden><div class="bn"></div><div class="bt"></div><div class="bar"><i class="ghost"></i><i class="fill"></i></div><div class="brkb"><i class="brk"></i></div><div class="ph"></div></div>
  <div class="hudp" id="hud0"></div>
  <div class="hudp" id="hud1"></div>
  <div id="wallet"></div>
</div>
<div id="toasts"></div>
<div id="banner"></div>
<div id="fps" hidden></div>
<div id="dialog" hidden><div class="who"></div><div class="txt"></div><div class="hint"></div></div>
<div id="menu" hidden></div>
<div id="loading" hidden><div class="ring"></div><div class="ln"></div><div class="ls"></div><div class="tip2"></div></div>
<div id="touch"><div class="stick"><div class="knob"></div></div>
<div class="tb" data-act="attack" style="right:30px;bottom:110px;width:72px;height:72px">ATK</div><div class="tb" data-act="jump" style="right:120px;bottom:40px">JUMP</div><div class="tb" data-act="dodge" style="right:30px;bottom:30px">DODGE</div>
