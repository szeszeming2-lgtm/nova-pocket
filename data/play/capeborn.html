<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Capeborn</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#05070c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Capeborn">
<meta name="application-name" content="Capeborn">
<meta name="format-detection" content="telephone=no">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="favicon.png">
<style>
:root{color-scheme:dark;--gold:#ffd24a;--blue:#2a6aff;--red:#ff4a4a;--ink:#f6f4ee;--dim:#a8acb8;--panel:rgba(10,14,26,.93);--line:rgba(255,210,74,.35);
--comic:Impact,"Arial Black","Haettenschweiler","Franklin Gothic Heavy",sans-serif;--sans:"Avenir Next","Segoe UI","Helvetica Neue",system-ui,-apple-system,Roboto,Arial,sans-serif}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;background:#05070c;color:var(--ink);font-family:var(--sans);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;-webkit-text-size-adjust:100%}
#c{touch-action:none}
#c,#ov{position:fixed;inset:0;width:100%;height:100%;display:block;outline:none}
#ov{pointer-events:none}
[hidden]{display:none!important}
button{font-family:var(--sans);cursor:pointer}
input[type=text],textarea,select{font-family:var(--sans);font-size:15px;padding:7px 10px;border-radius:8px;border:2px solid #000;background:#141a2a;color:var(--ink);outline:none;-webkit-user-select:text;user-select:text}
textarea{width:100%;box-sizing:border-box;height:100px;font:11px monospace}
input[type=range]{width:180px;accent-color:var(--gold)}
/* ---- HUD ---- */
#hud{position:fixed;inset:0;pointer-events:none;transition:opacity .4s}
#hud.off{opacity:0}
#hudhero{position:absolute;left:max(18px,env(safe-area-inset-left,0px));bottom:max(18px,env(safe-area-inset-bottom,0px));display:flex;gap:10px;align-items:flex-end;--hc:#ffd24a}
.badge{width:62px;height:62px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#2a3450,#0a0e1a);border:3px solid var(--hc);display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 0 0 3px #000,0 0 22px color-mix(in srgb,var(--hc) 50%,transparent)}
.badge span{font-size:24px;line-height:1}.badge b{font-family:var(--comic);font-size:14px;letter-spacing:.04em;margin-top:1px}
.bars{display:flex;flex-direction:column;gap:4px}
.nm{font-family:var(--comic);font-size:20px;letter-spacing:.05em;text-shadow:2px 2px 0 #000;color:var(--hc)}.nm em{font-family:var(--sans);font-style:normal;color:#fff;font-weight:700;font-size:11px;margin-left:8px;letter-spacing:.08em;text-transform:uppercase;opacity:.75}
.bar{position:relative;height:15px;width:290px;background:rgba(0,0,0,.65);border:2px solid #000;border-radius:3px;overflow:hidden;transform:skewX(-12deg)}
.bar i{position:absolute;left:0;top:0;bottom:0}
.bar .ghost{background:rgba(255,255,255,.55);transition:width .6s .25s}.bar .fill{transition:width .08s}
.bar.hp .fill{background:linear-gradient(180deg,#8affa0,#28c858 55%,#127a30)}
#hudhero.low .bar.hp .fill{background:linear-gradient(180deg,#ff9a8a,#e83a2a 55%,#8a1810);animation:blink .5s infinite}@keyframes blink{50%{opacity:.6}}
.bar.en{height:9px;width:230px}.bar.en .fill{background:linear-gradient(180deg,#9ae8ff,#2a9aff)}
.xpb{height:4px;width:200px;background:rgba(0,0,0,.6);border:1px solid #000;position:relative}.xpb i{position:absolute;left:0;top:0;bottom:0;background:var(--gold)}
.bar .txt{position:absolute;inset:0;font-size:10px;line-height:15px;text-align:center;font-weight:900;text-shadow:0 1px 2px #000;transform:skewX(12deg)}
#slots{position:absolute;left:50%;bottom:max(18px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;gap:8px}
.slot{position:relative;width:52px;height:52px;border-radius:10px;background:radial-gradient(circle at 40% 30%,#2a3858,#0a0e1a);border:3px solid #000;box-shadow:0 0 0 2px rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;font-size:24px;overflow:hidden}
.slot .k{position:absolute;left:4px;top:1px;font-size:10px;color:#fff;font-weight:900;text-shadow:0 1px 2px #000}
.slot .n{position:absolute;right:4px;bottom:1px;font-size:10px;font-weight:900;color:#9ae8ff}
.slot .cd{position:absolute;inset:0;background:conic-gradient(rgba(0,0,0,.75) var(--p,0%),transparent 0)}
.slot.nomp .ic{filter:grayscale(1) brightness(.55)}
.slot.ult{width:60px;height:60px;border-radius:50%;margin-left:6px;margin-top:-4px}.slot.ult svg{position:absolute;inset:-1px;transform:rotate(-90deg)}
.slot.ult .ub{fill:none;stroke:rgba(255,255,255,.12);stroke-width:4}.slot.ult .uf{fill:none;stroke:var(--gold);stroke-width:4;stroke-dasharray:106.8;stroke-linecap:round}
.slot.ult .ic{opacity:.45}.slot.ult.full .ic{opacity:1;animation:pulse 1s infinite}.slot.ult.full{box-shadow:0 0 0 2px var(--gold),0 0 24px var(--gold)}
@keyframes pulse{50%{transform:scale(1.25)}}
#combo{position:absolute;right:26px;top:38%;text-align:right;transform:rotate(-6deg)}
#combo b{display:block;font-family:var(--comic);font-size:64px;line-height:.9;color:#fff;-webkit-text-stroke:3px #000;text-shadow:4px 4px 0 #000}
#combo small{font-family:var(--comic);font-size:20px;letter-spacing:.1em;color:var(--gold);text-shadow:2px 2px 0 #000}
#combo .cb{height:5px;width:120px;margin:4px 0 0 auto;background:rgba(0,0,0,.6);border:1px solid #000}#combo .cb i{display:block;height:100%;background:var(--gold)}
#combo.hot b{color:var(--gold);animation:pulse .5s infinite}
#wallet{position:absolute;right:max(18px,env(safe-area-inset-right,0px));bottom:max(18px,env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:flex-end;gap:3px;font-size:14px;font-weight:900;text-shadow:0 1px 3px #000}
#wallet .sp{color:var(--gold);font-size:12px}
#topc{position:absolute;left:50%;top:max(12px,env(safe-area-inset-top,0px));transform:translateX(-50%);text-align:center;max-width:60vw}
#zone b{display:block;font-family:var(--comic);font-size:24px;letter-spacing:.06em;color:#fff;text-shadow:2px 2px 0 #000}
#zone small{font-size:10px;letter-spacing:.16em;color:var(--dim);text-transform:uppercase;text-shadow:0 1px 2px #000}
#obj{margin-top:6px;font-size:14px;font-weight:700;background:#fff;color:#111;padding:4px 16px;border:2px solid #000;box-shadow:3px 3px 0 #000;display:inline-block;transform:skewX(-8deg)}
#obj:empty{display:none}
#prompt{position:absolute;left:50%;bottom:110px;transform:translateX(-50%);background:var(--panel);border:2px solid var(--gold);padding:7px 15px;border-radius:22px;font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden}
#prompt i{position:absolute;left:0;bottom:0;height:3px;background:var(--gold)}
.key{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:22px;padding:0 6px;border-radius:5px;background:#fff;color:#111;font-weight:900;font-size:12px;box-shadow:0 2px 0 #888}
#bossbar{position:absolute;left:50%;top:92px;transform:translateX(-50%);width:min(640px,72vw);text-align:center}
#bossbar .bn{font-family:var(--comic);font-size:28px;letter-spacing:.06em;color:#ff5a4a;-webkit-text-stroke:1px #000;text-shadow:3px 3px 0 #000}
#bossbar .bt{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:#fff;margin-bottom:5px;text-shadow:0 1px 2px #000}
#bossbar .bar{width:100%;height:18px}#bossbar .bar .fill{background:linear-gradient(180deg,#ff9a6a,#e83a2a 60%,#8a1a1a)}
#bossbar .brkb{height:5px;margin-top:4px;background:rgba(0,0,0,.55);border:1px solid #000}#bossbar .brk{display:block;height:100%;background:var(--gold)}
#bossbar .ph{font-size:11px;font-weight:900;color:#fff;margin-top:3px;letter-spacing:.12em;text-shadow:0 1px 2px #000}
#toasts{position:fixed;left:50%;top:150px;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;z-index:5}
.toast{background:var(--panel);border:2px solid #000;border-left:5px solid #fff;padding:7px 14px;font-size:13px;font-weight:600;max-width:520px;box-shadow:4px 4px 0 rgba(0,0,0,.6);transition:opacity .5s}
#banner{position:fixed;left:0;right:0;top:27%;text-align:center;pointer-events:none;opacity:0;z-index:6}
#banner b{display:inline-block;font-family:var(--comic);font-size:clamp(30px,6vw,64px);letter-spacing:.05em;color:var(--gold);-webkit-text-stroke:2px #000;text-shadow:5px 5px 0 #000;transform:rotate(-3deg)}
#banner small{display:block;margin-top:8px;font-size:15px;font-weight:800;letter-spacing:.15em;text-transform:uppercase;color:#fff;text-shadow:0 2px 6px #000}
#banner.on{animation:ban 3s ease forwards}@keyframes ban{0%{opacity:0;transform:scale(1.6)}10%{opacity:1;transform:scale(1)}82%{opacity:1}100%{opacity:0}}
#chapter{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(620px,90vw);background:#fff;color:#111;border:4px solid #000;box-shadow:10px 10px 0 #000;padding:22px 28px;text-align:center;opacity:0;pointer-events:none;z-index:6}
#chapter b{display:block;font-family:var(--comic);font-size:42px;letter-spacing:.04em;color:#c8281a;line-height:1}
#chapter small{display:block;font-weight:900;letter-spacing:.2em;text-transform:uppercase;font-size:12px;margin-bottom:6px}
#chapter i{display:block;margin-top:10px;font-size:15px;font-style:italic}
#chapter.on{animation:chap 5s ease forwards}@keyframes chap{0%{opacity:0;transform:translate(-50%,-50%) scale(.6) rotate(-4deg)}8%{opacity:1;transform:translate(-50%,-50%) scale(1) rotate(-1deg)}85%{opacity:1}100%{opacity:0}}
#fps{position:fixed;right:8px;top:6px;font-size:11px;color:#9a9;z-index:9}
/* ---- dialog: comic speech panel ---- */
#dialog{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);width:min(820px,94vw);background:#fff;color:#111;border:4px solid #000;box-shadow:8px 8px 0 rgba(0,0,0,.7);padding:14px 20px 10px 96px;z-index:7;cursor:pointer;box-sizing:border-box;min-height:104px}
#dialog .face{position:absolute;left:14px;top:14px;width:66px;height:66px;border:3px solid #000;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:30px;font-family:var(--comic);color:#fff;text-shadow:2px 2px 0 #000}
#dialog .who{font-family:var(--comic);font-size:22px;letter-spacing:.05em;-webkit-text-stroke:1px #000;margin-bottom:2px}
#dialog .txt{font-size:18px;line-height:1.45;font-weight:600;min-height:48px}
#dialog.narr{background:#ffe9a0;padding-left:22px}#dialog.narr .txt{font-style:italic}#dialog.narr .who{display:none}
#dialog .hint{text-align:right;font-size:10px;color:#555;margin-top:2px;letter-spacing:.06em}
/* ---- menus ---- */
#menu{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at center,rgba(8,12,24,.5),rgba(2,4,8,.82));z-index:8;overflow:auto}
.panel{background:var(--panel);border:3px solid #000;box-shadow:8px 8px 0 #000,0 0 0 1px var(--line) inset;border-radius:6px;padding:22px 26px;width:min(580px,92vw);max-height:88vh;overflow:auto;box-sizing:border-box}
.panel.wide{width:min(940px,95vw)}
.panel h2{margin:0 0 10px;font-family:var(--comic);font-weight:400;font-size:32px;letter-spacing:.05em;color:var(--gold);text-shadow:3px 3px 0 #000}
.panel h3{font-family:var(--comic);font-weight:400;letter-spacing:.05em;color:#fff;margin:14px 0 6px;font-size:20px}
.dim{color:var(--dim)}.small{font-size:12px}.ok{color:#8affb0}.bad{color:#ff8a7a}
.btn{background:linear-gradient(180deg,#ffd24a,#e8a020);color:#111;border:3px solid #000;border-radius:6px;padding:9px 18px;font-weight:900;font-size:14px;letter-spacing:.03em;box-shadow:3px 3px 0 #000}
.btn:hover,.btn:focus{filter:brightness(1.12);outline:2px solid #fff;outline-offset:1px}.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 #000}
.btn.sec{background:#1e2840;color:#fff}.btn.sm{padding:5px 11px;font-size:12px}.btn.big{padding:13px 30px;font-size:18px}
.btn:disabled{opacity:.35;cursor:default;filter:none}
.menu-list{display:flex;flex-direction:column;gap:8px}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between;margin:7px 0;flex-wrap:wrap}.row.wrap{justify-content:flex-start}
.slot-row{border-bottom:1px solid rgba(255,255,255,.08);padding-bottom:8px}
.foot{display:flex;justify-content:space-between;align-items:center;margin-top:16px;gap:10px}.foot.center{justify-content:center}
.two{display:grid;grid-template-columns:1fr 1fr;gap:18px}@media (max-width:720px){.two{grid-template-columns:1fr}}
.card{background:rgba(255,255,255,.04);border:2px solid rgba(255,255,255,.1);border-radius:6px;padding:10px 14px;margin:8px 0}
.stats{width:100%;font-size:13px;border-collapse:collapse}.stats td{padding:4px 0;border-bottom:1px solid rgba(255,255,255,.06)}.stats td:last-child{text-align:right;font-weight:900}
.spells{display:flex;flex-direction:column;gap:6px}
.sp{display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.04);border:2px solid rgba(255,255,255,.08);border-radius:6px;padding:8px 12px}
.sp .ic{font-size:26px;width:36px;text-align:center}.sp .info{flex:1;font-size:13px}.sp .acts{white-space:nowrap}.sp.have{border-color:rgba(255,210,74,.3)}
.lvl{color:var(--gold);font-weight:900;font-size:12px}
.hero-tabs{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.hero-tab{width:76px;height:66px;background:#141a2a;border:3px solid #000;border-radius:6px;color:#fff;font-size:24px;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:3px 3px 0 #000}
.hero-tab small{font-size:10px;font-weight:800;margin-top:2px}.hero-tab.on{border-color:var(--c);box-shadow:0 0 0 2px var(--c),3px 3px 0 #000}.hero-tab.locked{opacity:.4}
.floors{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}.floors small{font-weight:600;opacity:.85}
.form label{display:flex;justify-content:space-between;align-items:center;margin:8px 0;gap:12px;font-size:14px}
.ctl{width:100%;border-collapse:collapse;font-size:13px}.ctl th,.ctl td{padding:5px 8px;border-bottom:1px solid rgba(255,255,255,.07);text-align:left}.ctl th{color:var(--gold)}
.chapters .ch{font-size:13px;padding:2px 0}.ch.done{color:#8affb0}.ch.now{color:var(--gold);font-weight:900}.ch.lock{color:#5a6070}
#mapc{display:block;width:100%;max-width:calc(58vh * 900 / 520);height:auto;margin:0 auto;border:3px solid #000;border-radius:4px;background:#0c2a40}
.xclose{position:fixed;z-index:10;right:max(10px,env(safe-area-inset-right,0px));top:max(50px,calc(env(safe-area-inset-top,0px) + 44px))}
.credits{text-align:center}.credits p{line-height:1.6;font-size:15px}
/* ---- title ---- */
.title{display:flex;flex-direction:column;align-items:flex-start;gap:18px;position:absolute;left:6vw;top:50%;transform:translateY(-50%);max-width:92vw}
.logo b{display:block;font-family:var(--comic);font-weight:400;font-size:clamp(56px,10vw,116px);line-height:.9;letter-spacing:.04em;color:var(--gold);-webkit-text-stroke:3px #000;text-shadow:7px 7px 0 #000,0 0 40px rgba(255,180,40,.5);transform:rotate(-3deg)}
.logo em{display:block;font-family:var(--comic);font-style:normal;font-size:clamp(20px,3vw,30px);letter-spacing:.12em;color:#fff;text-shadow:3px 3px 0 #000;margin-top:4px}
.logo small{display:block;font-size:12px;font-weight:800;letter-spacing:.3em;text-transform:uppercase;color:#9ae8ff;margin-bottom:8px;text-shadow:0 2px 6px #000}
.logo i{display:block;height:5px;margin-top:12px;width:70%;background:linear-gradient(90deg,var(--gold),#ff4a3a,transparent)}
.fine{font-size:12px;color:var(--dim);max-width:520px}
#loading{position:fixed;inset:0;background:radial-gradient(circle at 50% 40%,#16203a,#04060c);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:10;gap:10px}
#loading .ln{font-family:var(--comic);font-size:40px;letter-spacing:.06em;color:var(--gold);text-shadow:4px 4px 0 #000}#loading .ls{font-size:12px;letter-spacing:.2em;color:var(--dim);text-transform:uppercase}#loading .tip2{margin-top:30px;font-size:14px;color:#fff;max-width:540px;text-align:center}
#loading .ring{width:64px;height:64px;border-radius:50%;border:4px solid rgba(255,210,74,.2);border-top-color:var(--gold);animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
#touch{display:none}body.touchmode #touch{display:block}
#touch .stick{position:fixed;width:110px;height:110px;border-radius:50%;border:2px solid rgba(255,255,255,.3);transform:translate(-50%,-50%);display:none;pointer-events:none}#touch .stick.show{display:block}
#touch .knob{position:absolute;left:35px;top:35px;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.4)}
#touch .tb{position:absolute;width:56px;height:56px;border-radius:50%;background:rgba(10,14,26,.6);border:2px solid rgba(255,210,74,.6);color:#fff;font-size:11px;font-weight:900;display:flex;align-items:center;justify-content:center;touch-action:none;box-sizing:border-box}
#touch .tb.on{background:rgba(255,210,74,.55)}
#touch .pad{position:fixed;right:env(safe-area-inset-right,0px);bottom:env(safe-area-inset-bottom,0px);width:270px;height:340px;transform-origin:100% 100%;transform:scale(var(--ts,1))}
#touch .tl{position:fixed;left:max(14px,env(safe-area-inset-left,0px));top:max(84px,calc(env(safe-area-inset-top,0px) + 76px));display:flex;gap:10px}
#touch .tl .tb,#touch .tr .tb{position:static;width:48px;height:48px}
#touch .tr{position:fixed;right:max(14px,env(safe-area-inset-right,0px));top:max(14px,env(safe-area-inset-top,0px));display:flex;gap:10px}
@media (max-height:520px){#touch{--ts:.82}}
@media (max-height:420px){#touch{--ts:.72}}
@media (max-width:500px){#touch{--ts:.78}}
body.touchmode #slots{transform:translateX(-50%) scale(.72);transform-origin:50% 100%;bottom:max(8px,env(safe-area-inset-bottom,0px))}
@media (max-width:600px){body.touchmode #slots{bottom:auto;top:max(118px,calc(env(safe-area-inset-top,0px) + 110px));transform-origin:50% 0}body.touchmode #hudhero{transform:scale(.78);transform-origin:0 100%}}
body.touchmode #hudhero .bar.hp{width:200px}body.touchmode #hudhero .bar.en{width:160px}body.touchmode #hudhero .xpb{width:140px}body.touchmode #wallet{bottom:auto;right:auto;left:max(14px,env(safe-area-inset-left,0px));top:max(142px,calc(env(safe-area-inset-top,0px) + 134px));align-items:flex-start;font-size:12px}
#netpill{position:fixed;left:max(10px,env(safe-area-inset-left,0px));top:max(8px,env(safe-area-inset-top,0px));z-index:9;display:flex;align-items:center;gap:6px;padding:3px 9px 3px 7px;border-radius:999px;background:rgba(5,8,16,.62);border:1px solid rgba(255,255,255,.14);font-size:11px;font-weight:800;color:#fff;pointer-events:none;letter-spacing:.02em}
#netpill i{width:8px;height:8px;border-radius:50%;background:var(--nc,#8affb0);box-shadow:0 0 6px var(--nc,#8affb0)}#netpill:not(.full) b{opacity:.8}
#fsbtn{position:fixed;right:max(10px,env(safe-area-inset-right,0px));top:max(8px,env(safe-area-inset-top,0px));z-index:9;width:34px;height:34px;border-radius:9px;border:1px solid rgba(255,255,255,.25);background:rgba(5,8,16,.62);color:#fff;font-size:17px;line-height:1;display:flex;align-items:center;justify-content:center;padding:0}
#fsbtn:hover,#fsbtn:focus-visible{border-color:var(--gold);outline:none}body.touchmode #fsbtn{right:auto;left:max(10px,env(safe-area-inset-left,0px));top:max(36px,calc(env(safe-area-inset-top,0px) + 30px))}
#fps{top:46px!important}

</style>
</head>
<body>
<canvas id="c" tabindex="0"></canvas>
<canvas id="ov"></canvas>
<div id="hud" class="off">
  <div id="topc"><div id="zone"></div><div id="obj"></div></div>
  <div id="bossbar" hidden><div class="bn"></div><div class="bt"></div><div class="bar"><i class="ghost"></i><i class="fill"></i></div><div class="brkb"><i class="brk"></i></div><div class="ph"></div></div>
  <div id="hudhero"><div class="badge"><span></span><b></b></div><div class="bars"><div class="nm"></div><div class="bar hp"><i class="ghost"></i><i class="fill"></i><span class="txt"></span></div><div class="bar en"><i class="fill"></i></div><div class="xpb"><i class="fill"></i></div></div></div>

const sp = World.spots.sunspire; Cam.cine = { t: 0, target: [sp.x - 30, 140, sp.z + 20], orbit: 0.05, a0: 2.2, r: 230, h: 60, pos: [0, 0, 0], fov: 55 };
this.demo = makeBody(HEROES.solaris.look); this.demoT = 0;
Audio2.setMusic({ music: MUSIC.title }, 'title');
$('dialog').hidden = true; UI.dlg = null; UI.dlgQueue = [];
UI.open('title');
},
clearWorld() { G.enemies.length = 0; G.boss = null; G.fx.length = 0; G.timers.length = 0; G.orbs.length = 0; G.decoy = null; G.signal = null; HProj.clear(); EProj.clear(); Hz.clear(); Powers.clear(); Part.clear(); Life.clear(); UI.bossBar(null); G.timeStop = 0; G.fear = 0; R.sat = 1.12; G.cutscene = false; },
newGame(slot, name) { Save.newGame(slot, name); this.start(true); },
start(isNew) {
UI.close(); Cam.cine = null; Env.timeLock = null; this.demo = null;
const d = Save.d; d.heroes.solaris.unlocked = true; if (!d.heroes[d.cur] || !d.heroes[d.cur].unlocked) d.cur = 'solaris';
this.clearWorld(); if (World.map !== 'metro') World.load('metro');
const h = G.hero; h.setHero(d.cur); h.init();
const sp = World.spots.spawn; let p = [sp.x, World.groundAt(sp.x, sp.z, 5), sp.z];
if (!isNew && d.pos && d.map === 'metro') p = d.pos.slice();
h.spawn(p[0], p[1] + 0.2, p[2], PI); h.hp = h.s.maxHp; h.en = h.s.maxEn;
Env.tod = isNew ? 0.33 : Env.tod;
this.state = 'play'; UI.showHud(true); UI.setZone('Solace City', ''); UI.refreshObjective();
Audio2.setMusic({ music: MUSIC.solace }, 'explore');
if (Input.lastDevice !== 'touch') Input.wantLock = true;
if (isNew) G.later(0.6, () => { UI.toast(Input.touch.on ? 'Left thumb moves (push all the way to go fast) · drag the right side to look · tap JUMP, then JUMP again in the air to FLY · HIT punches · II is the menu' : 'WASD move · mouse look (click the game first) · Space jump, then Space again to FLY · Shift boost · click to punch · Esc menu', '#ffd24a'); Missions.beginStory(); });
else G.later(0.5, () => UI.toast('Welcome back, ' + d.name + '!', '#ffd24a'));
Save.save();
},
swapHero(dir) {
const d = Save.d, list = HERO_ORDER.filter(id => d.heroes[id].unlocked); if (list.length < 2) { UI.toast('More heroes join the league as the story goes on.', '#9ab'); return; }
const i = list.indexOf(G.hero.id); this.swapTo(list[(i + dir + list.length) % list.length]);
},
swapTo(id, quiet) {
const h = G.hero, keepMode = h.mode;
if (h.lift) h.dropLift(); Powers.clear(); h.beam = null;
h.setHero(id, true); h.init();
if (keepMode === 'fly' && !h.canFly()) h.mode = 'air'; else h.mode = keepMode === 'wall' || keepMode === 'glide' ? 'air' : keepMode;
if (!quiet) { Audio2.swap(); UI.banner(h.H.name.toUpperCase(), h.H.title); for (let i = 0; i < 40; i++) Part.emit(h.pos[0], h.pos[1] + 1, h.pos[2], { speed: 6, life: 0.6, size: 0.4, size1: 0, col: hexLin(h.H.color).map(v => v * 3), add: 1 }); }
Save.d.cur = id;
},
reward(xp, cr, pos, big) {
const d = Save.d; if (!d) return;
d.xp += xp; d.credits += cr;
let ups = 0; while (d.level < LV_CAP && d.xp >= xpNeed(d.level)) { d.xp -= xpNeed(d.level); d.level++; d.sp++; ups++; }
if (d.level >= LV_CAP) d.xp = 0;
if (ups) { const h = G.hero; h.calc(); h.hp = h.s.maxHp; h.en = h.s.maxEn; UI.banner('LEAGUE LEVEL ' + d.level, '+' + ups + ' skill point' + (ups > 1 ? 's' : '') + ' · press L to spend'); Audio2.levelup(); FX_shock(h.pos, 6, [2.4, 2, 0.8, 0.8]); }
if (big) UI.toast('+' + fmt(Math.floor(xp)) + ' XP · +₵' + fmt(Math.floor(cr)), '#ffd24a');
},
dropOrb(p, kind) { G.orbs.push({ p: [p[0], p[1] + 1, p[2]], kind, t: 0 }); },
updateOrbs(dt) {
const h = G.hero;
for (let i = G.orbs.length - 1; i >= 0; i--) {
const o = G.orbs[i]; o.t += dt; const d = dist3(o.p, h.chest());
if (d < 6) { for (let k = 0; k < 3; k++) o.p[k] += (h.chest()[k] - o.p[k]) * Math.min(1, dt * 6); }
if (d < 1.4) { if (o.kind === 'hp') h.heal(h.s.maxHp * 0.15); else h.en = Math.min(h.s.maxEn, h.en + h.s.maxEn * 0.35); Audio2.pickup(); G.orbs.splice(i, 1); continue; }
if (o.t > 20) G.orbs.splice(i, 1);
}
},
drawOrbs() { for (const o of G.orbs) { R.add(EM.orb, T(o.p[0], o.p[1] + Math.sin(R.time * 3 + o.t) * 0.15, o.p[2], 0, 0, 0, 0.25), o.kind === 'hp' ? [0.4, 1.6, 0.6, 1] : [0.4, 1.0, 1.8, 1]); } },
tokens(dt) {
if (World.map !== 'metro') return; const h = G.hero, T0 = World.cur.tokens;
for (let i = 0; i < T0.length; i++) {
const t = T0[i]; if (Math.abs(t[0] - h.pos[0]) > 160 || Math.abs(t[2] - h.pos[2]) > 160) continue; if (Save.hasToken(i)) continue;
R.add(CM.token, T(t[0], t[1] + Math.sin(R.time * 2 + i) * 0.2, t[2], R.time * 2 + i), [1, 1, 1, 0]);
if (dist3(t, h.chest()) < 2.4) { Save.setToken(i); Save.d.stats.tokens++; const n = Save.tokenCount(); Audio2.tokenGet(); UI.ono(t, 'TOKEN!', '#3aff6a'); Game.reward(killXp(Save.d.level) * 6, credOf(Save.d.level) * 20, t); UI.toast('Cipher token ' + n + ' / 150' + (n % 10 === 0 ? ' · Bonus: +2 skill points!' : ''), '#3aff6a'); if (n % 10 === 0) Save.d.sp += 2; }
}
},
kioskPos() { const p = World.spots.bastionplaza; return KIOSKS.map((k, i) => [p.x - 16 + i * 8, 0.22, p.z - 20]); },
interact(h) {
if (Missions.things.some(t => (t.kind === 'civ' && !t.saved || t.kind === 'bomb' && !t.off || t.kind === 'clue' && !t.found) && dist3(t.p, h.pos) < 4)) return;
if (World.map === 'metro') { const ks = this.kioskPos(); for (let i = 0; i < ks.length; i++) if (dist3(ks[i], h.pos) < 3) { const k = KIOSKS[i][0]; if (k === 'rift' && !Save.d.rift.open) { UI.toast('The Rift Gate is still sealed. Finish arc 3 to open it.', '#c87aff'); return; } UI.open(k); return; } }
if (h.lift) { h.dropLift(); return; }
if (!h.tryLift() && !h.H.move.strong) { const c = G.cars.find(c => !c.dead && dist3(c.pos, h.pos) < 4); if (c) UI.toast(h.H.name + ' is not strong enough to lift cars. Solaris, Valora, Cyrex and Tidecaller are!', '#9ab'); }
},
cheerLine() { return CHEERS[Math.floor(Math.random() * CHEERS.length)].replace('{h}', G.hero.H.name); },
respawn() {
const h = G.hero, cp = Missions.checkpoint(), sp = World.spots.spawn;
let p = cp ? World.openSpot(cp[0], cp[2], 14, Math.random, 6) : [sp.x, World.groundAt(sp.x, sp.z, 5), sp.z];
if (cp && cp[1] > 20) p = [cp[0] + 4, cp[1] + 0.5, cp[2] + 4];
h.pos = [p[0], p[1] + 0.3, p[2]]; h.vel = [0, 0, 0]; h.mode = 'air'; Hz.clear(); EProj.clear();
for (const e of G.enemies) { e.tele = 0; if (e.state === 'tele' || e.state === 'attack') e.state = 'recover'; }
UI.toast('Back on your feet!', '#8affb0');
},
safeSpot() { const s = World.spots.arena || World.spots.spawn; return [s.x, (s.y || 0) + 2, s.z]; },
travelTo(map, spot, cb) {
this.busy = true; this.state = 'loading'; R.fade = 1;
this.showLoading(map === 'morrow' ? 'Morrowgrim' : map === 'rift' ? 'The Rift' : 'Solace Bay', map === 'morrow' ? 'The fire world of Emperor Vorhal' : map === 'rift' ? 'A thousand broken Earths' : 'Solace City & Grimhaven');
setTimeout(() => {
this.clearWorldKeepMission(); World.load(map, { tier: this.riftTier });
const s = World.spots[spot] || World.spots.spawn, h = G.hero;
h.spawn(s.x, (s.y || World.groundAt(s.x, s.z, 9999)) + 0.5, s.z, map === 'morrow' ? PI : 0); h.mode = 'air';
Audio2.setMusic({ music: MUSIC[map === 'metro' ? 'solace' : map] }, 'explore');
this.hideLoading(); this.state = 'play'; this.busy = false; R.fade = 0; UI.refreshObjective();
if (cb) cb();
}, 60);
},
clearWorldKeepMission() { G.enemies.length = 0; G.boss = null; G.fx.length = 0; G.orbs.length = 0; HProj.clear(); EProj.clear(); Hz.clear(); Powers.clear(); Part.clear(); Life.clear(); UI.bossBar(null); G.timeStop = 0; G.fear = 0; R.sat = 1.12; },
fastTravel(name) {
if (Missions.cur && Missions.cur.kind !== 'event') { UI.toast('Finish or stop your mission first (pause menu).', '#ff9a6a'); return; }
const s = World.spots[name]; if (!s) return; const h = G.hero;
Life.clear(); const y = s.y || World.groundAt(s.x, s.z, 3);
h.spawn(s.x, y + 0.5, s.z, h.yaw); h.mode = 'air'; Audio2.swap(); UI.banner(SPOT_NAMES[name] ? SPOT_NAMES[name].replace(/^the /, '').toUpperCase() : name.toUpperCase(), 'Fast travel');
},
fastTravelStory() { const ns = Missions.nextStory(), loc = ns && Missions.storyStart(ns); if (!loc) { Missions.beginStory(); return; } const p = Missions.resolve(loc), h = G.hero; Life.clear(); const q = World.openSpot(p[0], p[2], 30, Math.random, 12); h.spawn(q[0], q[1] + 0.5, q[2], h.yaw); Missions.beginStory(); },
enterRift(tier) {
const d = Save.d; tier = clamp(tier, 1, 99999);
if (Missions.cur && Missions.cur.kind === 'story') Missions.quit();
Missions.clearAll(); this.riftTier = tier;
const mod = riftMod(tier), th = riftTheme(tier); G.riftMod = mod.id; G.riftMods = { [mod.id]: true };
this.travelTo('rift', 'spawn', () => {
const lv = riftLevel(tier), waves = Math.min(5, 2 + Math.floor(tier / 60));
const steps = [['fight', 'arena', waves, 'rift']];
if (tier % 10 === 0 || tier >= 1000) { let id; if (tier >= 1000) id = 'hollow'; else if (tier % 100 === 0) id = ARCS[(tier / 100 - 1) % 10].villain; else { const ids = Object.keys(BOSSES).filter(k => k !== 'hollow'); id = ids[hash32(tier, 5) % ids.length]; } steps.push(['boss', id, 'arena']); }
Missions.start({ kind: 'rift', title: th.name + ' · Earth ' + tier, tier, steps, lv, fac: 'rift', theme: th });
if (mod.id !== 'none') UI.toast('Twist: ' + mod.name, '#c87aff');
Audio2.setMusic({ music: MUSIC.rift }, 'explore');
});
},
ending() {
const d = Save.d; d.ending = true; d.rift.open = true; Save.save(); Env.flash = 1; Audio2.mission(); Audio2.cheer();
G.later(1.5, () => { this.travelTo('metro', 'spawn', () => { UI.open('credits'); }); });
},
trueEnding() { const d = Save.d; UI.say([['narr', 'The Hollow Sun cracks open. Inside there is no monster: only a small, cold star, crying.'], ['solaris', 'You were a sun like mine once. You can be again.'], ['narr', 'Solaris gives it a little of his light. The star begins to glow... and a thousand broken Earths drift home.']], () => { d.trueEnding = true; Save.save(); UI.open('credits'); }); },
loop(now) {
requestAnimationFrame(t => this.loop(t));
const dt = Math.min(0.05, Math.max(0.001, (now - (this.last || now)) / 1000)); this.last = now;
if (this.manual) return;
try { this.frame(dt); } catch (e) { console.error(e); if (!this.errShown) { this.errShown = true; UI.toast('Oops, something went wrong: ' + e.message, '#ff6a6a'); } }
const p = this.perf; p.t += dt; p.n++;
if (p.t > 3) { const avg = p.t / p.n; if (Save.settings.quality === 'auto' && this.state === 'play') { const order = ['low', 'medium', 'high', 'ultra']; let i = order.indexOf(R.qName); if (avg > 0.026 && i > 0) { R.setQuality(order[i - 1]); } else if (avg < 0.0125 && i < 2 && p.good++ > 3) { R.setQuality(order[i + 1]); p.good = 0; } } $('fps').textContent = Math.round(p.n / p.t) + ' fps · ' + R.qName + ' · ' + R.stats.draws + ' draws'; p.t = 0; p.n = 0; p.good = p.good || 0; }
},
frame(dt) {
G.frameNo++;
Input.poll(dt);
const h = G.hero;
if (this.state === 'title' || this.state === 'loading') {
Env.update(dt, Cam.cine ? Cam.cine.target : h.pos); Cam.update(dt, h); R.views[0].focus = Cam.cine ? Cam.cine.target : h.pos;
R.beginFrame();
if (this.demo && this.state === 'title') { const sp = World.spots.sunspire, p = [sp.x - 30, 140 + Math.sin(R.time) * 1.5, sp.z + 20]; animBody(this.demo, { dt, fly: 1, flyFast: 0, speedAbs: 2 }); this.demo.update(M4.compose(M4.create(), p[0], p[1], p[2], R.time * 0.05 + 2.5, 0, 0, 1, 1, 1)); this.demo.draw(); Cam.cine.target = [p[0], p[1] + 1.4, p[2]]; Cam.cine.r = 9; Cam.cine.h = 1.5; Cam.cine.orbit = 0.12; }
Env.draw(dt, R.cam); Part.update(dt); R.render(dt);
UI.menuUpdate(); UI.overlay(dt); Input.endFrame(); return;
}
if (this.state !== 'play') { Input.endFrame(); return; }
const d = Save.d;
if (!UI.menu && !UI.dlg) {
if (Input.hit('pause')) { UI.open('pause'); Input.endFrame(); return; }
if (Input.hit('map')) { UI.open('map'); Input.endFrame(); return; }
if (Input.hit('league')) { UI.open('league'); Input.endFrame(); return; }
if (Input.hits.KeyJ && d.rift.open && World.map === 'metro') { UI.open('rift'); Input.endFrame(); return; }
}
const paused = !!UI.menu;
let dw = paused ? 0 : dt;
if (G.hitstop > 0) { G.hitstop -= dt; dw *= 0.05; }
if (G.slowT > 0) { G.slowT -= dt; dw *= G.slowScale; }
G.dt = dw;
if (!paused) {
d.playTime += dt; G.time += dw;
G.tickTimers(dw);
if (UI.dlg) UI.dlgUpdate(dt);
h.update(dw);
Enemies.update(dw);
if (G.boss) G.boss.update(dw);
Life.update(dw, h);
HProj.update(dw); EProj.update(dw); Hz.update(dw);
Missions.update(dw, h);
this.updateOrbs(dw);
if (G.timeStop > 0) { G.timeStop -= dw; if (G.timeStop <= 0) R.sat = 1.12; }
if (G.fear > 0) { G.fear -= dw; R.exposure = G.fear > 0 ? 0.55 : 1; } else R.exposure = 1;
R.hurt = Math.max(0, R.hurt - dt * 1.5);
Audio2.setIntensity(G.inCombat ? 0.8 : 0.1); Audio2.setWind(h.mode === 'fly' || h.mode === 'glide' || h.fast ? clamp((h.speed3 - 12) / 60, 0, 1) : 0);
if (G.frameNo % 90 === 0 && !(G.boss && G.boss.engaged && G.boss.alive)) { const r = World.region(h.pos[0], h.pos[2]); const mu = MUSIC[r] || MUSIC.solace; if (Audio2.mus.biome !== this._mb || this._mr !== r) { this._mr = r; Audio2.setMusic({ music: mu }, null); this._mb = Audio2.mus.biome; } }
this.autosaveT += dt; if (this.autosaveT > 45) { this.autosaveT = 0; if (World.map === 'metro') { d.pos = h.pos.slice(); d.map = 'metro'; } Save.save(); }
} else UI.menuUpdate();
Cam.update(dt, h);
R.views[0].focus = h.pos;
Env.update(paused ? 0 : dw, h.pos);
R.beginFrame();
h.draw(); Enemies.draw(); if (G.boss) G.boss.draw(); Life.draw();
HProj.draw(); EProj.draw(); Hz.draw(); drawFx(dw); Powers.draw(); Missions.draw(dw); this.drawOrbs(); this.tokens(dw); this.drawKiosks(h);
Env.draw(dw, R.cam); Part.update(dw); R.render(dw);
UI.hud(dt); UI.overlay(dw);
Input.endFrame();
},
drawKiosks(h) {
if (World.map !== 'metro') return; const ks = this.kioskPos();
if (dist3(ks[2], h.pos) > 120) return;
ks.forEach((p, i) => { R.add(CM.kiosk, T(p[0], p[1], p[2], PI), [1, 1, 1, 0]); const k = KIOSKS[i]; if (k[0] === 'rift') { R.add(CM.torus, T(p[0], p[1] + 4.2, p[2], R.time, PI / 2, 0, 1.6, 1.6, 1.6), Save.d.rift.open ? [0.8, 0.4, 1.4, 3] : [0.3, 0.3, 0.3, 0]); } if (dist3(p, h.pos) < 3) UI.prompt(k[1], 'interact'); });
},
};
if (document.readyState === 'complete') Game.boot(); else window.addEventListener('load', () => Game.boot());
