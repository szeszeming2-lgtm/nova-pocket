<style>
:root{color-scheme:dark;--gold:#f2c86b;--gold2:#ffe9b0;--ink:#f4f1ea;--dim:#a9b0c2;--panel:rgba(14,18,34,.86);--panel2:rgba(28,34,60,.92);--line:rgba(242,200,107,.35);--red:#ff5f6d;--sta:#ffd54a;--xp:#8fd3ff;
--serif:"Palatino Linotype","Book Antiqua",Palatino,Georgia,"Times New Roman",serif;--sans:"Avenir Next","Segoe UI","Helvetica Neue",system-ui,-apple-system,Roboto,Arial,sans-serif;}
html,body{margin:0;height:100%;overflow:hidden;background:#05060c;color:var(--ink);font-family:var(--sans);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;overscroll-behavior:none}
body{position:fixed;inset:0;touch-action:none}
input,select,.panel{touch-action:manipulation}
.panel{-webkit-overflow-scrolling:touch;touch-action:pan-y}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;outline:none}
[hidden]{display:none!important}
button{font-family:var(--sans);cursor:pointer}
.layer{position:fixed;inset:0;pointer-events:none}
/* ---- HUD ---- */
#hud{position:fixed;inset:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px);pointer-events:none;transition:opacity .4s}
#hud.off{opacity:0}
.vitals{position:absolute;left:22px;top:20px;display:flex;gap:12px;align-items:flex-start}
.lvl{width:56px;height:56px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#3a4a7a,#141a30);border:2px solid var(--gold);display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 0 18px rgba(242,200,107,.25),inset 0 0 10px rgba(0,0,0,.6)}
.lvl b{font-family:var(--serif);font-size:22px;line-height:1;color:var(--gold2)}
.lvl small{font-size:9px;letter-spacing:.12em;color:var(--dim);margin-top:1px}
.bars{display:flex;flex-direction:column;gap:6px;margin-top:4px}
.bar{position:relative;height:14px;width:280px;background:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.18);border-radius:8px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.4)}
.bar .ghost,.bar .fill{position:absolute;left:0;top:0;bottom:0;border-radius:8px;transition:width .08s}
.bar .ghost{background:rgba(255,255,255,.55);transition:width .6s .25s}
.bar.hp .fill{background:linear-gradient(180deg,#ff8a8a,#e83a4f 55%,#a8203a)}
.bar.sta{height:8px;width:220px}.bar.sta .fill{background:linear-gradient(180deg,#ffe98a,#e8b02a)}
.bar.xp{height:5px;width:280px;border-radius:3px}.bar.xp .fill{background:linear-gradient(90deg,#5fb8ff,#b8f0ff)}
.bar .txt{position:absolute;inset:0;font-size:10px;line-height:14px;text-align:center;font-weight:700;letter-spacing:.04em;text-shadow:0 1px 2px #000}
.bar.flash{animation:barflash .4s}@keyframes barflash{50%{box-shadow:0 0 0 2px #ff5f6d}}
.compass{position:absolute;left:50%;top:14px;transform:translateX(-50%);width:min(520px,36vw);height:30px;overflow:hidden;
 -webkit-mask-image:linear-gradient(90deg,transparent,#000 15%,#000 85%,transparent);mask-image:linear-gradient(90deg,transparent,#000 15%,#000 85%,transparent)}
.compass .strip{position:absolute;inset:0}
.compass .tick{position:absolute;top:8px;transform:translateX(-50%);font-size:12px;font-weight:700;color:var(--ink);text-shadow:0 1px 3px #000;letter-spacing:.1em}
.compass .tick.minor{font-size:9px;color:var(--dim);top:10px}
.compass .mk{position:absolute;top:4px;transform:translateX(-50%);font-size:15px;filter:drop-shadow(0 0 4px rgba(0,0,0,.8))}
.compass::after{content:"";position:absolute;left:50%;top:0;bottom:0;width:2px;background:var(--gold);transform:translateX(-50%);opacity:.6}
.isleInfo{position:absolute;right:22px;top:18px;text-align:right;max-width:340px}
.isleInfo .nm{font-family:var(--serif);font-size:20px;color:var(--gold2);text-shadow:0 2px 6px #000}
.isleInfo .sub{font-size:11px;color:var(--dim);letter-spacing:.14em;text-transform:uppercase;margin-top:2px;text-shadow:0 1px 3px #000}
.obj{margin-top:12px;display:flex;flex-direction:column;gap:5px;align-items:flex-end}
.obj div{font-size:13px;background:linear-gradient(90deg,transparent,rgba(10,14,30,.7));padding:4px 10px 4px 26px;border-right:2px solid var(--gold);text-shadow:0 1px 2px #000}
.obj div.done{opacity:.55;text-decoration:line-through;border-color:#6a6}
.obj div.trial{border-color:#8fd3ff;color:#d8f2ff}
.abil{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);display:flex;gap:10px;align-items:flex-end}
.slot{position:relative;width:54px;height:54px;border-radius:12px;background:radial-gradient(circle at 40% 30%,rgba(60,72,120,.9),rgba(14,18,34,.92));border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:24px;box-shadow:0 4px 14px rgba(0,0,0,.5);overflow:hidden}
.slot .k{position:absolute;left:4px;top:2px;font-size:10px;color:var(--dim);font-weight:700}
.slot .cd{position:absolute;inset:0;background:conic-gradient(rgba(0,0,0,.72) var(--p,0%),transparent 0);}
.slot .n{position:absolute;right:5px;bottom:2px;font-size:12px;font-weight:800;color:#fff;text-shadow:0 1px 2px #000}
.slot.empty{opacity:.35}.slot.ready{animation:ready .5s}@keyframes ready{50%{box-shadow:0 0 18px var(--gold)}}
.slot.pot{border-color:rgba(124,255,154,.5)}
.wallet{position:absolute;right:22px;bottom:22px;display:flex;flex-direction:column;align-items:flex-end;gap:4px;font-size:14px;font-weight:700;text-shadow:0 1px 3px #000}
.wallet span{display:flex;align-items:center;gap:6px}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;box-shadow:0 0 8px currentColor}
.prompt{position:absolute;left:50%;bottom:110px;transform:translateX(-50%);background:var(--panel);border:1px solid var(--line);padding:8px 16px;border-radius:24px;font-size:15px;display:flex;gap:10px;align-items:center;box-shadow:0 6px 20px rgba(0,0,0,.4)}
.key{display:inline-flex;align-items:center;justify-content:center;min-width:24px;height:24px;padding:0 6px;border-radius:6px;background:#f2e6c8;color:#1a1420;font-weight:800;font-size:13px;box-shadow:0 2px 0 #a08a5a}
.bossbar{position:absolute;left:50%;bottom:96px;transform:translateX(-50%);width:min(640px,70vw);text-align:center}
.bossbar .bn{font-family:var(--serif);font-size:19px;color:#ffd9d0;text-shadow:0 2px 6px #000;margin-bottom:5px;letter-spacing:.04em}
.bossbar .bar{width:100%;height:16px}.bossbar .bar .fill{background:linear-gradient(180deg,#ff9a6a,#d83a2a 60%,#8a1a1a)}
.bossbar .ph{font-size:11px;color:var(--dim);margin-top:4px;letter-spacing:.1em}
#ehp{position:fixed;inset:0;pointer-events:none}
.ehp{position:absolute;width:76px;transform:translate(-50%,-100%);text-align:center}
.ehp .nm{font-size:10px;font-weight:700;text-shadow:0 1px 2px #000;white-space:nowrap;margin-bottom:2px}
.ehp .b{height:5px;background:rgba(0,0,0,.6);border-radius:3px;overflow:hidden;border:1px solid rgba(255,255,255,.2)}.ehp .b i{display:block;height:100%;background:linear-gradient(#ff7a7a,#c82a3a)}
.ehp.elite .nm{color:#e8a8ff}.ehp.elite .b i{background:linear-gradient(#e8a8ff,#9a3ad8)}
#dnums{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.dnum{position:absolute;left:0;top:0;font-weight:900;font-size:20px;text-shadow:0 2px 0 rgba(0,0,0,.6),0 0 6px rgba(0,0,0,.5);white-space:nowrap;will-change:transform}
#toasts{position:fixed;left:22px;top:110px;display:flex;flex-direction:column;gap:6px;pointer-events:none;max-width:360px}
.toast{background:var(--panel);border-left:3px solid var(--gold);padding:7px 12px;border-radius:6px;font-size:13px;box-shadow:0 4px 14px rgba(0,0,0,.4);animation:tin .25s ease-out}
.toast.item{display:flex;gap:10px;align-items:center}
@keyframes tin{from{transform:translateX(-20px);opacity:0}}
#gains{position:fixed;right:22px;bottom:84px;display:flex;flex-direction:column;align-items:flex-end;gap:3px;pointer-events:none}
.gain{font-size:13px;font-weight:800;text-shadow:0 1px 3px #000;animation:gain 1.6s forwards}@keyframes gain{0%{opacity:0;transform:translateY(6px)}15%{opacity:1;transform:none}75%{opacity:1}100%{opacity:0}}
#banner{position:fixed;left:0;right:0;top:30%;text-align:center;pointer-events:none}
#banner .t{font-family:var(--serif);font-size:clamp(28px,5vw,54px);color:var(--gold2);text-shadow:0 0 24px rgba(242,200,107,.6),0 3px 8px #000;letter-spacing:.04em;animation:ban 2.6s forwards}
#banner .s{font-size:15px;color:var(--ink);letter-spacing:.2em;text-transform:uppercase;margin-top:8px;text-shadow:0 2px 6px #000;animation:ban 2.6s forwards}
@keyframes ban{0%{opacity:0;transform:scale(.9)}12%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0}}
#dialog{position:fixed;left:50%;bottom:150px;transform:translateX(-50%);width:min(680px,88vw);background:linear-gradient(180deg,rgba(20,26,50,.94),rgba(10,14,30,.94));border:1px solid var(--line);border-radius:14px;padding:16px 20px 14px;box-shadow:0 10px 40px rgba(0,0,0,.6);pointer-events:auto}
#dialog .who{font-family:var(--serif);color:var(--gold);font-size:17px;margin-bottom:6px;display:flex;align-items:center;gap:8px}
#dialog .who i{width:12px;height:12px;border-radius:50%;background:#ffe9a0;box-shadow:0 0 12px #ffd86a}
#dialog .txt{font-size:16px;line-height:1.5;min-height:48px}
#dialog .more{text-align:right;font-size:11px;color:var(--dim);margin-top:6px;letter-spacing:.1em}
.online{position:absolute;left:22px;top:86px;pointer-events:auto;cursor:pointer;background:var(--panel);border:1px solid rgba(143,211,255,.45);border-radius:16px;padding:4px 11px;font-size:12px;font-weight:700;color:#d8f2ff}
.online:hover{border-color:#8fd3ff}
#ptags{position:fixed;inset:0;pointer-events:none}
.ptag{position:absolute;transform:translate(-50%,-100%);text-align:center;white-space:nowrap}
.ptag .pn{font-size:12px;font-weight:800;text-shadow:0 1px 3px #000,0 0 6px rgba(0,0,0,.6)}
.ptag .pb{width:62px;height:4px;margin:2px auto 0;background:rgba(0,0,0,.6);border-radius:2px;overflow:hidden}.ptag .pb i{display:block;height:100%;background:#7cff9a}
.ptag .bub{display:inline-block;background:#fff;color:#1a1420;font-weight:800;font-size:13px;padding:5px 10px;border-radius:12px;margin-bottom:5px;box-shadow:0 3px 10px rgba(0,0,0,.4)}
.fr-row{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:10px;padding:8px 10px}
.fr-dot{width:12px;height:12px;border-radius:50%;flex:none}
.mi.fr{outline:2px solid #8fd3ff;outline-offset:1px}
input[type=text]{background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.2);border-radius:8px;color:var(--ink);padding:8px 10px;font-size:14px;font-family:var(--sans);width:180px}
#fps{position:fixed;left:6px;bottom:4px;font:11px monospace;color:#9f9;pointer-events:none;text-shadow:0 1px 2px #000}
#cross{position:fixed;left:50%;top:50%;width:4px;height:4px;margin:-2px;border-radius:50%;background:rgba(255,255,255,.55);pointer-events:none}
/* ---- menus ---- */
#menu{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at center,rgba(5,8,20,.35),rgba(5,8,20,.75));pointer-events:auto;z-index:5}
#menu.clear{background:none}
.panel{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:18px;box-shadow:0 20px 60px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.06);padding:22px 26px;max-width:min(1040px,94vw);max-height:90vh;overflow:auto;position:relative}
.panel h1,.panel h2{font-family:var(--serif);font-weight:normal;color:var(--gold2);margin:0 0 12px;letter-spacing:.03em}
.panel h1{font-size:30px}.panel h2{font-size:22px}
.panel h3{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);margin:14px 0 8px;font-weight:700}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:linear-gradient(180deg,#f6dc9a,#d9a845);color:#24180a;border:none;border-radius:10px;padding:10px 18px;font-weight:800;font-size:14px;box-shadow:0 3px 0 #8a6420,0 6px 14px rgba(0,0,0,.35);transition:transform .08s,filter .15s;letter-spacing:.02em}
.btn:hover{filter:brightness(1.08);transform:translateY(-1px)}.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #8a6420}
.btn.sec{background:linear-gradient(180deg,#3a4672,#232b4a);color:var(--ink);box-shadow:0 3px 0 #151a30,0 6px 14px rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.1)}
.btn.red{background:linear-gradient(180deg,#ff8a8a,#c83a4a);color:#fff;box-shadow:0 3px 0 #7a1a2a}
.btn:disabled{filter:grayscale(1) brightness(.6);cursor:not-allowed;transform:none}
.btn.sm{padding:6px 11px;font-size:12px;border-radius:8px}
.col{display:flex;flex-direction:column;gap:10px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.x{position:absolute;right:14px;top:12px;background:none;border:none;color:var(--dim);font-size:22px;line-height:1}
.x:hover{color:#fff}
.tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}.tab{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);color:var(--dim);padding:7px 14px;border-radius:20px;font-weight:700;font-size:13px}
.tab.on{background:var(--gold);color:#24180a;border-color:var(--gold)}
#title{position:fixed;left:0;right:0;top:9vh;pointer-events:none;display:flex;flex-direction:column;align-items:center}
.logo{font-family:var(--serif);font-size:clamp(48px,9vw,104px);color:#fff4d6;letter-spacing:.08em;text-shadow:0 0 40px rgba(255,214,120,.55),0 4px 12px rgba(0,0,0,.6);line-height:1}
.logo2{font-size:clamp(13px,1.6vw,18px);letter-spacing:.5em;color:var(--gold);text-transform:uppercase;margin-top:10px;text-shadow:0 2px 8px #000}
.titlemenu{position:absolute;left:50%;bottom:6vh;transform:translateX(-50%);width:min(860px,94vw)}
.slots{display:grid;grid-template-columns:repeat(3,minmax(200px,1fr));gap:14px;margin-top:6px}
.scard{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:8px;min-height:150px}
.scard .big{font-family:var(--serif);font-size:20px;color:var(--gold2)}.scard .meta{font-size:12px;color:var(--dim);line-height:1.6}
.grid{display:grid;gap:6px}
.cell{position:relative;width:52px;height:52px;border-radius:9px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);display:flex;align-items:center;justify-content:center;font-size:22px;cursor:pointer}
.cell:hover{border-color:var(--gold)}.cell.sel{outline:2px solid var(--gold)}
.cell .lv{position:absolute;right:3px;bottom:1px;font-size:9px;font-weight:800;color:#fff;text-shadow:0 1px 2px #000}
.cell .up{position:absolute;left:3px;top:1px;font-size:9px;font-weight:800;color:var(--gold)}
.tip{background:rgba(6,8,18,.9);border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:12px 14px;min-width:240px;font-size:13px;line-height:1.55}
.tip .nm{font-family:var(--serif);font-size:17px}.tip .rr{font-size:11px;letter-spacing:.14em;text-transform:uppercase;opacity:.8}
.stat{display:flex;justify-content:space-between;gap:20px;font-size:13px;padding:3px 0;border-bottom:1px dashed rgba(255,255,255,.07)}.stat b{color:var(--gold2)}
.better{color:#7cff9a}.worse{color:#ff8a8a}
.skill{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:10px;padding:8px 10px;display:flex;gap:10px;align-items:center}
.skill .nm{font-weight:800;font-size:13px}.skill .ds{font-size:12px;color:var(--dim)}.skill .rk{margin-left:auto;font-weight:800;color:var(--gold2);font-size:13px;white-space:nowrap}
.skill.lock{opacity:.4}
.mapgrid{display:grid;grid-template-columns:repeat(50,12px);gap:2px}
.mi{width:12px;height:12px;border-radius:2px;background:rgba(255,255,255,.07);cursor:pointer}
.mi.un{background:rgba(143,211,255,.35)}.mi.st{background:var(--gold)}.mi.cur{outline:2px solid #fff}.mi.w{border-radius:50%}.mi.tt{transform:scale(1.25);border-radius:3px;box-shadow:0 0 6px rgba(255,120,80,.8)}
.mi:hover{outline:2px solid #8fd3ff}
.swatch{width:30px;height:30px;border-radius:50%;border:2px solid rgba(255,255,255,.2);cursor:pointer}.swatch.on{border-color:#fff;box-shadow:0 0 10px #fff}
input[type=range]{width:200px;accent-color:#e8b84a}
.lore{font-family:var(--serif);font-size:18px;line-height:1.7;color:#f2ead8;max-width:620px;white-space:pre-wrap}
.loading{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:12vh;pointer-events:none;z-index:6}
.loading .ln{font-family:var(--serif);font-size:34px;color:var(--gold2);text-shadow:0 2px 12px #000}.loading .ls{font-size:13px;letter-spacing:.3em;color:var(--dim);text-transform:uppercase;margin-top:6px}
.loading .tip2{font-size:14px;color:#cfd6e6;margin-top:22px;max-width:560px;text-align:center;line-height:1.5}
.credits{font-family:var(--serif);text-align:center;font-size:22px;line-height:2;color:#f2ead8}
/* touch */
#touch{position:fixed;inset:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px);pointer-events:none;display:none}
#touch .tb{touch-action:none;-webkit-user-select:none;user-select:none}
#touch .tb.sm{width:46px;height:46px;font-size:18px}
#touch .tb.ab{width:52px;height:52px;font-size:22px}
#touch .tb.ab.cd{opacity:.45}
#touch .tb[hidden]{display:none}
#touch .row{position:absolute;left:14px;top:120px;display:flex;gap:8px;pointer-events:none}
#touch .row .tb{position:relative;right:auto;bottom:auto}
body:not(.playing) #touch{display:none!important}
#netbadge{position:fixed;z-index:7;left:calc(12px + env(safe-area-inset-left,0px));bottom:calc(10px + env(safe-area-inset-bottom,0px));background:rgba(10,14,30,.78);border:1px solid rgba(143,211,255,.35);color:#d8f2ff;border-radius:14px;padding:4px 10px;font-size:11px;font-weight:700;cursor:pointer;letter-spacing:.02em}
#netbadge.off{border-color:rgba(255,206,110,.6);color:#ffe2a8}
body.playing #netbadge{left:50%;transform:translateX(-50%);bottom:auto;top:calc(48px + env(safe-area-inset-top,0px));font-size:10px;padding:2px 9px;opacity:.85}
#fsbtn{position:fixed;z-index:7;right:calc(12px + env(safe-area-inset-right,0px));top:calc(12px + env(safe-area-inset-top,0px));width:38px;height:38px;border-radius:10px;border:1px solid rgba(255,255,255,.25);background:rgba(10,14,30,.7);color:#fff;font-size:18px;cursor:pointer}
body.playing #fsbtn{display:none}
@media (max-width:760px){.mgrid{grid-template-columns:1fr!important}.panel{padding:16px 14px}}
.maprows{overflow-x:auto;max-width:100%}

    gl.bindFramebuffer(gl.FRAMEBUFFER, B[0].fb); gl.viewport(0, 0, B[0].w, B[0].h);
    s.tex('uTex', R.sceneRT.tex).set('uTexel', [0.5 / R.w, 0.5 / R.h]).set('uThresh', 1.0);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    s = R.sh.down.use();
    for (let i = 1; i < B.length; i++) {
      gl.bindFramebuffer(gl.FRAMEBUFFER, B[i].fb); gl.viewport(0, 0, B[i].w, B[i].h);
      s.tex('uTex', B[i - 1].tex).set('uTexel', [1 / B[i - 1].w, 1 / B[i - 1].h]);
      gl.drawArrays(gl.TRIANGLES, 0, 3);
    }
    s = R.sh.up.use(); gl.enable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ONE);
    for (let i = B.length - 1; i > 0; i--) {
      gl.bindFramebuffer(gl.FRAMEBUFFER, B[i - 1].fb); gl.viewport(0, 0, B[i - 1].w, B[i - 1].h);
      s.tex('uTex', B[i].tex).set('uTexel', [1 / B[i].w, 1 / B[i].h]).set('uW', 1.0);
      gl.drawArrays(gl.TRIANGLES, 0, 3);
    }
    gl.disable(gl.BLEND);
  }
  // ---- final ----
  gl.bindFramebuffer(gl.FRAMEBUFFER, null); gl.viewport(0, 0, R.w, R.h);
  const fsh = R.sh.final.use();
  fsh.tex('uScene', R.sceneRT.tex).tex('uBloom', useBloom ? B[0].tex : R.sceneRT.tex)
    .set('uBloomStr', useBloom ? e.bloomStr * 0.25 : 0).set('uExposure', e.exposure * R.exposure).set('uHurt', R.hurt).set('uFade', R.fade)
    .set('uSat', R.sat).set('uTint', R.tintPost).set('uTime', R.time % 100);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  gl.enable(gl.DEPTH_TEST);
  // reset per-frame lists
  for (const m of R.dynUsed) m.dyn.n = 0;
  R.dynUsed.length = 0; R.lights.length = 0; FX.n = 0;
};

function reachOf(isle) { return clamp(Math.floor((isle - 1) / ISLES_PER_REACH), 0, REACHES - 1); }
function biomeOf(isle) { if (isle === 0) return HAVEN_BIOME; if (isle > FINAL_ISLE) return BIOMES[(isle - 1) % 1000 / 100 | 0]; return BIOMES[reachOf(isle)]; }
function isleLevel(isle) { if (isle <= 0) return 1; return 1 + Math.floor((isle - 1) * 0.5); }
// exponential power curve shared by enemies and gear
const POW = L => Math.pow(1.025, L);
function isleKind(isle) {
  if (isle === 0) return 'haven';
  if (isle % 100 === 0) return 'titan';
  if (isle % 10 === 0) return 'warden';
  return 'normal';
}

const Models = {
  cache: {},
  get(name, biome, variant = 0) {
    const key = name + '|' + (biome ? biome.id : '-') + '|' + variant;
    if (this.cache[key]) return this.cache[key];
    const fn = PROP[name]; if (!fn) throw new Error('no model ' + name);
    const g = new Geo(); fn(g, biome ? biome.pal : BIOMES[0].pal, mulberry(hash32(variant + 1, name.length * 77 + name.charCodeAt(0))), variant, biome);
    const m = g.mesh(); m.name = name; this.cache[key] = m; return m;
  },
  clearBiome() { /* keep cache; meshes are small */ },
};
const pc = (pal, key, i = 0, glow = 0) => { const v = pal[key]; return C(Array.isArray(v) ? v[i % v.length] : v, glow); };

const PROP = {};
// ---------- trees ----------
PROP.oak = (g, pal, rnd, v) => {
  const h = 3.2 + rnd() * 1.4, lean = (rnd() - 0.5) * 0.15;
  const tr = pc(pal, 'trunk');
  g.cyl(T(0, 0, 0, 0, 0, lean), 0.38, 0.24, h, 7, grad(mulc(tr, 0.6).concat(0), tr, 0, h), { smooth: true });
  // two branches
  for (let i = 0; i < 2; i++) { const a = rnd() * TAU; g.cyl(T(0, h * 0.6, 0, a, 0, 0.9), 0.13, 0.07, 1.6, 5, tr, { smooth: true }); }
  const n = 4 + Math.floor(rnd() * 3);
  for (let i = 0; i < n; i++) {
    const a = rnd() * TAU, r = i === 0 ? 0 : 0.9 + rnd() * 0.9, y = h + 0.4 + rnd() * 1.4 - (i === 0 ? -0.6 : 0);
    const s = (i === 0 ? 1.9 : 1.1 + rnd() * 0.7);
    const lc = pc(pal, 'leaf', Math.floor(rnd() * 4));
    g.ico(T(Math.cos(a) * r + lean * h, y, Math.sin(a) * r, rnd() * 3, 0, 0, s, s * 0.85, s), 1, 1, grad(mulc(lc, 0.55).concat(0), mulc(lc, 1.15).concat(0), -1, 1), 0.18, Math.floor(rnd() * 999));
  }
};
PROP.birch = (g, pal, rnd) => {
  const h = 4.5 + rnd() * 1.5;
  g.cyl(T(), 0.2, 0.13, h, 6, (x, y, z, ly) => (Math.sin(ly * 9 + x * 20) > 0.75 ? C('#2a2a2a') : C('#eeeae0')), { smooth: true });
  for (let i = 0; i < 4; i++) {
    const a = rnd() * TAU, y = h * (0.55 + i * 0.13), s = 0.8 + rnd() * 0.5;
    const lc = C(['#c9d94a', '#a8c94a', '#e0d050', '#8fbf4a'][i % 4]);
    g.ico(T(Math.cos(a) * 0.5, y + 0.3, Math.sin(a) * 0.5, 0, 0, 0, s, s * 1.3, s), 1, 1, grad(mulc(lc, 0.6).concat(0), lc, -1, 1), 0.2, i + 3);
  }
};
PROP.pine = (g, pal, rnd, v, biome, snow = false) => {
  const h = 5 + rnd() * 3, tr = pc(pal, 'trunk');
  g.cyl(T(), 0.28, 0.12, h * 0.5, 6, tr, { smooth: true });
  const tiers = 4;
  for (let i = 0; i < tiers; i++) {
    const t = i / tiers, r = (1 - t) * 2.0 + 0.4, y = h * 0.22 + t * h * 0.68, lc = pc(pal, 'leaf', i);
    const col = snow ? (x, yy, z, ly) => ly > 0.55 * (h * 0.36) ? C('#f4f8ff') : grad(mulc(lc, 0.6).concat(0), lc, 0, h * 0.36)(x, yy, z, ly) : grad(mulc(lc, 0.55).concat(0), lc, 0, h * 0.36);
    g.cyl(T(0, y, 0, rnd() * TAU), r, 0, h * 0.36, 8, col, { capBot: true });
  }
};
PROP.snowpine = (g, pal, rnd, v, biome) => PROP.pine(g, pal, rnd, v, biome, true);
PROP.deadtree = (g, pal, rnd) => {

  g.cyl(T(0, 0, 0, 0, 0, (rnd() - 0.5) * 0.2), 0.3, 0.12, h, 6, tr, { smooth: true });

PROP.cactus = (g, pal, rnd) => {
  const h = 2.2 + rnd() * 2, c = C('#5c9b4a'), c2 = C('#4a8a3c');
  const col = (x, y, z) => (Math.sin(Math.atan2(z, x) * 8) > 0 ? c : c2);
  g.cyl(T(), 0.38, 0.34, h, 8, col, { smooth: true }); g.sphere(T(0, h, 0), 0.34, 8, 4, c, true, 0.7);
  for (let i = 0; i < 2; i++) {
    if (rnd() < 0.3) continue;
    const s = i ? 1 : -1, y = h * (0.35 + rnd() * 0.3), ah = 0.6 + rnd() * 0.8;
    g.cyl(T(s * 0.3, y, 0, 0, 0, s * PI / 2), 0.2, 0.2, 0.55, 6, c, { smooth: true });
    g.cyl(T(s * 0.82, y - 0.05, 0), 0.2, 0.18, ah, 6, col, { smooth: true }); g.sphere(T(s * 0.82, y + ah, 0), 0.18, 6, 3, c, true, 0.7);
  }
  if (rnd() < 0.5) g.ico(T(0, h + 0.25, 0, 0, 0, 0, 0.15), 1, 0, C('#ff6a8a'));
};
PROP.palm = (g, pal, rnd) => {
  const h = 4.5 + rnd() * 2.5, tr = C('#9a7a52'), bend = 0.6 + rnd() * 0.8, segs = 6;
  let px = 0, py = 0;
  for (let i = 0; i < segs; i++) {
    const t = i / segs, t2 = (i + 1) / segs;
    const x0 = bend * t * t * 1.5, x1 = bend * t2 * t2 * 1.5, y0 = h * t, y1 = h * t2;
    const ang = Math.atan2(x1 - x0, y1 - y0);
    g.cyl(T(x0, y0, 0, 0, 0, -ang), 0.26 - t * 0.08, 0.24 - t * 0.08, Math.hypot(x1 - x0, y1 - y0) + 0.05, 6, i % 2 ? tr : mulc(tr, 0.8).concat(0), { smooth: true });
    px = x1; py = y1;
  }
  const n = 7;
  for (let i = 0; i < n; i++) {
    const a = i / n * TAU + rnd() * 0.3, lc = pc(pal, 'leaf', i);
    g.blade(TM(T(px, py, 0, a + PI / 2), T(0, 0, 0, 0, -1.25, 0)), 0.7, 3.2, -1.6, grad(mulc(lc, 0.7).concat(0), lc, 0, 3), 4);
  }
  g.sphere(T(px, py - 0.15, 0), 0.25, 6, 4, C('#6a4a2a'), true);
};

// clump of grass blades with up-facing normals (so it shades like the ground)
PROP.grass = (g, pal, rnd, v) => {
  const base = pc(pal, 'grass', v % 3), tip = mulc(pc(pal, 'grass', 2), 1.25).concat(0);
  const dark = mulc(base, 0.55).concat(0);
  const n = 9;
  for (let i = 0; i < n; i++) {
    const a = rnd() * TAU, r = Math.sqrt(rnd()) * 0.45, x = Math.cos(a) * r, z = Math.sin(a) * r;
    const h = 0.35 + rnd() * 0.45, w = 0.07 + rnd() * 0.05, yaw = rnd() * TAU, bend = 0.1 + rnd() * 0.25;
    const m = T(x, 0, z, yaw);
    const p = [[-w, 0, 0], [w, 0, 0], [w * 0.5, h * 0.55, bend * 0.4], [-w * 0.5, h * 0.55, bend * 0.4], [0, h, bend]].map(q => M4.xform(m, q[0], q[1], q[2]));
    const up = [0, 1, 0];
    const cA = dark, cM = mixc(base, tip, 0.4).concat(0), cT = tip;
    g.triN(p[0], p[1], p[2], up, up, up, (xx, yy) => yy < 0.01 ? cA : cM);
    g.triN(p[0], p[2], p[3], up, up, up, (xx, yy) => yy < 0.01 ? cA : cM);
    g.triN(p[3], p[2], p[4], up, up, up, (xx, yy) => yy > h * 0.9 ? cT : cM);
  }
};

    const a = rnd() * TAU, r = rnd() * 0.35, x = Math.cos(a) * r, z = Math.sin(a) * r, h = 0.45 + rnd() * 0.3;
    const fc = pc(pal, 'flower', v + i);
    g.cyl(T(x, 0, z), 0.015, 0.015, h, 3, C('#3d7a2f'), { capTop: false, capBot: false });
    for (let k = 0; k < 5; k++) { const pa = k / 5 * TAU; g.ico(T(x + Math.cos(pa) * 0.07, h, z + Math.sin(pa) * 0.07, 0, 0, 0, 0.065, 0.03, 0.065), 1, 0, fc); }
    g.ico(T(x, h + 0.01, z, 0, 0, 0, 0.04), 1, 0, C('#ffd34d', 0.3));
  }
};

PROP.chestLid = (g) => {

  const wood = C('#9a6a35'), gold = C('#f2c14e', 0.2), seg = 6;
  const dome = (hw, r, x0, col) => {
    for (let i = 0; i < seg; i++) {
      const a0 = i / seg * PI, a1 = (i + 1) / seg * PI;
      const y0 = Math.sin(a0) * r, z0 = 0.4 - Math.cos(a0) * r, y1 = Math.sin(a1) * r, z1 = 0.4 - Math.cos(a1) * r;
      g.quadL(T(), [x0 - hw, y0, z0], [x0 + hw, y0, z0], [x0 + hw, y1, z1], [x0 - hw, y1, z1], col);
      g.tri([x0 - hw, 0, 0.4], [x0 - hw, y0, z0], [x0 - hw, y1, z1], col); g.tri([x0 + hw, 0, 0.4], [x0 + hw, y1, z1], [x0 + hw, y0, z0], col);
    }
  };
  dome(0.6, 0.4, 0, wood); dome(0.05, 0.42, -0.55, gold); dome(0.05, 0.42, 0.55, gold);
};

  g.box(T(0, h / 2, 0), w, h, d, wall);
  for (const x of [-w / 2, w / 2]) for (const z of [-d / 2, d / 2]) g.box(T(x, h / 2, z), 0.3, h, 0.3, beam);

  g.wedge(T(0, h + 0.1, 0, PI / 2), d + 1.0, 2.4, w + 1.0, roof);
  g.box(T(0, 1.0, d / 2 + 0.02), 1.1, 2.0, 0.1, C('#6b3f22'));
  for (const x of [-w / 3.2, w / 3.2]) g.box(T(x, 2.0, d / 2 + 0.02), 0.8, 0.8, 0.1, C('#ffd88a', 1.2));
  g.box(T(w / 3.2, h + 1.6, -0.6), 0.6, 1.6, 0.6, C('#8a7a6a'));

// ---------- character rigs + procedural animation ----------
class RNode {
  constructor(name, mesh = null, col = null) {
    this.name = name; this.mesh = mesh; this.col = col || [1, 1, 1, 0];
    this.x = 0; this.y = 0; this.z = 0; this.yaw = 0; this.pitch = 0; this.roll = 0;
    this.bx = 0; this.by = 0; this.bz = 0; this.byaw = 0; this.bpitch = 0; this.broll = 0; // bind pose
    this.ms = [1, 1, 1]; this.mo = [0, 0, 0]; this.mr = [0, 0, 0]; // mesh scale / offset / rotation (not inherited)
    this.children = []; this.visible = true; this.world = M4.create(); this.dm = M4.create(); this.noShadow = false; this.glow = 0;
  }
}
const _lm = M4.create(), _sm = M4.create();
class Rig {
  constructor() { this.root = new RNode('root'); this.n = { root: this.root }; this.list = [this.root]; }
  add(name, parent, mesh, x = 0, y = 0, z = 0, col = null, ms = null) {
    const nd = new RNode(name, mesh, col); nd.bx = nd.x = x; nd.by = nd.y = y; nd.bz = nd.z = z;
    if (ms) nd.ms = ms;
    (this.n[parent] || this.root).children.push(nd); this.n[name] = nd; this.list.push(nd); return nd;
  }
  reset() { for (const nd of this.list) { nd.x = nd.bx; nd.y = nd.by; nd.z = nd.bz; nd.yaw = nd.byaw; nd.pitch = nd.bpitch; nd.roll = nd.broll; } }
  update(rootM) {
    const rec = (nd, pm) => {
      M4.compose(_lm, nd.x, nd.y, nd.z, nd.yaw, nd.pitch, nd.roll, 1, 1, 1);
      M4.mul(nd.world, pm, _lm);
      if (nd.mesh) {
        M4.compose(_sm, nd.mo[0], nd.mo[1], nd.mo[2], nd.mr[0], nd.mr[1], nd.mr[2], nd.ms[0], nd.ms[1], nd.ms[2]);
        M4.mul(nd.dm, nd.world, _sm);
      }
      for (const c of nd.children) rec(c, nd.world);
    };
    rec(this.root, rootM);
  }
  draw(flash = 0, dissolve = 0, tint = null, glowAdd = 0) {
    for (const nd of this.list) {
      if (!nd.mesh || !nd.visible) continue;
      let c = nd.col;
      if (tint || glowAdd || nd.glow) c = [c[0] * (tint ? tint[0] : 1), c[1] * (tint ? tint[1] : 1), c[2] * (tint ? tint[2] : 1), (c[3] || 0) + glowAdd + nd.glow];
      R.add(nd.mesh, nd.dm, c, [flash, 0, dissolve, 0]);
    }
  }
  pos(name) { const w = this.n[name].world; return [w[12], w[13], w[14]]; }
  point(name, x, y, z) { return M4.xform(this.n[name].world, x, y, z); }
}

// ---------- island generation, terrain queries and colliders ----------
const BASE_H = 2.0;

const CHUNK = 64, GCHUNK = 26;
World.beginProps = function () { this.chunkSets = new Map(); };

// ---- the main generator ----

World.pathDist = function (x, z) {
  let best = 1e9;

World.buildTerrain = function () {

World.buildWater = function () {

// distant decorative isles
World.buildFar = function (rng) {

  for (let i = 0; i < 16; i++) {
    const a = rr2() * TAU, d = 380 + rr2() * 1100, s = 20 + rr2() * 90, y = -60 + rr2() * 200;

PROP.stalactite = (g, pal, rnd, v) => {
  const c = pc(pal, 'cliff', v), u = pc(pal, 'under');
  g.cyl(T(0, 0, 0, rnd() * 3, PI), 1, 0, 1, 6, grad(c, u, 0, 1));
};
World.blocked = function (x, z, pad = 2) {
  for (const f of this.flat) if (Math.hypot(x - f.x, z - f.z) < f.r + pad) return true;
  if (this.pathDist(x, z) < 1.8 + pad * 0.3) return true;

};
World.slopeAt = function (x, z) {
  const h = this.topH(x, z), hx = this.topH(x + 1, z), hz = this.topH(x, z + 1);

      const k = boss ? 1 : clamp((I - 0.35) * 2, 0, 1);

const NAME_SUF = ['of the Meadow', 'of Dunes', 'of Frost', 'of Spores', 'of Embers', 'of Tides', 'of Prisms', 'of Storms', 'of Gears', 'of the Void'];
let itemSeq = 1;
function rollRarity(rng, isle, bonus = 0) {
  const reach = reachOf(Math.max(1, Math.min(isle, 1000)));
  const w = [60 - reach * 3, 26, 10 + reach * 0.8, 3 + reach * 0.9 + bonus * 4, 0.6 + reach * 0.45 + bonus * 2, reach >= 3 ? 0.05 + reach * 0.08 + bonus : 0];

}
function makeItem(slot, ilvl, rarity, rng, isle = 1) {
  const R0 = RARITY[rarity];
  const it = { id: itemSeq++ + '-' + Math.floor(rng.next() * 1e6), slot, rarity, ilvl, up: 0, aff: [], style: Math.floor(rng.next() * 6), reach: reachOf(Math.max(1, Math.min(isle, 1000))) };

  const n = R0.aff + (slot === 'charm' ? 1 : 0);

    case 'helm': return { hp: 22 * p, armor: 4 * p };
    case 'armor': return { hp: 38 * p, armor: 8 * p };
    case 'boots': return { hp: 14 * p, armor: 3 * p };

  }
}
function itemScore(it) { const b = itemBase(it); return (b.atk || 0) * 6 + (b.hp || 0) + (b.armor || 0) * 3 + it.aff.length * POW(it.ilvl) * 4; }

        tr.draw = () => { const k = tr.beacon.charge; R.add(Parts.gem, T(tr.bpos[0], tr.bpos[1] + 1.5, tr.bpos[2], R.time, 0, 0, 0.6, 1, 0.6), [1, 0.85, 0.5, 1 + k * 4], [tr.beacon.hp < 0.3 && Math.sin(R.time * 20) > 0 ? 0.4 : 0, 0, 0, 0]); FX.ring(base[0], base[2], 3, 3.2, [3, 2.4, 1, 0.6], 1, 40, 0.15, -PI / 2, -PI / 2 + TAU * k, base[1] + 1.1); R.light(tr.bpos[0], tr.bpos[1] + 1.5, tr.bpos[2], 12, 3, 2.4, 1); };
        break;
      }
      case 'rings': {
        const S2 = World.spots; tr.rings = []; const n = 6 + Math.floor(diff * 5);
        const startA = rng.next() * TAU; const sr = World.edgeR(startA) * 0.7;
        const sx = Math.cos(startA) * sr, sz = Math.sin(startA) * sr, g0 = World.groundAt(sx, sz), sy = g0 + 14;
        tr.tower = { x: sx, z: sz, y: sy }; addCol({ type: 'box', x: sx, y: sy - 0.3, z: sz, hx: 2, hy: 0.3, hz: 2 });
        for (let i = 0; i < 14; i++) addCol({ type: 'box', x: sx + Math.cos(i * 0.6) * 3.2, y: g0 + 1 + i, z: sz + Math.sin(i * 0.6) * 3.2, hx: 0.8, hy: 0.2, hz: 0.8, yaw: i * 0.6 });
        let dir = startA + PI, px = sx, pz = sz, py = sy;
        for (let i = 0; i < n; i++) { dir += (rng.next() - 0.5) * 0.9; px += Math.cos(dir) * 11; pz += Math.sin(dir) * 11; if (Math.hypot(px, pz) > World.R0 * 0.85) dir += PI * 0.6; py = Math.max(sy - 2.5 + (rng.next() - 0.5) * 2, World.groundAt(px, pz) + 4); tr.rings.push({ pos: [px, py, pz], got: false, yaw: PI / 2 - dir }); }
        tr.idx = 0; tr.started = false; tr.prog = 'Climb the tower and glide through the rings';
        tr.update = dt => {
          const onTower = dist2(P.pos[0], P.pos[2], sx, sz) < 2.2 && Math.abs(P.pos[1] - sy) < 0.3;
          if (onTower && !tr.started) { tr.started = true; tr.idx = 0; tr.rings.forEach(r => r.got = false); }

            const r = tr.rings[tr.idx];

            tr.prog = `Rings ${tr.idx}/${tr.rings.length}`;
          }
        };
        tr.draw = () => {
          for (let i = 0; i < 14; i++) R.add(Models.get('platform', World.biome), T(sx + Math.cos(i * 0.6) * 3.2, g0 + 1.2 + i, sz + Math.sin(i * 0.6) * 3.2, i * 0.6, 0, 0, 0.55, 0.65, 0.55), [1, 1, 1, 0]);
          R.add(Models.get('platform', World.biome), T(sx, sy, sz, 0, 0, 0, 1.35), [1, 1, 1, 0]);
          tr.rings.forEach((r, i) => { if (r.got) return; const cur = i === tr.idx && tr.started; const c = cur ? [3, 2.4, 0.8] : [1.4, 1.6, 2.4]; R.add(Models.get('ring'), T(r.pos[0], r.pos[1], r.pos[2], r.yaw), [c[0] / 3, c[1] / 3, c[2] / 3, cur ? 2 : 0.6]); });
        };
        tr.markers = () => tr.started ? (tr.idx < tr.rings.length ? [tr.rings[tr.idx].pos] : []) : [[sx, sy, sz]];
        tr.pack = () => []; tr.personal = true; tr.onNet = t => { if (t === 'done') tr.done = true; };
        break;
      }
    }
    return tr;
  },
  update(dt) {
    const tr = this.cur; if (!tr || tr.done || tr.failed || tr.ended) return; tr.t += dt;
    if (!tr.mirror) { tr.update(dt); return; }
    // a friend runs this trial: personal trials still play here and report when finished
    if (tr.personal) { tr.update(dt); if (tr.done) { tr.done = false; if (!tr.sentDone) { tr.sentDone = true; Net.sendTrial('done'); UI.toast('You finished! Waiting for the shrine...', '#ffe28a'); } } }
    else if (tr.guestUpdate) tr.guestUpdate(dt);
  },
  // apply the trial state from the friend who runs this island
  netApply(Tn, H) {
    const cur = this.cur;
    if (!Tn) {
      if (cur && cur.mirror && !cur.ended) { const won = Array.isArray(H.sp); this.end(won && cur.kind === 'ascent'); if (G.shrine) G.shrine.trialOn = false; if (!won) UI.banner('Trial failed', 'Try again at the shrine'); else { Audio2.star(); UI.banner('Trial complete!', 'The Star Shard appears'); } }
      return;
    }
    const kind = NET_TRIALS[Tn[0]];
    if (!kind || !World.spots.shrine) return;
    if (!cur || cur.ended || !cur.mirror || cur.kind !== kind || cur.k !== Tn[1]) {
      if (cur && !cur.ended) this.end();
      const tr = this.start(kind, { mirror: true, k: Tn[1] });
      if (G.shrine) G.shrine.trialOn = true; UI.banner(tr.info.name, tr.info.desc); Audio2.portal();
    }
    const tr = this.cur; tr.prog = String(Tn[2] || '').slice(0, 90);
    if (tr.apply && Array.isArray(Tn[3])) tr.apply(Tn[3]);
  },
  linger: null,
  draw() { const tr = this.cur; if (tr && tr.draw && !tr.ended) tr.draw(); if (this.linger && this.linger.draw) this.linger.draw(); },
  // keep = leave the platforms standing (so the star on top can still be reached)
  end(keep) {
    const tr = this.cur; if (!tr) { if (!keep) this.clearLinger(); return; }
    tr.ended = true; this.cur = null;
    if (keep) { this.clearLinger(); this.linger = tr; tr.update = () => { }; return; }
    for (const c of tr.cols) World.removeCol(c); tr.cols = [];
  },
  clearLinger() { const tr = this.linger; if (!tr) return; for (const c of tr.cols) World.removeCol(c); tr.cols = []; this.linger = null; },
};

G.buildIsle = function () {

  fsHelp() {

    UI.toast(/iPhone|iPod/.test(navigator.userAgent) ? 'On iPhone: tap Share, then "Add to Home Screen", and open the game from its icon to play fullscreen.' : 'Your browser blocked fullscreen here. Try the F11 key, or add the game to your home screen.', '#8fd3ff');
  },
  // called from a tap/click that starts play, so the browser allows it
  autoFs() { if (Save.settings.autoFs !== false && !this.isFs() && this.canFs()) this.enterFs(true); },
  fsChanged() { R.resize(true); const b = $('fsbtn'); if (b) b.textContent = this.fsEl() ? '⤡' : '⛶'; },
};

</script>
</body>
