<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Chibi Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #3b2d4a;
    --muted: #8d7ba0;
    --panel: rgba(255, 255, 255, 0.84);
    --line: rgba(120, 90, 160, 0.14);
    --chip: #f5effb;
    --pink: #ff7eb6;
    --pink-d: #f05b9d;
    --blue: #7ec8ff;
    --panel-w: 340px;
    --sheet-h: 0px;
    --safe-b: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: #ffe6f0;
    font-family: "Nunito", ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", sans-serif;
    color: var(--ink);
    -webkit-user-select: none; user-select: none;
  }
  canvas#c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; outline: none; }
  button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }
  input { font: inherit; color: inherit; }

  /* ---------- top bar ---------- */
  .brand {
    position: fixed; top: 14px; left: 16px; z-index: 5;
    display: flex; align-items: center; gap: 10px;
    padding: 8px 16px 8px 10px; border-radius: 999px;
    background: var(--panel); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    box-shadow: 0 6px 24px rgba(160, 90, 150, 0.16);
    font-weight: 900; font-size: 17px; letter-spacing: 0.2px;
  }
  .brand .logo {
    width: 30px; height: 30px; border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #fff 0 18%, transparent 19%), linear-gradient(135deg, #ff9fcf, #9fc9ff);
    box-shadow: inset 0 -3px 0 rgba(0,0,0,0.08);
  }
  .brand small { display: block; font-size: 11px; font-weight: 700; color: var(--muted); margin-top: -3px; }
  .mode-btn {
    position: fixed; top: 14px; right: calc(var(--panel-w) + 32px); z-index: 6;
    padding: 11px 20px; border-radius: 999px; font-weight: 900; font-size: 15px;
    color: #fff; background: linear-gradient(135deg, #ff86bd, #ff6aa8);
    box-shadow: 0 6px 18px rgba(255, 106, 168, 0.4), inset 0 -3px 0 rgba(0,0,0,0.1);
    transition: transform .15s, right .3s;
  }
  .mode-btn:active { transform: scale(0.95); }
  body.play .mode-btn { right: 16px; background: linear-gradient(135deg, #8fb8ff, #6f9cff); box-shadow: 0 6px 18px rgba(111,156,255,0.4), inset 0 -3px 0 rgba(0,0,0,0.1); }

  /* ---------- panel ---------- */
  .panel {
    position: fixed; z-index: 4; top: 14px; right: 16px; bottom: 14px; width: var(--panel-w);
    display: flex; flex-direction: column;
    background: var(--panel); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    border-radius: 24px; box-shadow: 0 10px 40px rgba(150, 90, 160, 0.18);
    transition: transform .35s cubic-bezier(.2,.9,.3,1), height .3s;
    overflow: hidden;
  }
  body.play .panel { transform: translateX(calc(100% + 40px)); }
  .panel-head {
    display: flex; align-items: center; gap: 8px; padding: 14px 14px 10px 18px;
    border-bottom: 1px solid var(--line); flex: none;
  }
  .panel-head h2 { margin: 0; font-size: 18px; font-weight: 900; flex: 1; }
  .grab { display: none; }
  .ghost-btn {
    padding: 7px 12px; border-radius: 999px; background: var(--chip); font-weight: 800; font-size: 13px;
    transition: background .15s, transform .1s;
  }
  .ghost-btn:hover { background: #ece1f7; }
  .ghost-btn:active { transform: scale(.95); }
  .collapse-btn { display: none; width: 34px; height: 34px; padding: 0; border-radius: 50%; font-size: 15px; }
  .panel-body { overflow-y: auto; padding: 4px 18px 18px; flex: 1; overscroll-behavior: contain; }
  .panel-body::-webkit-scrollbar { width: 8px; }
  .panel-body::-webkit-scrollbar-thumb { background: #e5d8f0; border-radius: 8px; }
  section { padding: 14px 0 6px; border-bottom: 1px dashed var(--line); }
  section:last-child { border-bottom: 0; }
  section h3 { margin: 0 0 10px; font-size: 13px; font-weight: 900; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
  .sub { display: block; font-size: 12px; font-weight: 800; color: var(--muted); margin: 10px 0 6px; }

  .swatches { display: flex; flex-wrap: wrap; gap: 8px; }
  .sw {
    width: 32px; height: 32px; border-radius: 50%; background: var(--c);
    box-shadow: inset 0 -3px 0 rgba(0,0,0,0.12), 0 0 0 2px #fff, 0 0 0 3px var(--line);
    transition: transform .12s, box-shadow .12s; position: relative; flex: none;
  }
  .sw:hover { transform: scale(1.1); }
  .sw.active { box-shadow: inset 0 -3px 0 rgba(0,0,0,0.12), 0 0 0 3px #fff, 0 0 0 5px var(--pink); transform: scale(1.06); }
  .sw.custom { background: conic-gradient(#ff8a8a, #ffd37a, #9be3a0, #7ec8ff, #c39bff, #ff8ac8, #ff8a8a); overflow: hidden; cursor: pointer; }
  .sw.custom::after { content: "+"; position: absolute; inset: 0; display: grid; place-items: center; color: #fff; font-weight: 900; font-size: 18px; text-shadow: 0 1px 2px rgba(0,0,0,.3); pointer-events: none; }
  .sw.custom input { position: absolute; inset: 0; opacity: 0; width: 100%; height: 100%; cursor: pointer; border: 0; padding: 0; }

  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
  .chip {
    padding: 8px 13px; border-radius: 999px; background: var(--chip); font-weight: 800; font-size: 13px;
    transition: background .15s, color .15s, transform .1s;
  }
  .chip:hover { background: #ece1f7; }
  .chip:active { transform: scale(.95); }
  .chip.active { background: var(--ink); color: #fff; }

  .slider { display: grid; grid-template-columns: 78px 1fr 40px; align-items: center; gap: 10px; margin: 6px 0 10px; font-weight: 800; font-size: 13px; }
  .slider output { text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; }
  input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 8px; border-radius: 8px; background: linear-gradient(90deg, #ffd0e6, #cfe4ff); outline: none; }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 22px; height: 22px; border-radius: 50%; background: #fff; border: 3px solid var(--pink); box-shadow: 0 2px 6px rgba(0,0,0,.15); cursor: pointer; }
  input[type=range]::-moz-range-thumb { width: 18px; height: 18px; border-radius: 50%; background: #fff; border: 3px solid var(--pink); cursor: pointer; }

  .row { display: flex; gap: 8px; }
  .text-in {
    flex: 1; min-width: 0; padding: 10px 14px; border-radius: 14px; border: 2px solid var(--line); background: #fff;
    font-weight: 700; font-size: 14px; outline: none; -webkit-user-select: text; user-select: text;
  }
  .text-in:focus { border-color: var(--pink); }
  .primary {
    padding: 10px 16px; border-radius: 14px; font-weight: 900; color: #fff;
    background: linear-gradient(135deg, #ff86bd, #ff6aa8); box-shadow: inset 0 -3px 0 rgba(0,0,0,0.1);
  }
  .primary:disabled { opacity: .45; cursor: not-allowed; }
  .preset-list { display: flex; flex-direction: column; gap: 6px; margin-top: 10px; }
  .preset {
    display: flex; align-items: center; gap: 10px; padding: 6px 6px 6px 8px; border-radius: 14px; background: #fff;
    border: 1px solid var(--line);
  }
  .preset .dot { width: 26px; height: 26px; border-radius: 50%; flex: none; box-shadow: inset 0 -2px 0 rgba(0,0,0,.12); }
  .preset .load { flex: 1; text-align: left; font-weight: 800; font-size: 14px; padding: 4px 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .preset .tag { font-size: 10px; font-weight: 900; color: var(--muted); background: var(--chip); padding: 3px 7px; border-radius: 999px; }
  .preset .del { width: 30px; height: 30px; border-radius: 50%; color: var(--muted); font-weight: 900; }
  .preset .del:hover { background: #ffe3ee; color: var(--pink-d); }
  .preset .del.armed { width: auto; padding: 0 10px; border-radius: 999px; background: #ffe3ee; color: var(--pink-d); font-size: 12px; }
  .note { font-size: 12px; color: var(--muted); margin-top: 8px; font-weight: 700; }

  /* ---------- pose bar ---------- */
  .posebar {
    position: fixed; z-index: 3; left: 0; right: calc(var(--panel-w) + 32px); bottom: calc(18px + var(--safe-b));
    display: flex; justify-content: center; gap: 10px; pointer-events: none;
    transition: right .3s, bottom .3s, top .3s;
  }
  body.play .posebar { right: 0; }
  .pose-btn {
    pointer-events: auto; padding: 11px 18px; border-radius: 999px; font-weight: 900; font-size: 14px;
    background: var(--panel); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    box-shadow: 0 6px 20px rgba(150, 90, 160, 0.18), inset 0 -3px 0 rgba(0,0,0,0.05);
    transition: transform .1s, background .15s;
  }
  .pose-btn:hover { background: #fff; }
  .pose-btn:active { transform: scale(.94); }
  .pose-btn .k { display: inline-block; margin-left: 6px; font-size: 11px; color: var(--muted); background: var(--chip); border-radius: 6px; padding: 1px 6px; }

  /* ---------- play HUD ---------- */
  .hud { display: none; }
  body.play .hud { display: block; }
  .hint {
    position: fixed; z-index: 3; top: 18px; left: 50%; transform: translateX(-50%);
    padding: 9px 16px; border-radius: 999px; font-weight: 800; font-size: 13px; color: var(--ink);
    background: var(--panel); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    box-shadow: 0 6px 20px rgba(150, 90, 160, 0.16); white-space: nowrap;
  }
  .hint b { background: var(--chip); padding: 1px 7px; border-radius: 6px; }
  .joy {
    position: fixed; z-index: 3; left: 26px; bottom: calc(26px + var(--safe-b)); width: 128px; height: 128px; border-radius: 50%;
    background: rgba(255,255,255,0.45); border: 3px solid rgba(255,255,255,0.8);
    box-shadow: 0 6px 20px rgba(150, 90, 160, 0.18); touch-action: none; display: none;
  }
  .joy .knob {
    position: absolute; left: 50%; top: 50%; width: 56px; height: 56px; margin: -28px 0 0 -28px; border-radius: 50%;
    background: linear-gradient(135deg, #ff9fcf, #ff7eb6); box-shadow: 0 4px 12px rgba(255,106,168,.45), inset 0 -4px 0 rgba(0,0,0,.1);
  }
  .jump-btn {
    position: fixed; z-index: 3; right: 26px; bottom: calc(36px + var(--safe-b)); width: 86px; height: 86px; border-radius: 50%;
    display: none; font-weight: 900; font-size: 15px; color: #fff;
    background: linear-gradient(135deg, #8fb8ff, #6f9cff); box-shadow: 0 6px 18px rgba(111,156,255,.45), inset 0 -4px 0 rgba(0,0,0,.12);
    touch-action: manipulation;
  }
  .jump-btn:active { transform: scale(.93); }
  body.touch .joy, body.touch .jump-btn { display: block; }
  .hint .touch-only { display: none; }
  body.touch .hint .touch-only { display: inline; }
  body.touch .hint .key-only { display: none; }

  .toast {
    position: fixed; z-index: 10; left: 50%; top: 74px; transform: translate(-50%, -20px); opacity: 0;
    padding: 10px 18px; border-radius: 999px; background: var(--ink); color: #fff; font-weight: 800; font-size: 14px;
    transition: opacity .25s, transform .25s; pointer-events: none;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  .loading {
    position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; text-align: center;
    background: linear-gradient(180deg, #bfe0ff, #ffe3ee); transition: opacity .5s; font-weight: 900; font-size: 18px;
  }
  .loading.hide { opacity: 0; pointer-events: none; }
  .loading .spin { width: 46px; height: 46px; margin: 0 auto 14px; border-radius: 50%; border: 5px solid #fff; border-top-color: var(--pink); animation: spin 0.9s linear infinite; }
  .loading p { font-size: 14px; color: var(--muted); font-weight: 700; max-width: 300px; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ---------- mobile: bottom sheet ---------- */
  @media (max-width: 760px) {
    :root { --panel-w: 0px; }
    .brand { top: 10px; left: 10px; font-size: 15px; padding: 6px 14px 6px 8px; }
    .brand .logo { width: 26px; height: 26px; }
    .mode-btn { top: 10px; right: 10px !important; padding: 10px 16px; font-size: 14px; }
    .panel {
      top: auto; left: 0; right: 0; bottom: 0; width: auto; height: min(46vh, 430px);
      border-radius: 24px 24px 0 0; padding-bottom: var(--safe-b);
    }
    .panel.collapsed { height: calc(62px + var(--safe-b)); }
    body.play .panel { transform: translateY(calc(100% + 20px)); }
    .panel-head { cursor: pointer; padding-top: 18px; position: relative; }
    .grab { display: block; position: absolute; top: 7px; left: 50%; width: 40px; height: 5px; margin-left: -20px; border-radius: 5px; background: #e2d4ee; }
    .collapse-btn { display: grid; place-items: center; transition: transform .25s; }
    .panel.collapsed .collapse-btn { transform: rotate(180deg); }
    .posebar { right: 0; bottom: calc(var(--sheet-h) + 10px); gap: 8px; }
    .pose-btn { padding: 9px 14px; font-size: 13px; }
    .pose-btn .k { display: none; }
    body.play .posebar { top: 62px; bottom: auto; }
    .hint { top: auto; bottom: calc(170px + var(--safe-b)); font-size: 12px; }
    .sw { width: 34px; height: 34px; }
  }
  @media (max-width: 380px) {
    .brand small { display: none; }
  }
</style>
</head>
<body>
  <canvas id="c" tabindex="0" aria-label="3D character view"></canvas>

  <div class="loading" id="loading">
    <div>
      <div class="spin"></div>
      Getting your studio ready…
      <p id="loadMsg"></p>
    </div>
  </div>

  <div class="brand"><div class="logo"></div><div>Chibi Studio<small>anime character creator</small></div></div>
  <button class="mode-btn" id="modeBtn">▶ Play</button>

  <aside class="panel" id="panel">
    <div class="panel-head" id="panelHead">
      <div class="grab"></div>
      <h2>Customize</h2>
      <button class="ghost-btn" id="randomBtn" title="Randomize">🎲 Random</button>
      <button class="ghost-btn collapse-btn" id="collapseBtn" aria-label="Collapse panel">▾</button>
    </div>
    <div class="panel-body">
      <section>
        <h3>Skin tone</h3>
        <div class="swatches" data-key="skin"></div>
      </section>
      <section>
        <h3>Hair</h3>
        <div class="chips" data-key="hairStyle"></div>
        <div class="swatches" data-key="hairColor"></div>
      </section>
      <section>
        <h3>Eyes</h3>
        <div class="swatches" data-key="eyeColor"></div>
      </section>
      <section>
        <h3>Outfit</h3>
        <div class="chips" data-key="outfitStyle"></div>
        <span class="sub">Main color</span>
        <div class="swatches" data-key="outfitColor"></div>
        <span class="sub">Accent color</span>
        <div class="swatches" data-key="accentColor"></div>
      </section>
      <section>
        <h3>Body</h3>
        <label class="slider"><span>Height</span><input type="range" data-key="height" min="0.8" max="1.25" step="0.01"><output></output></label>
        <label class="slider"><span>Head size</span><input type="range" data-key="headSize" min="0.85" max="1.2" step="0.01"><output></output></label>
      </section>
      <section>
        <h3>Presets</h3>
        <div class="row">
          <input class="text-in" id="presetName" maxlength="24" placeholder="Name your character" autocomplete="off">
          <button class="primary" id="saveBtn">Save</button>
        </div>
        <div class="preset-list" id="presetList"></div>
        <div class="note" id="storageNote"></div>
      </section>
    </div>
  </aside>

  <div class="posebar" id="posebar">
    <button class="pose-btn" data-pose="wave">👋 Wave<span class="k">1</span></button>
    <button class="pose-btn" data-pose="jump">⤴ Jump<span class="k">2</span></button>
    <button class="pose-btn" data-pose="victory">✌ Victory<span class="k">3</span></button>
  </div>

  <div class="hud">
    <div class="hint">
      <span class="key-only"><b>WASD</b> move · <b>Shift</b> run · <b>Space</b> jump · drag to look · <b>Esc</b> back</span>
      <span class="touch-only">Drag the pad to walk · push far to run</span>
    </div>
    <div class="joy" id="joy"><div class="knob" id="knob"></div></div>
    <button class="jump-btn" id="jumpBtn">JUMP</button>
  </div>

  <div class="toast" id="toast"></div>

<script>
  // If the module below can't load (no internet for the CDN), tell the player instead of spinning forever.
  setTimeout(function () {
    if (!window.__appStarted) {
      document.getElementById('loadMsg').textContent =
        "Couldn't load Three.js from the CDN. Check your internet connection and reload.";
    }
  }, 9000);
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { mergeVertices } from 'three/addons/utils/BufferGeometryUtils.js';

window.__appStarted = true;

/* =========================================================================
   Data: palettes, styles, presets
   ========================================================================= */
const PALETTES = {
  skin:        ['#fff1e6', '#ffe0cc', '#f6cfae', '#e8b48f', '#c98e66', '#8d5a3f'],
  hairColor:   ['#ff8fc0', '#b48cff', '#7ec8ff', '#ffe17a', '#ff9f6b', '#6b4a3a', '#2e2a3f', '#f4f2ff', '#8ee0b5', '#ff6b6b'],
  eyeColor:    ['#4aa3ff', '#9b6bff', '#ff5fa2', '#3fcf8e', '#ffb13d', '#8a5a3c', '#e83a4a', '#30c6d9'],
  outfitColor: ['#8fb8ff', '#ff9fc8', '#ffffff', '#b9a3ff', '#9be3c4', '#ffd98a', '#3b3f66', '#ff8a7a'],
  accentColor: ['#ff6f9f', '#5a7dff', '#ffcf5a', '#3b3f66', '#ffffff', '#7ad1a8', '#c86bff', '#ff8a4a'],
};
const HAIR_STYLES = [
  { id: 'twin', label: 'Twin tails' },
  { id: 'long', label: 'Long' },
  { id: 'pony', label: 'Ponytail' },
  { id: 'bob', label: 'Bob' },
  { id: 'spiky', label: 'Spiky' },
];
const OUTFITS = [
  { id: 'sailor', label: 'Sailor' },
  { id: 'dress', label: 'Dress' },
  { id: 'casual', label: 'Hoodie' },
];
const BUILTIN_PRESETS = {
  Sakura: { skin: '#ffe0cc', hairStyle: 'twin', hairColor: '#ff8fc0', eyeColor: '#4aa3ff', outfitStyle: 'sailor', outfitColor: '#ffffff', accentColor: '#5a7dff', height: 1, headSize: 1.05 },
  Kaito:  { skin: '#f6cfae', hairStyle: 'spiky', hairColor: '#2e2a3f', eyeColor: '#e83a4a', outfitStyle: 'casual', outfitColor: '#3b3f66', accentColor: '#ffcf5a', height: 1.12, headSize: 0.97 },
  Luna:   { skin: '#fff1e6', hairStyle: 'long', hairColor: '#b48cff', eyeColor: '#ffb13d', outfitStyle: 'dress', outfitColor: '#ffffff', accentColor: '#c86bff', height: 1.04, headSize: 1 },
  Mint:   { skin: '#e8b48f', hairStyle: 'bob', hairColor: '#8ee0b5', eyeColor: '#9b6bff', outfitStyle: 'casual', outfitColor: '#ffd98a', accentColor: '#5a7dff', height: 0.92, headSize: 1.1 },
};
const DEFAULT_CFG = { name: 'Sakura', ...BUILTIN_PRESETS.Sakura };

const HEX_RE = /^#[0-9a-f]{6}$/i;
function sanitize(raw) {
  const c = { ...DEFAULT_CFG };
  if (!raw || typeof raw !== 'object') return c;
  for (const k of ['skin', 'hairColor', 'eyeColor', 'outfitColor', 'accentColor']) {
    if (typeof raw[k] === 'string' && HEX_RE.test(raw[k])) c[k] = raw[k].toLowerCase();
  }
  if (HAIR_STYLES.some(s => s.id === raw.hairStyle)) c.hairStyle = raw.hairStyle;
  if (OUTFITS.some(s => s.id === raw.outfitStyle)) c.outfitStyle = raw.outfitStyle;
  const num = (v, lo, hi, d) => (typeof v === 'number' && isFinite(v)) ? Math.min(hi, Math.max(lo, v)) : d;
  c.height = num(raw.height, 0.8, 1.25, c.height);
  c.headSize = num(raw.headSize, 0.85, 1.2, c.headSize);
  if (typeof raw.name === 'string') c.name = raw.name.slice(0, 24);
  return c;
}

/* ---------- storage (always wrapped: private mode / blocked storage must not break the game) ---------- */
const STORE_KEY = 'chibiStudio.presets.v1';
const CURRENT_KEY = 'chibiStudio.current.v1';
const store = {
  ok: false,
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); return true; } catch (e) { return false; } },
};
try { localStorage.setItem('__chibi_test', '1'); localStorage.removeItem('__chibi_test'); store.ok = true; } catch (e) { store.ok = false; }

function loadPresets() {
  try {
    const raw = JSON.parse(store.get(STORE_KEY) || '{}');
    const out = {};
    if (raw && typeof raw === 'object') for (const [n, c] of Object.entries(raw)) out[String(n).slice(0, 24)] = sanitize(c);
    return out;
  } catch (e) { return {}; }
}
function savePresets(p) { try { return store.set(STORE_KEY, JSON.stringify(p)); } catch (e) { return false; } }

let cfg;
try { cfg = sanitize(JSON.parse(store.get(CURRENT_KEY) || 'null')); } catch (e) { cfg = sanitize(null); }
let presets = loadPresets();

/* =========================================================================
   Renderer, scene, camera
   ========================================================================= */
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });

/* =========================================================================
   Toon + outline materials
   ========================================================================= */
const OUTLINE_VS = `
  #include <common>
  #include <fog_pars_vertex>
  uniform float uThick;
  void main() {
    vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
    vec3 n = normalize(normalMatrix * normal);
    // push the back-faces out along the normal; scale by depth so the line stays a constant on-screen width
    mvPosition.xyz += n * uThick * clamp(-mvPosition.z, 1.0, 40.0);
    gl_Position = projectionMatrix * mvPosition;
    #include <fog_vertex>
  }`;
const OUTLINE_FS = `
  #include <common>
  #include <fog_pars_fragment>
  uniform vec3 uColor;
  void main() {
    gl_FragColor = vec4(uColor, 1.0);
    #include <colorspace_fragment>
    #include <fog_fragment>
  }`;
function makeOutlineMat(thick) {
  return new THREE.ShaderMaterial({
    uniforms: THREE.UniformsUtils.merge([THREE.UniformsLib.fog, { uColor: { value: new THREE.Color() }, uThick: { value: thick } }]),
    vertexShader: OUTLINE_VS, fragmentShader: OUTLINE_FS,
    side: THREE.BackSide, fog: true,
  });
}
const _hsl = {};
function outlineColorOf(c) {
  const o = c.clone();
  o.getHSL(_hsl, THREE.SRGBColorSpace);
  o.setHSL(_hsl.h, Math.min(1, _hsl.s * 0.7 + 0.15), _hsl.l * 0.32, THREE.SRGBColorSpace);
  return o;
}
function makePair(hex, { thick = 0.0028, side = THREE.DoubleSide, fog = true } = {}) {
  const toon = new THREE.MeshToonMaterial({ color: hex, gradientMap: gradTex, side, fog });
  const outline = makeOutlineMat(thick);
  const pair = {
    toon, outline,
    set(h) { toon.color.set(h); outline.uniforms.uColor.value.copy(outlineColorOf(toon.color)); },
  };
  pair.set(hex);
  return pair;
}
function toonMesh(geo, pair, { outline = true, cast = true, receive = true } = {}) {
  const m = new THREE.Mesh(geo, pair.toon);
  m.castShadow = cast;
  m.receiveShadow = receive;
  if (outline) {
    const o = new THREE.Mesh(geo, pair.outline);
    o.castShadow = false; o.receiveShadow = false;
    m.add(o);
    m.userData.outline = o;
  }
  return m;
}
function setPair(mesh, pair) {
  mesh.material = pair.toon;
  if (mesh.userData.outline) mesh.userData.outline.material = pair.outline;
}

/* =========================================================================
   Geometry helpers
   ========================================================================= */
// A tapered hair lock that hangs down (-Y) from the origin. `bend` curls the tip along +Z.
function lockGeo(len, rad, bend = 0) {
  const pts = [];
  const n = 16;
  for (let i = n; i >= 0; i--) {
    const u = i / n;
    let r = u < 0.18 ? rad * Math.sin((u / 0.18) * Math.PI / 2) : rad * Math.pow(1 - (u - 0.18) / 0.82, 1.15);
    if (i === 0 || i === n) r = 0;
    pts.push(new THREE.Vector2(r, -u * len));
  }
  let g = new THREE.LatheGeometry(pts, 14);
  g.deleteAttribute('normal'); g.deleteAttribute('uv');
  g = mergeVertices(g, 1e-5);
  const p = g.attributes.position;
  for (let i = 0; i < p.count; i++) {
    const u = -p.getY(i) / len;
    p.setZ(i, p.getZ(i) + bend * u * u);
  }
  g.computeVertexNormals();
  return g;
}
// Lathe from [r, y] pairs (bottom to top), with optional pleats near the hem.
function latheGeo(pairs, segs = 48, pleats = 0, amp = 0) {
  let g = new THREE.LatheGeometry(pairs.map(([r, y]) => new THREE.Vector2(r, y)), segs);
  g.deleteAttribute('normal'); g.deleteAttribute('uv');
  g = mergeVertices(g, 1e-5);
  if (pleats) {
    const p = g.attributes.position;
    const yTop = pairs[pairs.length - 1][1], yBot = pairs[0][1];
    for (let i = 0; i < p.count; i++) {
      const x = p.getX(i), z = p.getZ(i), y = p.getY(i);
      const k = (yTop - y) / (yTop - yBot);
      const f = 1 + amp * k * Math.cos(Math.atan2(z, x) * pleats);
      p.setX(i, x * f); p.setZ(i, z * f);
    }
  }
  g.computeVertexNormals();
  return g;
}
const ellipseGeo = (rx, ry, seg = 32) => new THREE.CircleGeometry(1, seg).scale(rx, ry, 1);
// A crescent / band along part of an ellipse, tapered at both ends.
function arcBandGeo(rx, ry, t, a0, a1, n = 24, taper = 0.6) {
  const s = new THREE.Shape();
  for (let i = 0; i <= n; i++) {
    const a = a0 + (a1 - a0) * i / n;
    const x = rx * Math.cos(a), y = ry * Math.sin(a);
    i === 0 ? s.moveTo(x, y) : s.lineTo(x, y);
  }
  for (let i = n; i >= 0; i--) {
    const a = a0 + (a1 - a0) * i / n;
    const th = t * ((1 - taper) + taper * Math.sin(Math.PI * i / n));
    s.lineTo((rx - th) * Math.cos(a), (ry - th) * Math.sin(a));
  }
  return new THREE.ShapeGeometry(s);
}
function openMouthGeo(w, h) {
  const s = new THREE.Shape();
  s.moveTo(w, 0);
  for (let i = 1; i <= 20; i++) { const a = Math.PI * i / 20; s.lineTo(w * Math.cos(a), -h * Math.sin(a)); }
  s.lineTo(w, 0);
  return new THREE.ShapeGeometry(s);
}

/* =========================================================================
   Character
   ========================================================================= */
const HEAD_R = 0.5;
const HIP_Y = 0.66;

const mats = {
  skin: makePair(cfg.skin),
  hair: makePair(cfg.hairColor),
  outfit: makePair(cfg.outfitColor),
  accent: makePair(cfg.accentColor),
  ribbon: makePair('#ff4f7a'),
  sock: makePair('#ffffff'),
};
const faceMats = {
  white: new THREE.MeshBasicMaterial({ color: '#fffaf6' }),
  iris: new THREE.MeshBasicMaterial({ color: cfg.eyeColor }),
  irisLight: new THREE.MeshBasicMaterial({ color: '#ffffff' }),
  pupil: new THREE.MeshBasicMaterial({ color: '#201028' }),
  shine: new THREE.MeshBasicMaterial({ color: '#ffffff' }),
  lash: new THREE.MeshBasicMaterial({ color: '#2a1830' }),
  brow: new THREE.MeshBasicMaterial({ color: '#553344' }),
  mouth: new THREE.MeshBasicMaterial({ color: '#8a2a45' }),
  tongue: new THREE.MeshBasicMaterial({ color: '#ff8a9e' }),
  line: new THREE.MeshBasicMaterial({ color: '#7a3a4a' }),
  blush: new THREE.MeshBasicMaterial({ color: '#ff8fab', transparent: true, opacity: 0.5, depthWrite: false }),
  nose: new THREE.MeshBasicMaterial({ color: '#e0a890' }),
};

// Face features are flat shapes wrapped onto the head sphere, so they sit perfectly on the curve.
function faceAnchor(head, cx, cy) {
  const zBase = Math.sqrt(HEAD_R * HEAD_R - cx * cx - cy * cy);
  const g = new THREE.Group();
  g.position.set(cx, cy, zBase);
  g.userData = { cx, cy, zBase };
  head.add(g);
  return g;
}
function faceDecal(anchor, parent, geo, mat, dx, dy, layer) {
  const { cx, cy, zBase } = anchor.userData;
  const r = HEAD_R + layer;
  const p = geo.attributes.position;
  for (let i = 0; i < p.count; i++) {
    const x = p.getX(i) + cx + dx, y = p.getY(i) + cy + dy;
    const z = Math.sqrt(Math.max(0, r * r - x * x - y * y));
    p.setXYZ(i, x - cx, y - cy, z - zBase);
  }
  p.needsUpdate = true;
  geo.computeBoundingSphere();
  const m = new THREE.Mesh(geo, mat);
  parent.add(m);
  return m;
}

const C = {}; // joint + part references

function buildCharacter() {
  const root = new THREE.Group();
  scene.add(root);
  const scaleG = new THREE.Group(); root.add(scaleG);
  const hips = new THREE.Group(); hips.position.y = HIP_Y; scaleG.add(hips);
  const spine = new THREE.Group(); hips.add(spine);

  const torso = toonMesh(new THREE.CapsuleGeometry(0.19, 0.26, 8, 20), mats.outfit);
  torso.scale.set(1, 1, 0.8); torso.position.y = 0.27; spine.add(torso);

  const chest = new THREE.Group(); chest.position.y = 0.47; spine.add(chest);
  const neck = toonMesh(new THREE.CapsuleGeometry(0.062, 0.08, 4, 12), mats.skin);
  neck.position.y = 0.12; chest.add(neck);

  const headPivot = new THREE.Group(); headPivot.position.y = 0.14; chest.add(headPivot);
  const head = new THREE.Group(); headPivot.add(head);
  const skull = toonMesh(new THREE.SphereGeometry(HEAD_R, 48, 32), mats.skin, { receive: false });
  head.add(skull);

  // ----- face -----
  const eyes = [];
  for (const side of [1, -1]) {
    const a = faceAnchor(head, 0.185 * side, -0.06);
    const open = new THREE.Group(); a.add(open);
    faceDecal(a, open, ellipseGeo(0.1, 0.125), faceMats.white, 0, 0, 0.004);
    faceDecal(a, open, ellipseGeo(0.08, 0.112), faceMats.iris, 0, -0.012, 0.007);
    faceDecal(a, open, ellipseGeo(0.052, 0.04), faceMats.irisLight, 0, -0.065, 0.009);
    faceDecal(a, open, ellipseGeo(0.04, 0.062), faceMats.pupil, 0, -0.008, 0.010);
    faceDecal(a, open, ellipseGeo(0.028, 0.034), faceMats.shine, 0.03, 0.038, 0.013);
    faceDecal(a, open, ellipseGeo(0.014, 0.014, 16), faceMats.shine, -0.032, -0.062, 0.013);
    faceDecal(a, open, arcBandGeo(0.108, 0.133, 0.024, 0.06 * Math.PI, 0.96 * Math.PI, 28, 0.7), faceMats.lash, 0, 0, 0.015);
    // tiny lash flick at the outer corner
    const flick = arcBandGeo(0.05, 0.05, 0.016, -0.1 * Math.PI, 0.3 * Math.PI, 10, 0.9);
    if (side < 0) flick.scale(-1, 1, 1);
    faceDecal(a, open, flick, faceMats.lash, side * 0.065, 0.06, 0.015);
    const happy = new THREE.Group(); happy.visible = false; a.add(happy);
    faceDecal(a, happy, arcBandGeo(0.08, 0.07, 0.024, 0.12 * Math.PI, 0.88 * Math.PI, 20, 0.6), faceMats.lash, 0, -0.04, 0.012);
    eyes.push({ anchor: a, open, happy });

    const brow = faceAnchor(head, 0.19 * side, 0.1);
    faceDecal(brow, brow, arcBandGeo(0.075, 0.03, 0.016, 0.22 * Math.PI, 0.8 * Math.PI, 16, 0.8), faceMats.brow, 0, 0, 0.006);
    const blush = faceAnchor(head, 0.26 * side, -0.17);
    faceDecal(blush, blush, ellipseGeo(0.07, 0.034), faceMats.blush, 0, 0, 0.003);
  }
  const nose = faceAnchor(head, 0, -0.15);
  faceDecal(nose, nose, ellipseGeo(0.012, 0.008, 12), faceMats.nose, 0, 0, 0.003);
  const mouthA = faceAnchor(head, 0, -0.235);
  const smile = new THREE.Group(); mouthA.add(smile);
  faceDecal(mouthA, smile, arcBandGeo(0.05, 0.03, 0.013, Math.PI + 0.35, 2 * Math.PI - 0.35, 16, 0.7), faceMats.line, 0, 0.02, 0.005);
  const openM = new THREE.Group(); openM.visible = false; mouthA.add(openM);
  faceDecal(mouthA, openM, openMouthGeo(0.055, 0.065), faceMats.mouth, 0, 0.02, 0.005);
  faceDecal(mouthA, openM, ellipseGeo(0.03, 0.017), faceMats.tongue, 0, -0.025, 0.007);

  const hairHolder = new THREE.Group(); head.add(hairHolder);

  // ----- arms -----
  const arms = {};
  for (const side of [1, -1]) {
    const sh = new THREE.Group(); sh.position.set(0.235 * side, 0, 0); chest.add(sh);
    const upper = toonMesh(new THREE.CapsuleGeometry(0.064, 0.13, 4, 14), mats.outfit);
    upper.position.y = -0.115; sh.add(upper);
    const puff = toonMesh(new THREE.SphereGeometry(0.1, 20, 14), mats.outfit);
    puff.position.y = -0.04; puff.scale.set(1, 0.85, 1); sh.add(puff);
    const elbow = new THREE.Group(); elbow.position.y = -0.24; sh.add(elbow);
    const fore = toonMesh(new THREE.CapsuleGeometry(0.056, 0.12, 4, 14), mats.skin);
    fore.position.y = -0.09; elbow.add(fore);
    const hand = toonMesh(new THREE.SphereGeometry(0.068, 18, 14), mats.skin);
    hand.position.y = -0.205; hand.scale.set(1, 1.1, 0.9); elbow.add(hand);
    arms[side] = { sh, elbow, upper, puff };
  }

  // ----- legs -----
  const legs = {};
  for (const side of [1, -1]) {
    const hip = new THREE.Group(); hip.position.set(0.1 * side, 0, 0); hips.add(hip);
    const thigh = toonMesh(new THREE.CapsuleGeometry(0.082, 0.15, 4, 14), mats.skin);
    thigh.position.y = -0.15; hip.add(thigh);
    const knee = new THREE.Group(); knee.position.y = -0.31; hip.add(knee);
    const shin = toonMesh(new THREE.CapsuleGeometry(0.074, 0.15, 4, 14), mats.sock);
    shin.position.y = -0.13; knee.add(shin);
    const shoe = toonMesh(new THREE.SphereGeometry(1, 22, 16), mats.accent);
    shoe.scale.set(0.088, 0.066, 0.128); shoe.position.set(0, -0.29, 0.03); knee.add(shoe);
    legs[side] = { hip, knee, shin };
  }

  // ----- outfit pieces (toggled per style) -----
  const outfit = {};
  outfit.shorts = toonMesh(latheGeo([[0.222, -0.17], [0.218, -0.08], [0.205, 0.0], [0.19, 0.07]]), mats.accent);
  outfit.shorts.scale.set(1, 1, 0.84);
  outfit.hood = toonMesh(new THREE.SphereGeometry(1, 20, 14), mats.outfit);
  outfit.hood.scale.set(0.2, 0.11, 0.12); outfit.hood.position.set(0, 0.56, -0.13);
  outfit.hoodRing = toonMesh(new THREE.TorusGeometry(0.115, 0.035, 10, 28), mats.accent);
  outfit.hoodRing.rotation.x = Math.PI / 2; outfit.hoodRing.position.y = 0.585;
  outfit.pocket = toonMesh(new THREE.SphereGeometry(1, 16, 10), mats.accent, { outline: false });
  outfit.pocket.scale.set(0.11, 0.05, 0.03); outfit.pocket.position.set(0, 0.12, 0.148);

  outfit.dressSkirt = toonMesh(latheGeo([[0.4, -0.31], [0.34, -0.2], [0.26, -0.06], [0.21, 0.04], [0.19, 0.09]], 56, 10, 0.03), mats.outfit);
  outfit.dressSkirt.scale.set(1, 1, 0.9);
  outfit.belt = toonMesh(new THREE.TorusGeometry(0.19, 0.026, 8, 32), mats.accent);
  outfit.belt.rotation.x = Math.PI / 2; outfit.belt.scale.set(1, 0.82, 1); outfit.belt.position.y = 0.09;

  outfit.sailorSkirt = toonMesh(latheGeo([[0.35, -0.24], [0.3, -0.14], [0.235, -0.02], [0.2, 0.06]], 64, 16, 0.045), mats.accent);
  outfit.sailorSkirt.scale.set(1, 1, 0.9);
  outfit.collar = toonMesh(latheGeo([[0.29, 0.42], [0.25, 0.48], [0.18, 0.55], [0.11, 0.6]], 40), mats.accent);
  outfit.collar.scale.set(1, 1, 0.82);
  outfit.bow = new THREE.Group(); outfit.bow.position.set(0, 0.43, 0.2);
  for (const s of [1, -1]) {
    const loop = toonMesh(new THREE.SphereGeometry(1, 16, 12), mats.ribbon);
    loop.scale.set(0.07, 0.042, 0.03); loop.position.x = 0.06 * s; loop.rotation.z = 0.25 * s; outfit.bow.add(loop);
    const tail = toonMesh(lockGeo(0.14, 0.035), mats.ribbon);
    tail.position.set(0.012 * s, -0.01, 0.005); tail.rotation.z = 0.35 * s; tail.scale.z = 0.5; outfit.bow.add(tail);
  }
  const knot = toonMesh(new THREE.SphereGeometry(0.03, 12, 10), mats.ribbon); outfit.bow.add(knot);
  for (const k of Object.keys(outfit)) spine.add(outfit[k]);

  Object.assign(C, { root, scaleG, hips, spine, torso, chest, headPivot, head, hairHolder, eyes, smile, openM, arms, legs, outfit });
}

/* ---------- Hair ---------- */
function addLock(parent, o) {
  const pivot = new THREE.Group();
  pivot.rotation.y = o.yaw || 0;
  const m = toonMesh(lockGeo(o.len, o.rad, o.bend || 0), o.pair || mats.hair);
  m.position.set(o.x || 0, o.y, o.dist || 0);
  m.rotation.set(o.tilt || 0, 0, o.roll || 0);
  m.scale.set(1, 1, o.flat ?? 0.6);
  pivot.add(m);
  parent.add(pivot);
  return pivot;
}
function addBangs(g, spiky = false) {
  const bangs = spiky
    ? [[-0.95, 0.26], [-0.6, 0.32], [-0.28, 0.27], [0.05, 0.34], [0.36, 0.28], [0.66, 0.31], [0.97, 0.25]]
    : [[-0.95, 0.31], [-0.63, 0.37], [-0.31, 0.33], [0, 0.39], [0.31, 0.33], [0.63, 0.37], [0.95, 0.31]];
  for (const [yaw, len] of bangs) {
    addLock(g, { yaw, y: 0.31, dist: 0.44, tilt: -0.33, roll: yaw * (spiky ? 0.45 : 0.28), len, rad: spiky ? 0.11 : 0.1, flat: 0.5 });
  }
}
function addSideLocks(g, len) {
  for (const s of [1, -1]) addLock(g, { yaw: 1.22 * s, y: 0.22, dist: 0.47, tilt: -0.1, len, rad: 0.1, flat: 0.5, bend: -0.04 });
}
function buildHair(style) {
  const g = new THREE.Group();
  // skull cap: leaves the face open, lower at the back
  const cap = toonMesh(new THREE.SphereGeometry(HEAD_R * 1.07, 40, 24, 0, Math.PI * 2, 0, Math.PI * 0.58), mats.hair);
  cap.rotation.x = -0.5; cap.position.y = 0.02; g.add(cap);
  // back-of-head volume
  const nape = toonMesh(new THREE.SphereGeometry(HEAD_R * 1.04, 36, 24), mats.hair);
  nape.position.set(0, -0.03, -0.07); g.add(nape);

  if (style === 'spiky') {
    addBangs(g, true);
    for (let i = 0; i < 9; i++) {
      const k = i - 4;
      addLock(g, { yaw: Math.PI + k * 0.42, y: 0.16 + 0.1 * Math.cos(k * 0.35), dist: 0.42, tilt: -1.85, len: 0.36, rad: 0.12, flat: 0.7 });
    }
    for (let i = 0; i < 5; i++) {
      addLock(g, { yaw: i * Math.PI * 2 / 5 + 0.3, y: 0.42, dist: 0.2, tilt: -2.45, len: 0.32, rad: 0.12, flat: 0.75 });
    }
    for (const k of [-1, 0, 1]) addLock(g, { yaw: Math.PI + k * 0.5, y: -0.12, dist: 0.46, tilt: -0.55, len: 0.3, rad: 0.11, flat: 0.6 });
    for (const s of [1, -1]) addLock(g, { yaw: 1.3 * s, y: 0.18, dist: 0.48, tilt: -0.25, len: 0.4, rad: 0.1, flat: 0.5 });
  } else if (style === 'long') {
    addBangs(g);
    addSideLocks(g, 0.98);
    for (let i = 0; i < 8; i++) {
      addLock(g, { yaw: 2.25 + i * (Math.PI * 2 - 4.5) / 7, y: 0.06, dist: 0.48, tilt: -0.1, len: 1.18, rad: 0.15, flat: 0.55, bend: 0.06 });
    }
    const curtain = toonMesh(new THREE.CapsuleGeometry(0.36, 0.7, 8, 18), mats.hair);
    curtain.scale.set(1.18, 1, 0.5); curtain.position.set(0, -0.42, -0.3); g.add(curtain);
    addLock(g, { yaw: 0.25, y: 0.52, dist: 0.04, tilt: -2.7, len: 0.3, rad: 0.05, bend: 0.14, flat: 0.6 }); // ahoge
  } else if (style === 'twin') {
    addBangs(g);
    addSideLocks(g, 0.55);
    for (const s of [1, -1]) {
      const tie = toonMesh(new THREE.SphereGeometry(0.075, 16, 12), mats.accent);
      tie.position.set(0.42 * s, 0.24, -0.14); g.add(tie);
      addLock(g, { x: 0.45 * s, y: 0.26, dist: -0.15, roll: 0.3 * s, tilt: 0.12, len: 1.3, rad: 0.17, flat: 0.8, bend: -0.1 });
      addLock(g, { x: 0.43 * s, y: 0.25, dist: -0.1, roll: 0.15 * s, tilt: 0.25, len: 1.05, rad: 0.13, flat: 0.8 });
    }
  } else if (style === 'pony') {
    addBangs(g);
    addSideLocks(g, 0.6);
    const tie = toonMesh(new THREE.SphereGeometry(0.08, 16, 12), mats.accent);
    tie.position.set(0, 0.2, -0.52); g.add(tie);
    addLock(g, { y: 0.24, dist: -0.52, tilt: 0.75, len: 1.1, rad: 0.2, flat: 0.85, bend: 0.25 });
    addLock(g, { y: 0.22, dist: -0.5, tilt: 0.5, roll: 0.12, len: 0.85, rad: 0.14, flat: 0.8, bend: 0.2 });
  } else if (style === 'bob') {
    addBangs(g);
    const n = 13;
    for (let i = 0; i < n; i++) {
      addLock(g, { yaw: 1.05 + i * (Math.PI * 2 - 2.1) / (n - 1), y: 0.18, dist: 0.47, tilt: -0.22, len: 0.62, rad: 0.16, flat: 0.55, bend: -0.12 });
    }
    addLock(g, { yaw: -0.2, y: 0.52, dist: 0.04, tilt: -2.7, len: 0.28, rad: 0.05, bend: 0.14, flat: 0.6 }); // ahoge
  }

  return g;
}
function setHair(style) {
  C.hairHolder.children.slice().forEach(old => {
    C.hairHolder.remove(old);
    old.traverse(o => { if (o.geometry && !o.userData.keepGeo) o.geometry.dispose(); });
  });
  C.hairHolder.add(buildHair(style));
}

/* ---------- Apply customization ---------- */
let currentHair = null;
function applyConfig(c) {
  mats.skin.set(c.skin);

  mats.outfit.set(c.outfitColor);
  mats.accent.set(c.accentColor);

  faceMats.irisLight.color.set(c.eyeColor).lerp(new THREE.Color('#ffffff'), 0.5);
  faceMats.pupil.color.set(c.eyeColor).multiplyScalar(0.12).lerp(new THREE.Color('#1a0d22'), 0.5);
  faceMats.brow.color.copy(outlineColorOf(new THREE.Color(c.hairColor))).lerp(new THREE.Color(c.hairColor), 0.35);
  faceMats.nose.color.set(c.skin).multiplyScalar(0.72);
  // sock color: white unless the outfit is white, then a soft tint of the accent
  mats.sock.set(c.outfitStyle === 'casual' ? c.skin : '#ffffff');

  if (currentHair !== c.hairStyle) { setHair(c.hairStyle); currentHair = c.hairStyle; }

  const o = C.outfit, st = c.outfitStyle;
  o.shorts.visible = o.hood.visible = o.hoodRing.visible = o.pocket.visible = st === 'casual';
  o.dressSkirt.visible = o.belt.visible = st === 'dress';
  o.sailorSkirt.visible = o.collar.visible = o.bow.visible = st === 'sailor';
  for (const s of [1, -1]) C.arms[s].puff.visible = st === 'dress';

/* =========================================================================
   World: ground, sky, props
   ========================================================================= */
const obstacles = [];
let cloudGroup;
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

function buildWorld() {
  // sky dome (gradient shader that follows the camera)
  const sky = new THREE.Mesh(
    new THREE.SphereGeometry(300, 32, 16),
    new THREE.ShaderMaterial({
      side: THREE.BackSide, depthWrite: false, fog: false,
      uniforms: {
        top: { value: new THREE.Color('#9fd2ff') },
        mid: { value: HORIZON.clone() },
        bot: { value: new THREE.Color('#ffd9ea') },
      },
      vertexShader: `varying vec3 vDir; void main(){ vDir = normalize(position); vec4 p = projectionMatrix * modelViewMatrix * vec4(position,1.0); gl_Position = p.xyww; }`,
      fragmentShader: `uniform vec3 top; uniform vec3 mid; uniform vec3 bot; varying vec3 vDir;
        void main(){ float h = vDir.y;
          vec3 c = h > 0.0 ? mix(mid, top, pow(smoothstep(0.0, 0.7, h), 0.75)) : mix(mid, bot, smoothstep(0.0, -0.25, h));
          gl_FragColor = vec4(c, 1.0);
          #include <colorspace_fragment>
        }`,
    })
  );
  sky.frustumCulled = false; sky.renderOrder = -10;
  sky.onBeforeRender = () => sky.position.copy(camera.position);
  scene.add(sky);

  const ground = new THREE.Mesh(new THREE.CircleGeometry(90, 72).rotateX(-Math.PI / 2),
    new THREE.MeshToonMaterial({ color: '#bfe9b4', gradientMap: gradTex }));
  ground.receiveShadow = true;
  scene.add(ground);

  const rng = mulberry32(20240607);
  // grass patches for some texture
  const patchMat = new THREE.MeshToonMaterial({ color: '#aee0a4', gradientMap: gradTex, polygonOffset: true, polygonOffsetFactor: -1, polygonOffsetUnits: -1 });
  for (let i = 0; i < 40; i++) {
    const a = rng() * Math.PI * 2, r = 4 + rng() * 45;
    const p = new THREE.Mesh(new THREE.CircleGeometry(1 + rng() * 2.4, 20).rotateX(-Math.PI / 2), patchMat);
    p.position.set(Math.cos(a) * r, 0.002, Math.sin(a) * r);
    p.scale.set(1, 1, 0.6 + rng() * 0.5);
    p.receiveShadow = true; scene.add(p);
  }
  // little stage under the character
  const stage = new THREE.Mesh(new THREE.CircleGeometry(1.5, 48).rotateX(-Math.PI / 2),
    new THREE.MeshToonMaterial({ color: '#ffd6e8', gradientMap: gradTex, polygonOffset: true, polygonOffsetFactor: -2, polygonOffsetUnits: -2 }));
  stage.position.y = 0.004; stage.receiveShadow = true; scene.add(stage);
  const ring = new THREE.Mesh(new THREE.RingGeometry(1.5, 1.64, 64).rotateX(-Math.PI / 2),
    new THREE.MeshToonMaterial({ color: '#ffffff', gradientMap: gradTex, polygonOffset: true, polygonOffsetFactor: -2, polygonOffsetUnits: -2 }));
  ring.position.y = 0.005; ring.receiveShadow = true; scene.add(ring);

  // trees
  const trunk = makePair('#c79a7c', { thick: 0.0035, side: THREE.FrontSide });
  const leaves = ['#9fe0a0', '#ffc4dd', '#b8e8a8', '#ffd2e6', '#a8dcc8'].map(c => makePair(c, { thick: 0.0035, side: THREE.FrontSide }));
  const trunkGeo = new THREE.CylinderGeometry(0.16, 0.24, 1.5, 10);
  const leafGeo = new THREE.SphereGeometry(1, 18, 14);
  const placed = [];
  let tries = 0;
  while (placed.length < 24 && tries++ < 400) {
    const a = rng() * Math.PI * 2, r = 7 + rng() * 32;
    const x = Math.cos(a) * r, z = Math.sin(a) * r;
    if (placed.some(p => Math.hypot(p.x - x, p.z - z) < 3.2)) continue;
    // keep the default creator backdrop (behind the character) pleasant but clear of the camera
    if (z > 3 && Math.abs(x) < 5) continue;
    placed.push({ x, z });
    const s = 0.85 + rng() * 0.6;
    const tree = new THREE.Group();
    tree.position.set(x, 0, z); tree.scale.setScalar(s); tree.rotation.y = rng() * 6;
    const t = toonMesh(trunkGeo, trunk); t.position.y = 0.75; tree.add(t);
    const lp = leaves[Math.floor(rng() * leaves.length)];
    for (const [lx, ly, lz, lr] of [[0, 2.0, 0, 0.95], [0.5, 1.65, 0.2, 0.62], [-0.45, 1.7, -0.15, 0.66], [0.1, 2.55, -0.05, 0.6]]) {
      const l = toonMesh(leafGeo, lp); l.position.set(lx, ly, lz); l.scale.setScalar(lr); tree.add(l);
    }
    scene.add(tree);
    obstacles.push({ x, z, r: 0.3 * s });
  }
  // rocks
  const rock = makePair('#dcd4ec', { thick: 0.0035, side: THREE.FrontSide });
  for (let i = 0; i < 12; i++) {
    const a = rng() * Math.PI * 2, r = 5 + rng() * 30;
    const x = Math.cos(a) * r, z = Math.sin(a) * r;
    if (z > 3 && Math.abs(x) < 4) continue;
    const s = 0.3 + rng() * 0.5;
    const m = toonMesh(leafGeo, rock); m.position.set(x, s * 0.25, z); m.scale.set(s * 1.3, s * 0.7, s);
    m.rotation.y = rng() * 6; scene.add(m);
    obstacles.push({ x, z, r: s * 1.1 });
  }
  // flowers (instanced, no outlines)
  const N = 260;
  const stems = new THREE.InstancedMesh(new THREE.CylinderGeometry(0.012, 0.012, 0.2, 5), new THREE.MeshToonMaterial({ color: '#7cc47c', gradientMap: gradTex }), N);
  const heads = new THREE.InstancedMesh(new THREE.SphereGeometry(0.065, 10, 8), new THREE.MeshToonMaterial({ color: '#ffffff', gradientMap: gradTex }), N);
  const fcols = ['#ffffff', '#ffd1e6', '#fff1a8', '#d9c8ff', '#ffb3c9'].map(c => new THREE.Color(c));
  const mtx = new THREE.Matrix4();
  for (let i = 0; i < N; i++) {
    const a = rng() * Math.PI * 2, r = 2.2 + rng() * 40;
    const x = Math.cos(a) * r, z = Math.sin(a) * r;
    mtx.makeTranslation(x, 0.1, z); stems.setMatrixAt(i, mtx);
    mtx.makeTranslation(x, 0.21, z); heads.setMatrixAt(i, mtx);
    heads.setColorAt(i, fcols[i % fcols.length]);
  }
  scene.add(stems, heads);

  // clouds
  cloudGroup = new THREE.Group();
  const cloudMat = new THREE.MeshToonMaterial({ color: '#ffffff', gradientMap: gradTex, fog: false, emissive: '#fff0f6', emissiveIntensity: 0.35 });
  for (let i = 0; i < 11; i++) {
    const c = new THREE.Group();
    const a = (i / 11) * Math.PI * 2 + rng() * 0.4, r = 55 + rng() * 40;
    c.position.set(Math.cos(a) * r, 18 + rng() * 16, Math.sin(a) * r);
    const n = 3 + Math.floor(rng() * 3);
    for (let j = 0; j < n; j++) {
      const s = new THREE.Mesh(leafGeo, cloudMat);
      const sz = 2.5 + rng() * 2.5;
      s.scale.set(sz * 1.2, sz * 0.8, sz);
      s.position.set((j - n / 2) * 3 + rng(), rng() * 1.5, rng() * 2);
      c.add(s);
    }
    c.lookAt(0, c.position.y, 0);
    cloudGroup.add(c);
  }
  scene.add(cloudGroup);
}

/* =========================================================================
   Confetti
   ========================================================================= */
const confetti = [];
(function () {
  const geo = new THREE.PlaneGeometry(0.07, 0.11);
  const cols = ['#ff8fc0', '#7ec8ff', '#ffe17a', '#9be3c4', '#c39bff', '#ffffff'];
  for (let i = 0; i < 60; i++) {
    const m = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ color: cols[i % cols.length], side: THREE.DoubleSide }));
    m.visible = false; m.frustumCulled = false;

  }
})();
function burstConfetti() {
  const h = 2.2 * cfg.height;
  for (const m of confetti) {
    m.position.set(C.root.position.x, C.root.position.y + h, C.root.position.z);
    const a = Math.random() * Math.PI * 2, sp = 1.2 + Math.random() * 2.2;
    m.userData.v.set(Math.cos(a) * sp, 3 + Math.random() * 3, Math.sin(a) * sp);
    m.userData.spin.set(Math.random() * 10, Math.random() * 10, Math.random() * 10);
    m.userData.life = 1.4 + Math.random() * 0.8;

}
function updateConfetti(dt) {
  for (const m of confetti) {
    const u = m.userData;
    if (u.life <= 0) continue;
    u.life -= dt;
    u.v.y -= 6 * dt; u.v.multiplyScalar(1 - 1.5 * dt);
    m.position.addScaledVector(u.v, dt);
    m.rotation.x += u.spin.x * dt; m.rotation.y += u.spin.y * dt; m.rotation.z += u.spin.z * dt;
    m.scale.setScalar(Math.min(1, u.life * 2));
    if (u.life <= 0) m.visible = false;
  }
}

/* =========================================================================
   Animation
   ========================================================================= */
const JOINT_KEYS = ['hipY', 'spineX', 'spineY', 'spineZ', 'headX', 'headY', 'headZ', 'aLx', 'aLz', 'aRx', 'aRz', 'eLx', 'eLz', 'eRx', 'eRz', 'lLx', 'lLz', 'lRx', 'lRz', 'kL', 'kR'];
const J = Object.fromEntries(JOINT_KEYS.map(k => [k, 0]));
J.aLz = 0.14; J.aRz = -0.14;

const pose = { name: null, t: 0, dur: 0 };
const POSE_DUR = { wave: 2.4, jump: 1.15, victory: 2.8 };
function playPose(name) {
  if (name === 'jump' && mode === 'play') { doJump(); return; }
  pose.name = name; pose.t = 0; pose.dur = POSE_DUR[name];
  if (name === 'victory') setTimeout(burstConfetti, 380);
}

const blink = { timer: 2, t: 0 };
const loco = { vel: new THREE.Vector3(), phase: 0, vy: 0, grounded: true };
let pop = 0; // little squash when customizing
let mode = 'create';

const lerp = (a, b, t) => a + (b - a) * t;
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const smooth = t => t * t * (3 - 2 * t);
function wrapAngle(a) { while (a > Math.PI) a -= Math.PI * 2; while (a < -Math.PI) a += Math.PI * 2; return a; }
// hip drop that keeps the feet planted for a given thigh angle (thigh -a, knee 2a)
const crouchDrop = a => -0.61 * (1 - Math.cos(a));

function animateCharacter(dt, time) {
  const T = Object.fromEntries(JOINT_KEYS.map(k => [k, 0]));
  T.aLz = 0.14; T.aRz = -0.14; T.eLx = -0.14; T.eRx = -0.14;
  let airY = 0, happy = false, mouthOpen = false;

  // idle breathing + sway
  const br = Math.sin(time * 2.1);
  T.aLz += 0.03 * br; T.aRz -= 0.03 * br;
  T.headX = 0.03 * Math.sin(time * 2.1 - 0.7);
  T.headZ = 0.035 * Math.sin(time * 0.7);
  T.spineZ = 0.015 * Math.sin(time * 0.7 + 1);
  C.torso.scale.y = 1 + 0.014 * br;
  C.chest.position.y = 0.47 + 0.006 * br;

  // look toward the camera a little while posing in the creator
  if (mode === 'create') {
    const ang = wrapAngle(Math.atan2(camera.position.x - C.root.position.x, camera.position.z - C.root.position.z) - C.root.rotation.y);
    T.headY = clamp(ang, -0.9, 0.9) * 0.45;
  }

  // walking / running
  const speed = Math.hypot(loco.vel.x, loco.vel.z);
  const sn = speed / WALK_SPEED;
  if (sn > 0.02) {
    const w = Math.min(1, sn), run = clamp(sn - 1, 0, 1);
    loco.phase += dt * (5.2 + 3.2 * run) * Math.min(1, 0.4 + sn * 0.6);
    const p = loco.phase, sw = Math.sin(p);
    const A = 0.55 + 0.25 * run, armA = 0.45 + 0.4 * run, K = 0.85 + 0.5 * run;
    T.lLx = sw * A * w; T.lRx = -sw * A * w;
    T.kL = Math.max(0, -Math.cos(p)) * K * w + 0.1 * w;
    T.kR = Math.max(0, Math.cos(p)) * K * w + 0.1 * w;
    T.aLx = -sw * armA * w; T.aRx = sw * armA * w;
    T.eLx = T.eRx = -0.25 - 0.9 * run;
    T.hipY = -0.05 * w * Math.abs(sw) - 0.02 * run;
    T.spineX = 0.08 * w + 0.14 * run;
    T.spineY = 0.12 * sw * w;
    T.headX += -0.06 * run;
    T.headY *= 1 - w;
  }

  // airborne (play-mode jump)
  if (!loco.grounded) {
    const up = loco.vy > 0 ? 1 : 0.6;
    T.lLx = -0.55; T.kL = 1.0; T.lRx = 0.15; T.kR = 0.45;
    T.aLz = 1.1 * up + 0.3; T.aRz = -(1.1 * up + 0.3); T.aLx = -0.2; T.aRx = -0.2;
    T.spineX = 0.05; mouthOpen = true;
  }

  // pose overlays
  if (pose.name) {
    pose.t += dt;
    const t = pose.t, D = pose.dur;
    const env = smooth(clamp(t / 0.25, 0, 1)) * smooth(clamp((D - t) / 0.3, 0, 1));
    const P = {};
    if (pose.name === 'wave') {
      P.aRz = -2.55; P.aRx = -0.15;
      P.eRz = -0.55 + 0.5 * Math.sin(t * 11); P.eRx = -0.1;
      P.headZ = 0.14; P.headX = -0.04; P.spineZ = 0.06;
      P.aLz = 0.2;
      mouthOpen = mouthOpen || env > 0.5;
    } else if (pose.name === 'jump') {
      let a = 0, armsUp = 0;
      if (t < 0.22) a = 0.55 * Math.sin((t / 0.22) * Math.PI / 2);
      else if (t < 0.82) { const v = (t - 0.22) / 0.6; airY = 4 * 0.75 * v * (1 - v); armsUp = Math.sin(Math.min(1, v * 2.5) * Math.PI / 2); a = 0.3 * Math.sin(v * Math.PI); mouthOpen = true; }
      else { const w2 = (t - 0.82) / 0.33; a = 0.45 * Math.cos(Math.min(1, w2) * Math.PI / 2); }
      P.lLx = P.lRx = -a; P.kL = P.kR = 2 * a;
      P.hipY = airY > 0 ? 0 : crouchDrop(a);
      P.spineX = 0.3 * a;
      P.aLx = P.aRx = (airY > 0 ? -0.3 : 0.9 * (a / 0.55));
      P.aLz = 0.15 + 2.3 * armsUp; P.aRz = -(0.15 + 2.3 * armsUp);
      P.eLx = P.eRx = -0.2;
      P.headX = airY > 0 ? -0.15 : 0.1 * a;
    } else if (pose.name === 'victory') {
      let a = 0, up = 0;
      if (t < 0.3) a = 0.45 * Math.sin((t / 0.3) * Math.PI / 2);
      else if (t < 0.8) { const v = (t - 0.3) / 0.5; airY = 4 * 0.42 * v * (1 - v); up = smooth(Math.min(1, v * 2)); a = 0.2 * Math.sin(v * Math.PI); }
      else { up = 1; a = 0.12 * Math.max(0, Math.sin((t - 0.8) * 9)); }
      if (t > 0.3) { happy = true; mouthOpen = true; }
      const pump = t > 0.8 ? 0.14 * Math.sin((t - 0.8) * 12) : 0;
      P.lLx = P.lRx = -a; P.kL = P.kR = 2 * a;
      P.hipY = airY > 0 ? 0 : crouchDrop(a);
      P.aLz = 0.3 + 2.25 * up + pump; P.aRz = -(0.3 + 2.25 * up + pump);
      P.aLx = P.aRx = -0.25 * up + 0.7 * (1 - up) * (a / 0.45);
      P.eLz = 0.25 * up; P.eRz = -0.25 * up;
      P.headX = -0.18 * up; P.spineX = -0.06 * up;
      P.lLz = 0.12 * up; P.lRz = -0.12 * up;
    }
    for (const k in P) T[k] = lerp(T[k], P[k], env);
    airY *= env > 0 ? 1 : 0;
    if (t >= D) pose.name = null;
  }

  // ease every joint toward its target
  const f = 1 - Math.exp(-dt * 14);
  for (const k of JOINT_KEYS) J[k] += (T[k] - J[k]) * f;

  // squash pop after edits
  pop = Math.max(0, pop - dt);
  const popK = pop > 0 ? Math.sin((1 - pop / 0.35) * Math.PI) * 0.06 : 0;

  C.hips.position.y = HIP_Y + J.hipY + airY;
  C.scaleG.scale.set(cfg.height * (1 + popK * 0.6), cfg.height * (1 - popK), cfg.height * (1 + popK * 0.6));
  C.spine.rotation.set(J.spineX, J.spineY, J.spineZ);
  C.headPivot.rotation.set(J.headX, J.headY, J.headZ);
  C.arms[1].sh.rotation.set(J.aLx, 0, J.aLz);
  C.arms[-1].sh.rotation.set(J.aRx, 0, J.aRz);
  C.arms[1].elbow.rotation.set(J.eLx, 0, J.eLz);
  C.arms[-1].elbow.rotation.set(J.eRx, 0, J.eRz);
  C.legs[1].hip.rotation.set(J.lLx, 0, J.lLz);
  C.legs[-1].hip.rotation.set(J.lRx, 0, J.lRz);
  C.legs[1].knee.rotation.x = J.kL;
  C.legs[-1].knee.rotation.x = J.kR;

  // blinking
  blink.timer -= dt;
  if (blink.timer <= 0) { blink.t = 0.16; blink.timer = 1.8 + Math.random() * 3.5; if (Math.random() < 0.18) blink.timer = 0.25; }
  let eyeY = 1;
  if (blink.t > 0) { blink.t -= dt; const u = 1 - Math.max(0, blink.t) / 0.16; eyeY = Math.max(0.08, Math.abs(1 - 2 * u)); }
  for (const e of C.eyes) {
    e.anchor.scale.y = happy ? 1 : eyeY;
    e.open.visible = !happy; e.happy.visible = happy;
  }
  C.smile.visible = !mouthOpen; C.openM.visible = mouthOpen;
}

/* =========================================================================
   Play mode: movement, camera follow
   ========================================================================= */
const WALK_SPEED = 2.6, RUN_SPEED = 5.4, WORLD_R = 46;
const keys = new Set();
const joy = { x: 0, y: 0, mag: 0 };
const _fwd = new THREE.Vector3(), _right = new THREE.Vector3(), _move = new THREE.Vector3();
const followTarget = new THREE.Vector3();

function doJump() {
  if (mode !== 'play' || !loco.grounded) return;
  loco.vy = 5.6; loco.grounded = false;
}

function updatePlay(dt) {
  let ix = 0, iy = 0;
  if (keys.has('a') || keys.has('arrowleft')) ix -= 1;
  if (keys.has('d') || keys.has('arrowright')) ix += 1;
  if (keys.has('w') || keys.has('arrowup')) iy += 1;
  if (keys.has('s') || keys.has('arrowdown')) iy -= 1;
  ix += joy.x; iy += joy.y;
  const mag = Math.min(1, Math.hypot(ix, iy));
  const running = keys.has('shift') || joy.mag > 0.92;

  _fwd.subVectors(controls.target, camera.position); _fwd.y = 0; _fwd.normalize();
  _right.crossVectors(_fwd, camera.up).normalize();
  _move.set(0, 0, 0).addScaledVector(_right, ix).addScaledVector(_fwd, iy);
  if (_move.lengthSq() > 0) _move.normalize();
  const target = (running ? RUN_SPEED : WALK_SPEED) * mag;
  const k = 1 - Math.exp(-dt * (loco.grounded ? 10 : 3));
  loco.vel.x += (_move.x * target - loco.vel.x) * k;
  loco.vel.z += (_move.z * target - loco.vel.z) * k;

  const p = C.root.position;
  p.x += loco.vel.x * dt; p.z += loco.vel.z * dt;
  for (const o of obstacles) {
    const dx = p.x - o.x, dz = p.z - o.z, d = Math.hypot(dx, dz), min = o.r + 0.28 * cfg.height;
    if (d < min && d > 1e-5) { p.x = o.x + dx / d * min; p.z = o.z + dz / d * min; }
  }
  const r = Math.hypot(p.x, p.z);
  if (r > WORLD_R) { p.x *= WORLD_R / r; p.z *= WORLD_R / r; }

  // vertical
  if (!loco.grounded) {
    loco.vy -= 15 * dt; p.y += loco.vy * dt;
    if (p.y <= 0) { p.y = 0; loco.vy = 0; loco.grounded = true; }
  }

  if (mag > 0.05) {
    const want = Math.atan2(_move.x, _move.z);
    C.root.rotation.y += wrapAngle(want - C.root.rotation.y) * (1 - Math.exp(-dt * 12));
  }

  // camera follow: shift both camera and orbit target by how far the character moved
  const ty = 1.25 * cfg.height + p.y * 0.4;
  followTarget.set(p.x, lerp(controls.target.y, ty, 1 - Math.exp(-dt * 6)), p.z);
  const delta = followTarget.clone().sub(controls.target);
  camera.position.add(delta);
  controls.target.copy(followTarget);
}

function settleCreate(dt) {
  // ease the character back to the stage, facing the front
  const p = C.root.position;
  loco.vel.multiplyScalar(Math.exp(-dt * 10));
  p.y = 0; loco.grounded = true; loco.vy = 0;
  C.root.rotation.y += wrapAngle(0 - C.root.rotation.y) * (1 - Math.exp(-dt * 8));
}

/* =========================================================================
   Layout: camera framing next to the panel / above the bottom sheet
   ========================================================================= */
const panel = document.getElementById('panel');
const isMobile = () => innerWidth <= 760;

function sheetHeight() { return isMobile() && mode === 'create' ? panel.getBoundingClientRect().height : 0; }
function updateViewOffset() {
  const W = innerWidth, H = innerHeight;
  if (mode === 'create') {
    if (isMobile()) {
      const sh = sheetHeight();
      document.documentElement.style.setProperty('--sheet-h', sh + 'px');
      camera.setViewOffset(W, H, 0, sh / 2 - 20, W, H);
    } else {
      document.documentElement.style.setProperty('--sheet-h', '0px');
      camera.setViewOffset(W, H, (panel.offsetWidth + 32) / 2, 0, W, H);
    }
  } else {
    camera.clearViewOffset();
  }
}
function creatorDistance() {
  const W = Math.max(1, innerWidth), H = Math.max(1, innerHeight);
  const visH = Math.max(160, H - 130 - (isMobile() ? sheetHeight() : 0));
  const visW = Math.max(200, W - (isMobile() ? 0 : panel.offsetWidth + 32));
  const needV = 2.95 * cfg.height, needW = 1.9;
  const tanH = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
  const dV = (needV * H / visH) / (2 * tanH);
  const dW = (needW * W / visW) / (2 * tanH * (W / H));
  const d = Math.max(dV, dW);
  return isFinite(d) ? clamp(d, 3.6, 13) : 6;
}
function resetCreatorCamera() {
  const d = creatorDistance();
  const ty = 1.15 * cfg.height;
  controls.target.set(0, ty, 0);
  camera.position.set(d * 0.18, ty + d * 0.1, d);
  controls.minDistance = 2.2; controls.maxDistance = 14;
  controls.minPolarAngle = 0.25; controls.maxPolarAngle = Math.PI * 0.5;
  controls.update();
}
let needsFraming = false;
function onResize() {
  if (!innerWidth || !innerHeight) { needsFraming = true; return; } // hidden / not laid out yet
  renderer.setSize(innerWidth, innerHeight, false);
  camera.aspect = innerWidth / innerHeight;
  updateViewOffset();
  camera.updateProjectionMatrix();
  if (needsFraming && mode === 'create') { needsFraming = false; resetCreatorCamera(); }
}
addEventListener('resize', onResize);
if ('ResizeObserver' in window) new ResizeObserver(() => { updateViewOffset(); camera.updateProjectionMatrix(); }).observe(panel);

/* =========================================================================
   Modes
   ========================================================================= */
const modeBtn = document.getElementById('modeBtn');
function enterPlay() {
  mode = 'play';
  document.body.classList.add('play');
  modeBtn.textContent = '✎ Edit';
  updateViewOffset(); camera.updateProjectionMatrix();
  const p = C.root.position, yaw = C.root.rotation.y;
  controls.target.set(p.x, 1.25 * cfg.height, p.z);
  camera.position.set(p.x - Math.sin(yaw) * 5.6, 1.25 * cfg.height + 1.7, p.z - Math.cos(yaw) * 5.6);
  controls.minDistance = 2.8; controls.maxDistance = 12;
  controls.minPolarAngle = 0.35; controls.maxPolarAngle = Math.PI * 0.47;
  controls.update();
  canvas.focus({ preventScroll: true });
}
function enterCreate() {
  mode = 'create';
  document.body.classList.remove('play');
  modeBtn.textContent = '▶ Play';
  keys.clear(); joy.x = joy.y = joy.mag = 0;
  C.root.position.set(0, 0, 0);
  loco.vel.set(0, 0, 0);
  updateViewOffset(); camera.updateProjectionMatrix();
  resetCreatorCamera();
}
modeBtn.addEventListener('click', () => (mode === 'create' ? enterPlay() : enterCreate()));

/* =========================================================================
   Input
   ========================================================================= */
const isTyping = e => e.target && (e.target.tagName === 'INPUT' && e.target.type === 'text');
addEventListener('keydown', e => {
  if (isTyping(e)) return;
  const k = e.key.toLowerCase();
  if (['arrowup', 'arrowdown', 'arrowleft', 'arrowright', ' '].includes(k) && mode === 'play') e.preventDefault();
  keys.add(k);
  if (e.repeat) return;
  if (k === ' ') { e.preventDefault(); playPose('jump'); }
  else if (k === '1') playPose('wave');
  else if (k === '2') playPose('jump');
  else if (k === '3') playPose('victory');
  else if (k === 'escape' && mode === 'play') enterCreate();
});
addEventListener('keyup', e => keys.delete(e.key.toLowerCase()));
addEventListener('blur', () => keys.clear());

// touch detection: show joystick on touch devices
function markTouch() { document.body.classList.add('touch'); }
if (matchMedia('(pointer: coarse)').matches || navigator.maxTouchPoints > 0) markTouch();
addEventListener('touchstart', markTouch, { once: true, passive: true });

const joyEl = document.getElementById('joy'), knob = document.getElementById('knob');
let joyId = null;
function joyMove(e) {
  const r = joyEl.getBoundingClientRect();
  let dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height / 2);
  const max = r.width / 2 - 14, d = Math.hypot(dx, dy);
  if (d > max) { dx *= max / d; dy *= max / d; }
  knob.style.transform = `translate(${dx}px, ${dy}px)`;
  joy.x = dx / max; joy.y = -dy / max; joy.mag = Math.min(1, d / max);
}
joyEl.addEventListener('pointerdown', e => { joyId = e.pointerId; joyEl.setPointerCapture(e.pointerId); joyMove(e); e.preventDefault(); });
joyEl.addEventListener('pointermove', e => { if (e.pointerId === joyId) joyMove(e); });
const joyEnd = e => { if (e.pointerId !== joyId) return; joyId = null; joy.x = joy.y = joy.mag = 0; knob.style.transform = ''; };
joyEl.addEventListener('pointerup', joyEnd);
joyEl.addEventListener('pointercancel', joyEnd);
document.getElementById('jumpBtn').addEventListener('pointerdown', e => { e.preventDefault(); doJump(); });

document.querySelectorAll('.pose-btn').forEach(b => b.addEventListener('click', () => playPose(b.dataset.pose)));

/* =========================================================================
   Customization UI
   ========================================================================= */
const toastEl = document.getElementById('toast');
let toastT;
function toast(msg) {
  toastEl.textContent = msg; toastEl.classList.add('show');
  clearTimeout(toastT); toastT = setTimeout(() => toastEl.classList.remove('show'), 1700);
}

function update(patch) {
  Object.assign(cfg, patch);
  applyConfig(cfg);
  pop = 0.35;
  syncUI();
  try { store.set(CURRENT_KEY, JSON.stringify(cfg)); } catch (e) { /* storage unavailable: keep playing */ }
}

function buildUI() {
  document.querySelectorAll('.swatches').forEach(el => {
    const key = el.dataset.key;
    for (const hex of PALETTES[key]) {
      const b = document.createElement('button');
      b.className = 'sw'; b.style.setProperty('--c', hex); b.dataset.value = hex;
      b.title = hex; b.setAttribute('aria-label', `${key} ${hex}`);
      b.addEventListener('click', () => update({ [key]: hex }));
      el.appendChild(b);
    }
    const lab = document.createElement('label');
    lab.className = 'sw custom'; lab.title = 'Custom color';
    const inp = document.createElement('input');
    inp.type = 'color'; inp.setAttribute('aria-label', `custom ${key}`);
    inp.addEventListener('input', e => update({ [key]: e.target.value.toLowerCase() }));
    lab.appendChild(inp); el.appendChild(lab);
  });
  document.querySelectorAll('.chips').forEach(el => {
    const key = el.dataset.key;
    const list = key === 'hairStyle' ? HAIR_STYLES : OUTFITS;
    for (const s of list) {
      const b = document.createElement('button');
      b.className = 'chip'; b.textContent = s.label; b.dataset.value = s.id;
      b.addEventListener('click', () => update({ [key]: s.id }));
      el.appendChild(b);
    }
  });
  document.querySelectorAll('input[type=range]').forEach(inp => {
    inp.addEventListener('input', () => update({ [inp.dataset.key]: parseFloat(inp.value) }));
    inp.addEventListener('change', () => { if (mode === 'create') resetCreatorCamera(); });
  });

  document.getElementById('randomBtn').addEventListener('click', randomize);
  const head = document.getElementById('panelHead');
  head.addEventListener('click', e => {
    if (!isMobile() || e.target.closest('#randomBtn')) return;
    panel.classList.toggle('collapsed');
  });

  const nameIn = document.getElementById('presetName');
  const saveBtn = document.getElementById('saveBtn');
  nameIn.addEventListener('keydown', e => { if (e.key === 'Enter') saveBtn.click(); });
  saveBtn.addEventListener('click', () => {
    const name = (nameIn.value.trim() || cfg.name || 'My character').slice(0, 24);
    if (BUILTIN_PRESETS[name]) { toast('That name is taken by a starter — try another'); return; }
    cfg.name = name;
    presets[name] = { ...cfg };
    if (savePresets(presets)) { toast(`Saved “${name}”`); nameIn.value = ''; }
    else toast('Could not save — storage is unavailable');
    renderPresets();
    try { store.set(CURRENT_KEY, JSON.stringify(cfg)); } catch (e) {}
  });
  if (!store.ok) {
    saveBtn.disabled = true;
    document.getElementById('storageNote').textContent = 'Saving is unavailable in this browser mode (storage blocked). Starter presets still work.';
  }
}

function syncUI() {
  document.querySelectorAll('.swatches').forEach(el => {
    const v = (cfg[el.dataset.key] || '').toLowerCase();
    let matched = false;
    el.querySelectorAll('.sw[data-value]').forEach(b => { const on = b.dataset.value === v; b.classList.toggle('active', on); matched ||= on; });
    const custom = el.querySelector('.sw.custom');
    custom.classList.toggle('active', !matched);
    custom.querySelector('input').value = v;
    if (!matched) custom.style.background = v; else custom.style.background = '';
  });
  document.querySelectorAll('.chips').forEach(el => {
    el.querySelectorAll('.chip').forEach(b => b.classList.toggle('active', b.dataset.value === cfg[el.dataset.key]));
  });
  document.querySelectorAll('input[type=range]').forEach(inp => {
    inp.value = cfg[inp.dataset.key];
    inp.nextElementSibling.textContent = Math.round(cfg[inp.dataset.key] * 100) + '%';
  });
}

function renderPresets() {
  const list = document.getElementById('presetList');
  list.textContent = '';
  const row = (name, c, builtin) => {
    const r = document.createElement('div'); r.className = 'preset';
    const dot = document.createElement('span'); dot.className = 'dot';
    dot.style.background = `linear-gradient(135deg, ${c.hairColor} 50%, ${c.outfitColor} 50%)`;
    const load = document.createElement('button'); load.className = 'load'; load.textContent = name;
    load.title = `Load ${name}`;
    load.addEventListener('click', () => { update({ ...sanitize(c), name }); if (mode === 'create') resetCreatorCamera(); toast(`Loaded “${name}”`); playPose('wave'); });
    r.append(dot, load);
    if (builtin) {
      const tag = document.createElement('span'); tag.className = 'tag'; tag.textContent = 'STARTER'; r.append(tag);
    } else {
      const del = document.createElement('button'); del.className = 'del'; del.textContent = '✕';
      del.title = `Delete ${name}`; del.setAttribute('aria-label', `Delete ${name}`);
      // Two taps to delete (pop-up confirm dialogs are blocked when the page is shared as a Claude artifact).
      del.addEventListener('click', () => {
        if (del.dataset.armed !== '1') {
          del.dataset.armed = '1'; del.textContent = 'Delete?'; del.classList.add('armed');
          toast(`Tap again to delete “${name}”`);
          clearTimeout(del._t);
          del._t = setTimeout(() => { del.dataset.armed = ''; del.textContent = '✕'; del.classList.remove('armed'); }, 3000);
          return;
        }
        delete presets[name]; savePresets(presets); renderPresets(); toast(`Deleted “${name}”`);
      });
      r.append(del);
    }
    list.appendChild(r);
  };
  for (const [n, c] of Object.entries(presets)) row(n, c, false);
  for (const [n, c] of Object.entries(BUILTIN_PRESETS)) row(n, c, true);
}

function randomize() {
  const pick = a => a[Math.floor(Math.random() * a.length)];
  update({
    skin: pick(PALETTES.skin), hairColor: pick(PALETTES.hairColor), eyeColor: pick(PALETTES.eyeColor),
    outfitColor: pick(PALETTES.outfitColor), accentColor: pick(PALETTES.accentColor),
    hairStyle: pick(HAIR_STYLES).id, outfitStyle: pick(OUTFITS).id,
    height: +(0.88 + Math.random() * 0.3).toFixed(2), headSize: +(0.92 + Math.random() * 0.2).toFixed(2),
    name: 'Random',
  });
  playPose(Math.random() < 0.5 ? 'wave' : 'victory');
}

/* =========================================================================
   Boot + loop
   ========================================================================= */
buildWorld();
buildCharacter();
applyConfig(cfg);
buildUI();
syncUI();
renderPresets();
onResize();
resetCreatorCamera();

const clock = new THREE.Clock();
let elapsed = 0;
function frame() {
  const dt = Math.min(0.05, clock.getDelta());
  elapsed += dt;
  if (mode === 'play') updatePlay(dt); else settleCreate(dt);
  animateCharacter(dt, elapsed);
  updateConfetti(dt);
  if (cloudGroup) cloudGroup.rotation.y += dt * 0.006;

  // keep the shadow camera centered on the character
  sun.position.copy(C.root.position).add(SUN_OFFSET);
  sun.target.position.copy(C.root.position);

  controls.update();
  if (!Number.isFinite(camera.position.x + camera.position.y + camera.position.z)) resetCreatorCamera();
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
setTimeout(() => { playPose('wave'); }, 700);
document.getElementById('loading').classList.add('hide');

// tiny debug hook for testing
window.__chibi = { cfg: () => cfg, playPose, enterPlay, enterCreate, resetCreatorCamera, update, C, camera, controls, keys, loco };
</script>
</body>
</html>
