<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#04070d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Slimeborn">
<meta name="format-detection" content="telephone=no">
<title>Slimeborn: Reborn in Another World</title>
<style>
:root{color-scheme:dark;--gold:#7ae8ff;--gold2:#d8f8ff;--ink:#f2f6fa;--dim:#9fb0c4;--panel:rgba(10,18,32,.88);--panel2:rgba(20,34,58,.94);--line:rgba(122,232,255,.33);--red:#ff5f6d;--mp:#5aa8ff;--xp:#ffd86a;--warm:#ffd86a;
--serif:"Avenir Next Rounded","Avenir Next","Trebuchet MS","Segoe UI",system-ui,sans-serif;--sans:"Avenir Next","Segoe UI","Helvetica Neue",system-ui,-apple-system,Roboto,Arial,sans-serif;}
html,body{margin:0;height:100%;overflow:hidden;background:#04070d;color:var(--ink);font-family:var(--sans);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;outline:none;touch-action:none}
html,body{overscroll-behavior:none;-webkit-touch-callout:none}
#hud{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);box-sizing:border-box}
.panel{touch-action:pan-y;-webkit-overflow-scrolling:touch}
[hidden]{display:none!important}
button{font-family:var(--sans);cursor:pointer}
input[type=text]{font-family:var(--sans);font-size:16px;padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:rgba(0,0,0,.35);color:var(--ink);outline:none;width:220px;-webkit-user-select:text;user-select:text}
input[type=text]:focus{border-color:var(--gold)}
textarea{width:100%;box-sizing:border-box;height:160px;font:12px monospace;padding:10px;border-radius:10px;border:1px solid var(--line);background:rgba(0,0,0,.35);color:var(--ink);resize:vertical;-webkit-user-select:text;user-select:text}
/* ---- HUD ---- */
#hud{position:fixed;inset:0;pointer-events:none;transition:opacity .4s}
#hud.off{opacity:0}
.vitals{position:absolute;left:20px;top:18px;display:flex;gap:12px;align-items:flex-start}
.lvl{width:58px;height:58px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#3a6a9a,#0e1a30);border:2px solid var(--gold);display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 0 18px rgba(122,232,255,.3),inset 0 0 10px rgba(0,0,0,.6)}
.lvl b{font-family:var(--serif);font-size:22px;line-height:1;color:var(--gold2)}
.lvl small{font-size:9px;letter-spacing:.12em;color:var(--dim);margin-top:1px}
.bars{display:flex;flex-direction:column;gap:5px;margin-top:2px}
.evoName{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);text-shadow:0 1px 3px #000;font-weight:700}
.bar{position:relative;height:14px;width:280px;background:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.18);border-radius:8px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.4)}
.bar .ghost,.bar .fill{position:absolute;left:0;top:0;bottom:0;border-radius:8px;transition:width .08s}
.bar .ghost{background:rgba(255,255,255,.55);transition:width .6s .25s}
.bar .shield{position:absolute;left:0;top:0;bottom:0;background:rgba(200,220,255,.55);border-radius:8px}
.bar.hp .fill{background:linear-gradient(180deg,#ff8a8a,#e83a4f 55%,#a8203a)}
.bar.mp{height:9px;width:230px}.bar.mp .fill{background:linear-gradient(180deg,#8ad0ff,#3a7ae8)}
.bar.st{height:5px;width:180px}.bar.st .fill{background:linear-gradient(180deg,#fff0a0,#e8c03a)}
.bar.xp{height:5px;width:280px;border-radius:3px}.bar.xp .fill{background:linear-gradient(90deg,#ffb83a,#fff0a0)}
.bar .txt{position:absolute;inset:0;font-size:10px;line-height:14px;text-align:center;font-weight:700;letter-spacing:.04em;text-shadow:0 1px 2px #000}
.bar.mp .txt{line-height:9px;font-size:8px}
.bar.flash{animation:barflash .4s}@keyframes barflash{50%{box-shadow:0 0 0 2px #ff5f6d}}
.party{position:absolute;left:20px;top:112px;display:flex;flex-direction:column;gap:5px}
.pm{display:flex;align-items:center;gap:7px;font-size:11px;font-weight:700;text-shadow:0 1px 2px #000}
.pm .pb{width:110px;height:6px;background:rgba(0,0,0,.55);border-radius:3px;overflow:hidden;border:1px solid rgba(255,255,255,.15)}.pm .pb i{display:block;height:100%;background:linear-gradient(#9aff9a,#3ab05a)}
.pm.down{opacity:.45}
.compass{position:absolute;left:50%;top:12px;transform:translateX(-50%);width:min(520px,36vw);height:30px;overflow:hidden;
 -webkit-mask-image:linear-gradient(90deg,transparent,#000 15%,#000 85%,transparent);mask-image:linear-gradient(90deg,transparent,#000 15%,#000 85%,transparent)}
.compass .strip{position:absolute;inset:0}
.compass .tick{position:absolute;top:8px;transform:translateX(-50%);font-size:12px;font-weight:700;color:var(--ink);text-shadow:0 1px 3px #000;letter-spacing:.1em}
.compass .tick.minor{font-size:9px;color:var(--dim);top:10px}
.compass .mk{position:absolute;top:4px;transform:translateX(-50%);font-size:15px;filter:drop-shadow(0 0 4px rgba(0,0,0,.8))}
.compass::after{content:"";position:absolute;left:50%;top:0;bottom:0;width:2px;background:var(--gold);transform:translateX(-50%);opacity:.6}
.zoneInfo{position:absolute;right:20px;top:16px;text-align:right;max-width:360px}
.zoneInfo .nm{font-family:var(--serif);font-size:20px;color:var(--gold2);text-shadow:0 2px 6px #000;font-weight:700}
.zoneInfo .sub{font-size:11px;color:var(--dim);letter-spacing:.14em;text-transform:uppercase;margin-top:2px;text-shadow:0 1px 3px #000}
.obj{margin-top:12px;display:flex;flex-direction:column;gap:5px;align-items:flex-end}
.obj div{font-size:13px;background:linear-gradient(90deg,transparent,rgba(10,18,32,.72));padding:4px 10px 4px 26px;border-right:2px solid var(--gold);text-shadow:0 1px 2px #000}
.obj div.done{opacity:.55;text-decoration:line-through;border-color:#6a6}
.abil{position:absolute;left:50%;bottom:20px;transform:translateX(-50%);display:flex;gap:8px;align-items:flex-end}
.slot{position:relative;width:52px;height:52px;border-radius:12px;background:radial-gradient(circle at 40% 30%,rgba(50,90,130,.9),rgba(10,18,32,.92));border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:23px;box-shadow:0 4px 14px rgba(0,0,0,.5);overflow:hidden}
.slot .k{position:absolute;left:4px;top:2px;font-size:10px;color:var(--dim);font-weight:700}
.slot .cd{position:absolute;inset:0;background:conic-gradient(rgba(0,0,0,.72) var(--p,0%),transparent 0);}
.slot .n{position:absolute;right:4px;bottom:2px;font-size:11px;font-weight:800;color:#fff;text-shadow:0 1px 2px #000}
.slot.empty{opacity:.35}.slot.ready{animation:ready .5s}@keyframes ready{50%{box-shadow:0 0 18px var(--gold)}}
.slot.nomp .ic{filter:grayscale(1) brightness(.6)}
.slot.sep{margin-left:10px}.slot.pot{border-color:rgba(124,255,154,.5)}.slot.form{border-color:rgba(255,216,106,.5)}.slot.dev{border-color:rgba(255,120,200,.55)}
.slot.dev.hot{animation:hot 1s infinite}@keyframes hot{50%{box-shadow:0 0 22px #ff7ad8;border-color:#ff7ad8}}
.wallet{position:absolute;right:20px;bottom:20px;display:flex;flex-direction:column;align-items:flex-end;gap:3px;font-size:13px;font-weight:700;text-shadow:0 1px 3px #000}
.wallet span{display:flex;align-items:center;gap:6px}
.prompt{position:absolute;left:50%;bottom:104px;transform:translateX(-50%);background:var(--panel);border:1px solid var(--line);padding:8px 16px;border-radius:24px;font-size:15px;display:flex;gap:10px;align-items:center;box-shadow:0 6px 20px rgba(0,0,0,.4);white-space:nowrap}
.key{display:inline-flex;align-items:center;justify-content:center;min-width:24px;height:24px;padding:0 6px;border-radius:6px;background:#dff6ff;color:#0a1a2a;font-weight:800;font-size:13px;box-shadow:0 2px 0 #6a9ab0}
.bossbar{position:absolute;left:50%;bottom:92px;transform:translateX(-50%);width:min(640px,70vw);text-align:center}
.bossbar .bn{font-family:var(--serif);font-size:19px;color:#ffd9d0;text-shadow:0 2px 6px #000;margin-bottom:5px;letter-spacing:.04em;font-weight:700}
.bossbar .bar{width:100%;height:16px}.bossbar .bar .fill{background:linear-gradient(180deg,#ff9a6a,#d83a2a 60%,#8a1a1a)}
.bossbar .ph{font-size:11px;color:var(--dim);margin-top:4px;letter-spacing:.1em}
#ehp{position:fixed;inset:0;pointer-events:none}
.ehp{position:absolute;width:80px;transform:translate(-50%,-100%);text-align:center}
.ehp .nm{font-size:10px;font-weight:700;text-shadow:0 1px 2px #000;white-space:nowrap;margin-bottom:2px}
.ehp .b{height:5px;background:rgba(0,0,0,.6);border-radius:3px;overflow:hidden;border:1px solid rgba(255,255,255,.2)}.ehp .b i{display:block;height:100%;background:linear-gradient(#ff7a7a,#c82a3a)}
.ehp.elite .nm{color:#ffb0e8}.ehp.elite .b i{background:linear-gradient(#ffb0e8,#c83ab0)}
.ehp.weak .b{box-shadow:0 0 8px #ff7ad8}
.ehp.ally .nm{color:#a8ffb0}.ehp.ally .b i{background:linear-gradient(#a8ffb0,#3ab05a)}
.ehp .tag{font-size:16px;line-height:16px;filter:drop-shadow(0 0 4px #000)}
#dnums{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.dnum{position:absolute;left:0;top:0;font-weight:900;font-size:20px;text-shadow:0 2px 0 rgba(0,0,0,.6),0 0 6px rgba(0,0,0,.5);white-space:nowrap;will-change:transform}
#toasts{position:fixed;left:20px;top:200px;display:flex;flex-direction:column;gap:6px;pointer-events:none;max-width:360px}
.toast{background:var(--panel);border-left:3px solid var(--gold);padding:7px 12px;border-radius:6px;font-size:13px;box-shadow:0 4px 14px rgba(0,0,0,.4);animation:tin .25s ease-out}
.toast.item{display:flex;gap:10px;align-items:center}
@keyframes tin{from{transform:translateX(-20px);opacity:0}}
#echo{position:fixed;left:50%;top:58px;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;width:min(620px,90vw)}
.echo{background:linear-gradient(90deg,rgba(6,30,50,.0),rgba(6,30,50,.9) 12%,rgba(6,30,50,.9) 88%,rgba(6,30,50,0));padding:7px 40px;font-size:14px;color:#dff8ff;text-align:center;text-shadow:0 0 10px rgba(90,220,255,.6),0 1px 2px #000;animation:ein .35s ease-out;border-top:1px solid rgba(122,232,255,.35);border-bottom:1px solid rgba(122,232,255,.35)}
.echo b.e{color:#7ae8ff;letter-spacing:.08em;margin-right:6px}
.echo .hl{color:#ffe08a;font-weight:800}
@keyframes ein{from{opacity:0;transform:scaleX(.6)}}
#gains{position:fixed;right:20px;bottom:120px;display:flex;flex-direction:column;align-items:flex-end;gap:3px;pointer-events:none}
.gain{font-size:13px;font-weight:800;text-shadow:0 1px 3px #000;animation:gain 1.6s forwards}@keyframes gain{0%{opacity:0;transform:translateY(6px)}15%{opacity:1;transform:none}75%{opacity:1}100%{opacity:0}}
#banner{position:fixed;left:0;right:0;top:28%;text-align:center;pointer-events:none}
#banner .t{font-family:var(--serif);font-weight:800;font-size:clamp(28px,5vw,54px);color:var(--gold2);text-shadow:0 0 24px rgba(122,232,255,.6),0 3px 8px #000;letter-spacing:.03em;animation:ban 2.8s forwards}
#banner .s{font-size:15px;color:var(--ink);letter-spacing:.2em;text-transform:uppercase;margin-top:8px;text-shadow:0 2px 6px #000;animation:ban 2.8s forwards}
@keyframes ban{0%{opacity:0;transform:scale(.9)}12%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0}}
#dialog{position:fixed;left:50%;bottom:140px;transform:translateX(-50%);width:min(700px,90vw);background:linear-gradient(180deg,rgba(14,26,46,.95),rgba(8,14,28,.95));border:1px solid var(--line);border-radius:14px;padding:16px 20px 14px;box-shadow:0 10px 40px rgba(0,0,0,.6);pointer-events:auto;z-index:4}
#dialog .who{font-family:var(--serif);color:var(--gold);font-size:17px;margin-bottom:6px;display:flex;align-items:center;gap:8px;font-weight:800}
#dialog .who i{width:12px;height:12px;border-radius:50%;background:#7ae8ff;box-shadow:0 0 12px #7ae8ff}
#dialog.echoD{border-color:rgba(122,232,255,.7);box-shadow:0 0 30px rgba(90,220,255,.25),0 10px 40px rgba(0,0,0,.6)}
#dialog .txt{font-size:16px;line-height:1.5;min-height:48px}
#dialog .more{text-align:right;font-size:11px;color:var(--dim);margin-top:6px;letter-spacing:.1em}
#fps{position:fixed;left:6px;bottom:4px;font:11px monospace;color:#9f9;pointer-events:none;text-shadow:0 1px 2px #000}
/* ---- menus ---- */
#menu{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at center,rgba(4,10,20,.35),rgba(4,10,20,.78));pointer-events:auto;z-index:5}
#menu.clear{background:none}
.panel{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:18px;box-shadow:0 20px 60px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.06);padding:22px 26px;max-width:min(1080px,95vw);max-height:90vh;overflow:auto;position:relative}
.panel h1,.panel h2{font-family:var(--serif);font-weight:800;color:var(--gold2);margin:0 0 12px;letter-spacing:.02em}
.panel h1{font-size:28px}.panel h2{font-size:21px}
.panel h3{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);margin:14px 0 8px;font-weight:700}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:linear-gradient(180deg,#a8f0ff,#3ab8e0);color:#06202e;border:none;border-radius:10px;padding:10px 18px;font-weight:800;font-size:14px;box-shadow:0 3px 0 #1a6a8a,0 6px 14px rgba(0,0,0,.35);transition:transform .08s,filter .15s;letter-spacing:.02em}
.btn:hover{filter:brightness(1.08);transform:translateY(-1px)}.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #1a6a8a}
.btn.sec{background:linear-gradient(180deg,#2e4a6a,#1a2c46);color:var(--ink);box-shadow:0 3px 0 #0e1a2c,0 6px 14px rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.1)}
.btn.gold{background:linear-gradient(180deg,#ffe9a0,#e8b03a);color:#2a1a04;box-shadow:0 3px 0 #8a6420,0 6px 14px rgba(0,0,0,.35)}
.btn.red{background:linear-gradient(180deg,#ff8a8a,#c83a4a);color:#fff;box-shadow:0 3px 0 #7a1a2a}
.btn:disabled{filter:grayscale(1) brightness(.6);cursor:not-allowed;transform:none}
.btn.sm{padding:6px 11px;font-size:12px;border-radius:8px}
.col{display:flex;flex-direction:column;gap:10px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.x{position:absolute;right:14px;top:12px;background:none;border:none;color:var(--dim);font-size:22px;line-height:1}
.x:hover{color:#fff}
.tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap;padding-right:30px}.tab{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);color:var(--dim);padding:7px 13px;border-radius:20px;font-weight:700;font-size:13px}
.tab.on{background:var(--gold);color:#06202e;border-color:var(--gold)}
#title{position:fixed;left:0;right:0;top:8vh;pointer-events:none;display:flex;flex-direction:column;align-items:center}
.logo{font-family:var(--serif);font-weight:900;font-size:clamp(48px,9vw,108px);color:#e8fbff;letter-spacing:.06em;text-shadow:0 0 40px rgba(90,220,255,.6),0 4px 12px rgba(0,0,0,.6);line-height:1}
.logo2{font-size:clamp(13px,1.6vw,18px);letter-spacing:.45em;color:var(--gold);text-transform:uppercase;margin-top:10px;text-shadow:0 2px 8px #000}
.slots{display:grid;grid-template-columns:repeat(3,minmax(200px,1fr));gap:14px;margin-top:6px}
.scard{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:8px;min-height:150px}
.scard .big{font-family:var(--serif);font-size:20px;color:var(--gold2);font-weight:800}.scard .meta{font-size:12px;color:var(--dim);line-height:1.6}
.grid{display:grid;gap:6px}
.cell{position:relative;width:52px;height:52px;border-radius:9px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);display:flex;align-items:center;justify-content:center;font-size:22px;cursor:pointer}
.cell:hover{border-color:var(--gold)}.cell.sel{outline:2px solid var(--gold)}
.cell .lv{position:absolute;right:3px;bottom:1px;font-size:9px;font-weight:800;color:#fff;text-shadow:0 1px 2px #000}
.cell .up{position:absolute;left:3px;top:1px;font-size:9px;font-weight:800;color:var(--warm)}
.tip{background:rgba(4,8,16,.9);border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:12px 14px;min-width:240px;font-size:13px;line-height:1.55}
.tip .nm{font-family:var(--serif);font-size:17px;font-weight:800}.tip .rr{font-size:11px;letter-spacing:.14em;text-transform:uppercase;opacity:.8}
.stat{display:flex;justify-content:space-between;gap:20px;font-size:13px;padding:3px 0;border-bottom:1px dashed rgba(255,255,255,.07)}.stat b{color:var(--gold2)}
.better{color:#7cff9a}.worse{color:#ff8a8a}
.card{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:10px 12px;display:flex;gap:10px;align-items:center}
.card .ic{font-size:26px;width:36px;text-align:center}.card .nm{font-weight:800;font-size:14px}.card .ds{font-size:12px;color:var(--dim);line-height:1.45}.card .rk{margin-left:auto;font-weight:800;color:var(--gold2);font-size:13px;white-space:nowrap;text-align:right}
.card.lock{opacity:.42}.card.on{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:8px}
.pbar{height:6px;background:rgba(0,0,0,.5);border-radius:3px;overflow:hidden;margin-top:5px}.pbar i{display:block;height:100%;background:linear-gradient(90deg,#3ab8e0,#a8f0ff)}
.cost{display:flex;gap:8px;flex-wrap:wrap;font-size:12px;font-weight:700}.cost span{display:inline-flex;gap:3px;align-items:center}.cost .no{color:#ff8a8a}
.mapgrid{display:grid;grid-template-columns:repeat(20,22px);gap:3px}
.mi{width:22px;height:22px;border-radius:5px;background:rgba(255,255,255,.07);cursor:pointer;font-size:10px;display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.6);font-weight:700}
.mi.un{background:rgba(122,232,255,.3);color:#fff}.mi.cl{background:var(--gold);color:#06202e}.mi.cur{outline:2px solid #fff}.mi.w{border-radius:50%}.mi.b{transform:scale(1.15);box-shadow:0 0 8px rgba(255,120,80,.9);border-radius:4px}
.mi.lk{cursor:default;opacity:.4}
.mi:hover:not(.lk){outline:2px solid #fff}
.regions{display:flex;flex-direction:column;gap:6px;min-width:250px}
.rg{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:10px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);cursor:pointer;font-size:13px}
.rg.on{border-color:var(--gold);background:rgba(122,232,255,.1)}.rg.lk{opacity:.45}
.rg b{font-size:14px}.rg small{color:var(--dim);display:block}
.swatch{width:30px;height:30px;border-radius:50%;border:2px solid rgba(255,255,255,.2);cursor:pointer}.swatch.on{border-color:#fff;box-shadow:0 0 10px #fff}
input[type=range]{width:200px;accent-color:#3ab8e0}
.lore{font-family:var(--serif);font-size:18px;line-height:1.7;color:#eef6ff;max-width:620px;white-space:pre-wrap}
.loading{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:12vh;pointer-events:none;z-index:6;background:#04070d}
.loading .ln{font-family:var(--serif);font-weight:800;font-size:34px;color:var(--gold2);text-shadow:0 2px 12px #000}.loading .ls{font-size:13px;letter-spacing:.3em;color:var(--dim);text-transform:uppercase;margin-top:6px}
.loading .tip2{font-size:14px;color:#cfe0ee;margin-top:22px;max-width:560px;text-align:center;line-height:1.5}
